// --- EXCEL PV SIMULATOR (Function Arguments Dialog) ---
const ExcelPVSimulator = () => {
    const [rate, setRate] = React.useState("");
    const [nper, setNper] = React.useState("");
    const [pmt, setPmt] = React.useState("");
    const [fv, setFv] = React.useState("");

    const calcPV = () => {
        let r = parseFloat(rate.replace('%','')) / (rate.includes('%') ? 100 : 1);
        let n = parseFloat(nper);
        let p = parseFloat(pmt);
        let f = parseFloat(fv);
        
        if(isNaN(r) || isNaN(n)) return null;
        p = isNaN(p) ? 0 : p;
        f = isNaN(f) ? 0 : f;

        let pv;
        if (r === 0) pv = -(p * n + f);
        else pv = -(p / r * (1 - Math.pow(1 + r, -n)) + f * Math.pow(1 + r, -n));
        return pv;
    };

    const pvVal = calcPV();
    const displayVal = pvVal !== null 
        ? pvVal.toLocaleString('en-US', {style:'currency', currency:'USD'}) 
        : "---";

    return (
        <div className="bg-white border border-emerald-500/30 rounded-xl shadow-lg shadow-emerald-900/5 overflow-hidden mb-6 font-sans group transition-all duration-300 hover:shadow-emerald-900/10 hover:border-emerald-500/50">

                <Icon name="table" className="w-4 h-4 opacity-90" /> Excel Function Arguments: PV
            </div>
            <div className="p-5 text-sm bg-emerald-50/20">
                <div className="grid grid-cols-2 gap-x-5 gap-y-4">
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-slate-700 w-12">Rate</label>
                        <input type="text" value={rate} onChange={e=>setRate(e.target.value)} className="border border-slate-300 rounded-lg p-2 w-full md:w-32 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-right font-mono transition-shadow shadow-inner bg-white" placeholder="0.04" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-slate-700 w-12">Nper</label>
                        <input type="number" value={nper} onChange={e=>setNper(e.target.value)} className="border border-slate-300 rounded-lg p-2 w-full md:w-32 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-right font-mono transition-shadow shadow-inner bg-white" placeholder="30" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-slate-700 w-12">Pmt</label>
                        <input type="number" value={pmt} onChange={e=>setPmt(e.target.value)} className="border border-slate-300 rounded-lg p-2 w-full md:w-32 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-right font-mono transition-shadow shadow-inner bg-white" placeholder="-15000" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-slate-700 w-12">Fv</label>
                        <input type="number" value={fv} onChange={e=>setFv(e.target.value)} className="border border-slate-300 rounded-lg p-2 w-full md:w-32 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-right font-mono transition-shadow shadow-inner bg-white" placeholder="-300000" />
                    </div>
                </div>
                
                <div className="border-t border-slate-200 mt-5 pt-4 flex justify-between items-center -mx-5 -mb-5 px-5 pb-5 bg-slate-50/80">

            </div>

    );
};

const Calculator = ({ isOpen, onClose }) => {
    const [input, setInput] = React.useState("");
    const [result, setResult] = React.useState("");

    React.useEffect(() => {
        if (!isOpen) {
            setInput("");
            setResult("");
        }
    }, [isOpen]);

    if (!isOpen) return null;

    const safeEval = (exp) => {
        if (!exp) return null;
        const clean = exp.toString().replace(/,/g, "");
        if (!/^[0-9+\-*/().\s]+$/.test(clean)) return null;
        try {
            const res = new Function("return " + clean)();
            if (typeof res !== "number" || !isFinite(res)) return null;
            return res;
        } catch (e) {
            return null;
        }
    };

    const handleClick = (val) => {
        if (val === "=") {
            const res = safeEval(input);
            if (res === null) {
                setResult("Error");
                return;
            }
            setResult(Number(res).toLocaleString(undefined, { maximumFractionDigits: 8 }));
            setInput(String(res));
            return;
        }
        if (val === "C") {
            setInput("");
            setResult("");
            return;
        }
        if (val === "⌫") {
            setInput((prev) => prev.slice(0, -1));
            return;
        }
        setInput((prev) => prev + val);
    };

    const buttons = [
        "C","⌫","(",")",
        "7","8","9","/",
        "4","5","6","*",
        "1","2","3","-",
        "0",".","=","+"
    ];

    return (
        <>
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[240] md:hidden transition-opacity" onClick={onClose}></div>
            <div className="fixed z-[250] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden instructor-toolbar 
                            top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-[320px] 
                            md:top-24 md:left-auto md:right-6 md:translate-x-0 md:translate-y-0 md:w-64 transition-all duration-300">
                <div className="bg-gradient-to-r from-slate-100 to-slate-50 p-2.5 border-b border-slate-200 flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-2 flex items-center gap-1.5">
                        <Icon name="calculator" className="w-3.5 h-3.5" /> Calculator
                    </span>
                    <button
                        onClick={onClose}
                        className="p-1.5 hover:bg-slate-200/80 rounded-md text-slate-400 hover:text-slate-600 transition-colors"
                        title="Close"
                    >
                        <Icon name="x" className="w-4 h-4" />
                    </button>
                </div>
                <div className="p-5 bg-slate-900 text-right shadow-inner relative">
                    <div className="absolute inset-0 bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
                    <div className="text-indigo-300 text-xs h-4 mb-1 truncate relative z-10 font-mono tracking-wider">
                        {result !== "" ? input : ""}
                    </div>
                    <div className="text-white text-3xl font-mono font-bold truncate relative z-10 tracking-tight">
                        {result !== "" ? result : (input || "0")}
                    </div>
                </div>
                <div className="grid grid-cols-4 gap-px bg-slate-200 border-t border-slate-200">
                    {buttons.map((btn) => (
                        <button
                            key={btn}
                            onClick={() => handleClick(btn)}
                            className={`p-4 md:p-3.5 text-lg md:text-sm font-bold transition-all active:scale-[0.97] touch-manipulation ${
                                btn === "="
                                    ? "bg-indigo-600 text-white hover:bg-indigo-700"
                                    : ["C","⌫"].includes(btn)
                                    ? "bg-rose-50 text-rose-600 hover:bg-rose-100"
                                    : ["/","*","-","+"].includes(btn)
                                    ? "bg-slate-100 text-indigo-700 hover:bg-slate-200"
                                    : "bg-white text-slate-700 hover:bg-slate-50"
                            }`}
                        >
                            {btn}
                        </button>
                    ))}
                </div>
            </div>
        </>
    );
};

const SmartInput = ({ id, value, onChange, isPct, correctValueEncoded, instructorMode, onFocus, isFocused, small = false }) => {
    
    // Evaluates math & basic Excel macros (like =PV)
    const evaluateExpression = (expression) => {
        if (!expression) return { val: "", valid: false };
        let cleanExp = expression.toString().replace(/,/g, '');
        
        // Convert '50%' to 0.5
        cleanExp = cleanExp.replace(/(\d+(\.\d+)?)%/g, (match, p1) => parseFloat(p1) / 100);
        
        // Intercept Excel =PV(rate, nper, pmt, fv)
        cleanExp = cleanExp.replace(/(^|=)PV\(([^)]+)\)/gi, (match, prefix, args) => {
             try {
                const evaluatedArgs = new Function('return [' + args + ']')();
                const [r, n, p, f] = evaluatedArgs.map(v => parseFloat(v)||0);
                if (r===0) return -(p*n+f);
                return -(p/r*(1-Math.pow(1+r,-n)) + f*Math.pow(1+r,-n));
             } catch(e) { return match; }
        });

        if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(cleanExp)) return { val: expression, valid: false };
        try {
            const result = new Function('return ' + cleanExp)();
            return { val: parseFloat(result.toFixed(4)), valid: true };
        } catch (e) { return { val: expression, valid: false }; }
    };

    const handleChange = (e) => {
        onChange(id, e.target.value);
    };

    const handleBlur = (e) => {
        const val = e.target.value;
        const { val: calculated, valid } = evaluateExpression(val);
        if (valid && calculated != val) {
            onChange(id, calculated);
        }
    };

    let status = "neutral";
    const correctValue = d(correctValueEncoded);

    if (value !== "" && value !== undefined && correctValue !== undefined) {
        const numVal = parseFloat(value);
        if (!isNaN(numVal)) {
            const margin = Math.abs(correctValue * 0.02); // 2% Error Margin
            let isCorrect = Math.abs(numVal - correctValue) <= margin;

            if (!isCorrect) {
                const asPercentDecimal = numVal / 100;
                if (Math.abs(asPercentDecimal - correctValue) <= margin) {
                    isCorrect = true;
                }
            }

            if (!isCorrect) {
                const asWholeNumber = numVal * 100;
                if (Math.abs(asWholeNumber - correctValue) <= (Math.abs(correctValue * 0.02))) {
                    isCorrect = true;
                }
            }
            
            status = isCorrect ? "correct" : "incorrect";
        }

const ReferenceItem = ({ data, onNumberClick }) => {
    const renderCell = (content) => {
        const numRegex = /^[\$]?[\(\-]?[0-9,]+(\.[0-9]+)?[\)]?%?$/;
        if (numRegex.test(content) && content !== "-" && content !== "N/A") {
            return (
                <span 
                    className="clickable-number" 
                    title="Tap to insert"
                    onMouseDown={(e) => {
                        e.preventDefault(); 
                        let clean = content.replace(/[^0-9\.-]/g, '');
                        if (content.includes('(')) clean = '-' + clean;
                        if (content.includes('%')) clean = (parseFloat(clean)/100).toString();
                        onNumberClick(clean);
                    }}
                >
                    {content}
                </span>
            );
        }
        return content;
    };

    if (data.type === 'key-value') {
         return (
            <div className="mb-5 bg-white border border-slate-200/60 rounded-xl shadow-sm overflow-hidden transition-shadow hover:shadow-md">
                {data.title && <div className="p-2.5 bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-700 tracking-wide uppercase">{data.title}</div>}
                <div className="p-3 grid grid-cols-2 gap-y-3 gap-x-2 text-sm">
                    {data.data.map((pair, idx) => (
                        <React.Fragment key={idx}>
                            <div className="text-slate-500 font-medium pr-2">{pair[0]}:</div>
                            <div className="font-mono text-slate-800 text-right">{renderCell(pair[1])}</div>
                        </React.Fragment>
                    ))}
                </div>
            </div>
         );
    }
    if (data.type === 'sections') {
        return (
            <div className="space-y-3">
                {data.sections.map((sec, idx) => <ReferenceItem key={idx} data={sec} onNumberClick={onNumberClick} />)}
            </div>
        );
    }
    return null;
};

    };

    return (
        <div className="space-y-8">
            {questions.map((q, idx) => {
                const userSelection = answers[q.id];
                const isAnswered = !!userSelection;
                
                return (

                                            if (opt === q.answer) {

                                                <Icon name="check-circle-2" className="w-5 h-5 text-emerald-500 shrink-0" />

    const generatedAmortRows = React.useMemo(() => {
        const rows = [];
        let currentNbv = 351876; // Start Issue Price

            let pmt = 15000;
            let exp = Math.round(currentNbv * 0.04);

            // Adjust final period precisely to face value 
            if (p === 30) {
                amo = currentNbv - 300000;
                exp = pmt - amo;

            currentNbv -= amo;
            rows.push({ p, pmt, exp, amo, end: currentNbv });

        return rows;

                    {/* Module 3: Amortization Table */}
                    {activeModule === 'm3' && (
                        <div className="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-200/60 ring-1 ring-slate-900/5">
                            <h3 className="font-bold text-xl text-indigo-900 mb-3 tracking-tight">Amortization Table (15 Years / 30 Periods)</h3>
                            <p className="text-base text-slate-600 mb-6 leading-relaxed max-w-3xl">
                                Fill out the inputs for the first 3 rows (Periods 0, 1, and 2). The rest of the 30-period table has been simulated for you, tapering off to exactly face value ($300,000) at maturity.
                            </p>
                            
                            <div className="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar border border-slate-200 shadow-sm rounded-xl">
                                <div className="min-w-[850px]">
                                    <table className="w-full text-sm text-left relative">
                                        <thead className="bg-slate-50 text-slate-600 uppercase tracking-wider text-xs sticky top-0 z-10 shadow-sm border-b border-slate-200">
                                            <tr>
                                                <th className="p-3 text-center font-semibold w-16 border-r border-slate-200">Period</th>
                                                <th className="p-3 text-center font-semibold w-32 border-r border-slate-200">Interest Paid</th>
                                                <th className="p-3 text-center font-semibold w-32 text-rose-700 bg-rose-50/80 border-r border-slate-200 backdrop-blur-sm">Interest Expense</th>
                                                <th className="p-3 text-center font-semibold w-32 text-violet-700 bg-violet-50/80 border-r border-slate-200 backdrop-blur-sm">Amortization</th>
                                                <th className="p-3 text-center font-semibold w-36 text-indigo-700 bg-indigo-50/80 backdrop-blur-sm">Ending NBV</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {/* Period 0 (Input) */}
                                            <tr className="bg-white hover:bg-slate-50/50">
                                                <td className="p-3 text-center font-bold text-slate-800 border-r border-slate-100">0</td>
                                                <td className="p-3 text-center text-slate-300 border-r border-slate-100">—</td>
                                                <td className="p-3 text-center bg-rose-50/20 text-slate-300 border-r border-slate-100">—</td>
                                                <td className="p-3 text-center bg-violet-50/20 text-slate-300 border-r border-slate-100">—</td>
                                                <td className="p-2 bg-indigo-50/30">
                                                    {renderInput("m3_p0_end", null, false, null, "mb-0", true)}
                                                </td>
                                            </tr>
                                            
                                            {/* Periods 1 & 2 (Inputs) */}
                                            {[1,2].map(p => (
                                                <tr key={`p${p}`} className="bg-amber-50/30 hover:bg-amber-50/60 transition-colors">
                                                    <td className="p-3 text-center font-bold text-slate-800 border-r border-slate-100">{p}</td>
                                                    <td className="p-3 text-center font-mono font-medium text-slate-700 border-r border-slate-100">15,000</td>
                                                    <td className="p-2 bg-rose-50/30 border-r border-slate-100">{renderInput(`m3_p${p}_exp`, null, false, null, "mb-0", true)}</td>
                                                    <td className="p-2 bg-violet-50/30 border-r border-slate-100">{renderInput(`m3_p${p}_amo`, null, false, null, "mb-0", true)}</td>
                                                    <td className="p-2 bg-indigo-50/30">{renderInput(`m3_p${p}_end`, null, false, null, "mb-0", true)}</td>
                                                </tr>
                                            ))}

                                            {/* Periods 3-30 (Simulated / Read-only) */}
                                            {generatedAmortRows.slice(2).map(row => (
                                                <tr key={`p${row.p}`} className="bg-white hover:bg-slate-50/80 text-slate-600 transition-colors">
                                                    <td className="p-3 text-center font-medium border-r border-slate-50">{row.p}</td>
                                                    <td className="p-3 text-center font-mono border-r border-slate-50">{row.pmt.toLocaleString()}</td>
                                                    <td className="p-3 text-center font-mono bg-rose-50/10 border-r border-slate-50 text-rose-900/70">{row.exp.toLocaleString()}</td>
                                                    <td className="p-3 text-center font-mono bg-violet-50/10 border-r border-slate-50 text-violet-900/70">{row.amo.toLocaleString()}</td>
                                                    <td className={`p-3 text-center font-mono bg-indigo-50/10 text-indigo-900/80 ${row.p===30 ? 'font-bold bg-indigo-100/50' : ''}`}>
                                                        {row.end.toLocaleString()}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Module 4: Repurchase */}
                    {activeModule === 'm4' && (
                        <div className="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-200/60 ring-1 ring-slate-900/5">
                            <h3 className="font-bold text-xl text-indigo-900 mb-3 tracking-tight">Repurchase at End of Year 5</h3>
                            <p className="text-base text-slate-600 mb-8 leading-relaxed max-w-3xl">
                                Assume that at the end of year 5, Comcast repurchases the bonds on the open market. The effective semiannual interest rate has fallen to 2%. What will Comcast pay to repurchase these bonds? Determine any gain or loss on the repurchase transaction.
                            </p>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 shadow-inner">
                                    <h4 className="font-bold text-slate-800 mb-5 flex items-center gap-2 text-lg">
                                        <span className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                                        Market Value (Repurchase Price)
                                    </h4>
                                    <div className="space-y-1">
                                        {renderInput("m4_nper", "Remaining Periods")}
                                        {renderInput("m4_rate", "New Market Rate (Semiannual)", true)}
                                    </div>
                                    
                                    <div className="mt-8">
                                        <ExcelPVSimulator />
                                    </div>

                                    <div className="bg-gradient-to-br from-indigo-50 to-blue-50 p-4 rounded-xl border border-indigo-200/50 mt-4 shadow-sm relative overflow-hidden">
                                        <div className="absolute right-0 bottom-0 opacity-10 translate-x-4 translate-y-4">
                                            <Icon name="dollar-sign" className="w-20 h-20" />
                                        </div>
                                        <div className="relative z-10">
                                            {renderInput("m4_market", "Market Value of Bond", false, null, "mb-0")}
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 shadow-inner h-fit">
                                    <h4 className="font-bold text-slate-800 mb-5 flex items-center gap-2 text-lg">
                                        <span className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                                        Gain or Loss
                                    </h4>
                                    {renderInput("m4_book", "Book Value of Bond (End Year 5)")}
                                    <div className="bg-gradient-to-br from-white to-slate-100 p-4 rounded-xl border border-slate-200 mt-6 shadow-sm">
                                        {renderInput("m4_gain_loss", "Gain / (Loss) on Repurchase", false, null, "mb-0")}
                                        <p className="text-xs text-slate-500 mt-2 font-medium flex items-center gap-1.5 bg-white p-2 rounded-md border border-slate-100">
                                            <Icon name="info" className="w-3.5 h-3.5 text-slate-400" />
                                            Use a negative sign for a Loss.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    </div>

                    {/* Instructor Answer Key Table */}
                    {instructorMode && (
                        <div className="mt-12 border-t-2 border-dashed border-violet-200 pt-8 mb-32 animate-in slide-in-from-bottom-4 duration-500">
                            <h3 className="text-xl font-bold text-violet-900 mb-5 flex items-center gap-2.5">
                                <span className="bg-violet-100 p-1.5 rounded-lg text-violet-700">
                                    <Icon name="key" className="w-5 h-5" />
                                </span>
                                Master Answer Key
                            </h3>
                            <div className="bg-white rounded-2xl shadow-md border border-violet-200 overflow-hidden">
                                <div className="overflow-x-auto custom-scrollbar">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-violet-50 text-violet-900 uppercase tracking-wider text-xs border-b border-violet-100">
                                        <tr>
                                            <th className="p-4 font-bold">Input Field Label</th>
                                            <th className="p-4 font-bold text-right">Correct Value</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-violet-50">
                                        {Object.entries(_DATA_MATRIX).map(([key, data]) => (
                                            <tr key={key} className="hover:bg-violet-50/50 transition-colors">
                                                <td className="p-4 font-medium text-slate-700">{data.label}</td>
                                                <td className="p-4 font-mono font-bold text-violet-700 text-right">
                                                    <span className="bg-white px-2 py-1 rounded border border-violet-100 shadow-sm">
                                                        {data.isPct ? (d(data.val) * 100).toFixed(2) + "%" : d(data.val).toLocaleString()}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                {/* Right Panel: Data Source */}
                <div className="lg:w-80 flex-shrink-0 flex flex-col mb-20 lg:mb-0">
                    <div className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200/80 shadow-sm h-full overflow-y-auto custom-scrollbar sticky top-4">
                        <h3 className="text-xs font-bold text-indigo-800 uppercase tracking-wider mb-4 flex items-center gap-2 pb-3 border-b border-indigo-100">
                            <span className="bg-indigo-100 text-indigo-700 p-1 rounded">
                                <Icon name="database" className="w-4 h-4" />
                            </span>
                            Data Source
                        </h3>
                        {refs ? refs.map((ref, i) => (
                            <ReferenceItem key={i} data={ref} onNumberClick={handleNumberClick} />
                        )) : <div className="text-sm text-slate-400 font-medium p-4 text-center border-2 border-dashed border-slate-200 rounded-xl">No reference data needed for this section.</div>}
                        
                        <div className="mt-6 p-4 bg-gradient-to-br from-indigo-50 to-blue-50 text-indigo-900 text-sm rounded-xl border border-indigo-100/60 shadow-inner flex gap-3">
                            <Icon name="mouse-pointer-click" className="w-5 h-5 shrink-0 text-indigo-500" />
                            <span className="leading-snug font-medium">Tap any dotted number in the tables above to insert it into your selected input field.</span>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    return (
        <div className="flex flex-col h-full">
            <header className="bg-slate-900 text-white p-3 md:p-4 flex justify-between items-center shadow-md sticky-header z-50 shrink-0">
                <div className="flex items-center gap-3">
                    <div className="p-2 bg-indigo-600 rounded-lg"><Icon name="bar-chart-3" className="w-6 h-6 text-white" /></div>
                    <div>
                        <h1 className="text-lg md:text-xl font-bold tracking-tight">Comcast Bond Sim</h1>
                    </div>
                </div>
                <div className="flex items-center gap-2 md:gap-3">
                    <input type="text" placeholder="Your Name" className="bg-slate-800 border-slate-700 px-3 py-1 rounded text-sm text-white w-28 md:w-auto outline-none focus:ring-1 focus:ring-indigo-500" />
                    <button
                        onClick={() => setShowCalculator(prev => !prev)}
                        className="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded text-sm font-medium flex items-center gap-2 transition"
                        title="Open Calculator"
                    >
                        <Icon name="calculator" className="w-4 h-4" />
                        <span className="hidden md:inline">Calc</span>
                    </button>
                    <button 
                        onClick={() => instructorMode ? setInstructorMode(false) : setShowAuthModal(true)}
                        className={`opacity-20 hover:opacity-100 flex items-center gap-2 px-3 py-2 rounded text-sm font-medium transition-all ${instructorMode ? 'bg-violet-600 text-white opacity-100' : 'text-white'}`}
                    >
                        <Icon name={instructorMode ? "unlock" : "lock"} className="w-4 h-4" />
                    </button>
                </div>
            </header>

            {/* Sticky Instructor Toolbar */}
            {instructorMode && (
                <div className="bg-violet-700 text-white p-2 shadow-md flex items-center justify-between z-40 instructor-toolbar shrink-0 overflow-x-auto">
                    <div className="flex items-center gap-2 md:gap-3 px-2 md:px-4 shrink-0">
                        <span className="bg-white/20 p-1.5 rounded"><Icon name="graduation-cap" className="w-4 h-4"/></span>
                        <span className="font-bold tracking-wide text-xs md:text-sm">INSTRUCTOR</span>
                    </div>
                    <div className="flex gap-2 px-2 md:px-4 shrink-0">
                        <button onClick={autoFillAll} className="flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 bg-emerald-500 hover:bg-emerald-600 rounded text-xs md:text-sm font-bold transition">
                            <Icon name="wand-2" className="w-3 h-3 md:w-4 md:h-4" /> Fill
                        </button>
                        <button onClick={() => setShowClearModal(true)} className="flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 bg-rose-500 hover:bg-rose-600 rounded text-xs md:text-sm font-bold transition">
                            <Icon name="log-out" className="w-3 h-3 md:w-4 md:h-4" /> Clear
                        </button>
                    </div>
                </div>
            )}

            <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                
                {/* Mobile Dropdown Nav */}
                <div className="md:hidden bg-white border-b p-3 shrink-0">
                     <select 
                        value={activeModule} 
                        onChange={(e) => setActiveModule(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded bg-slate-50 font-medium text-slate-800"
                    >
                        {MODULES.map(mod => <option key={mod.id} value={mod.id}>{mod.reviewId}: {mod.title}</option>)}
                    </select>
                </div>

                {/* Desktop Sidebar Nav */}
                <nav 
                    className="bg-white border-r border-slate-200 overflow-y-auto custom-scrollbar flex-shrink-0 hidden md:block relative z-20"
                    style={{ width: navWidth }}
                >
                    <div className="p-4 border-b bg-slate-50 text-xs font-bold text-slate-500 uppercase">Progression</div>
                    <div className="p-2 space-y-1">
                        {MODULES.map(mod => (
                            <button
                                key={mod.id}
                                onClick={() => setActiveModule(mod.id)}
                                className={`w-full text-left px-3 py-3 rounded-xl text-sm font-medium flex items-center gap-3 transition-all ${
                                    activeModule === mod.id 
                                    ? "bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm" 
                                    : "text-slate-600 hover:bg-slate-100"
                                }`}
                            >
                                <span className={`w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold ${mod.type === 'concept' ? 'bg-violet-100 text-violet-700' : 'bg-slate-100 text-slate-500'}`}>
                                    {mod.type === 'concept' ? '?' : mod.reviewId.split(' ')[1]}
                                </span>
                                <span className="truncate">{mod.title}</span>
                            </button>
                        ))}
                    </div>
                    {/* Resizer Handle */}
                    <div className="resizer-handle" onMouseDown={startResizing}></div>
                </nav>

                <main className="flex-1 overflow-hidden relative p-3 md:p-6">
                    {renderModuleContent()}
                </main>
            </div>
            
            {/* Calculator Widget */}
            <Calculator 
                isOpen={showCalculator} 
                onClose={() => setShowCalculator(false)} 
            />

            {/* Login Modal */}
            <Modal isOpen={showAuthModal} title="Instructor Access" onClose={() => setShowAuthModal(false)}>
                <div className="space-y-5">
                    <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <Icon name="lock" className="h-5 w-5 text-slate-400" />
                        </div>
                        <input 
                            type="password" 
                            className="w-full border-2 border-slate-200 pl-10 p-3 rounded-xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all font-medium"
                            placeholder="Access Code"
                            value={passwordInput}
                            onChange={(e) => setPasswordInput(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleAuth()}
                        />
                    </div>
                    <button 
                        onClick={handleAuth}
                        className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white py-3 rounded-xl font-bold shadow-md shadow-indigo-500/20 transition-all active:scale-[0.98]"
                    >
                        Unlock Features
                    </button>
                </div>
            </Modal>

            {/* Clear Confirmation Modal */}
            <Modal isOpen={showClearModal} title="Clear All & Exit?" onClose={() => setShowClearModal(false)}>
                <div className="space-y-5">
                    <div className="flex items-center gap-3 text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <Icon name="alert-triangle" className="w-6 h-6 shrink-0" />
                        <h4 className="font-bold">Warning: Destructive Action</h4>
                    </div>
                    <p className="text-slate-600 leading-relaxed font-medium px-1">This will instantly remove all student answers and lock Instructor Mode. This action cannot be undone.</p>
                    <div className="flex justify-end gap-3 mt-6 pt-2">
                        <button onClick={() => setShowClearModal(false)} className="px-5 py-2.5 text-slate-600 font-bold hover:bg-slate-100 rounded-xl transition-colors">Cancel</button>
                        <button onClick={performClear} className="px-5 py-2.5 bg-rose-600 text-white font-bold hover:bg-rose-700 rounded-xl shadow-md shadow-rose-500/20 transition-all active:scale-[0.98]">Confirm Clear</button>
                    </div>
                </div>
            </Modal>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
