// --- EXCEL PV SIMULATOR (Function Arguments Dialog) ---
const ExcelPVSimulator = () => {
    const [rate, setRate] = React.useState("");
    const [nper, setNper] = React.useState("");
    const [pmt, setPmt] = React.useState("");
    const [fv, setFv] = React.useState("");

    const calcPV = () => {
        let r = parseFloat(rate.replace('%','')) / (rate.includes('%') ? 100 : 1);
        let n = parseFloat(nper);
        let p = parseFloat(pmt);
        let f = parseFloat(fv);
        
        if(isNaN(r) || isNaN(n)) return null;
        p = isNaN(p) ? 0 : p;
        f = isNaN(f) ? 0 : f;

        let pv;
        if (r === 0) pv = -(p * n + f);
        else pv = -(p / r * (1 - Math.pow(1 + r, -n)) + f * Math.pow(1 + r, -n));
        return pv;
    };

    const pvVal = calcPV();
    const displayVal = pvVal !== null 
        ? pvVal.toLocaleString('en-US', {style:'currency', currency:'USD'}) 
        : "---";

    return (
        <div className="bg-white border border-green-600 rounded-lg shadow-sm overflow-hidden mb-6 font-sans">
            <div className="bg-green-600 text-white text-xs font-bold p-2 flex items-center gap-2">
                <Icon name="table" className="w-4 h-4" /> Excel Function Arguments: PV
            </div>
            <div className="p-4 text-sm bg-green-50/20">
                <div className="grid grid-cols-2 gap-x-4 gap-y-3">
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-gray-700 w-12">Rate</label>
                        <input type="text" value={rate} onChange={e=>setRate(e.target.value)} className="border border-gray-300 rounded p-1.5 w-full md:w-28 focus:border-green-500 outline-none text-right font-mono" placeholder="0.04" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-gray-700 w-12">Nper</label>
                        <input type="number" value={nper} onChange={e=>setNper(e.target.value)} className="border border-gray-300 rounded p-1.5 w-full md:w-28 focus:border-green-500 outline-none text-right font-mono" placeholder="30" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-gray-700 w-12">Pmt</label>
                        <input type="number" value={pmt} onChange={e=>setPmt(e.target.value)} className="border border-gray-300 rounded p-1.5 w-full md:w-28 focus:border-green-500 outline-none text-right font-mono" placeholder="-15000" />
                    </div>
                    <div className="flex items-center justify-between col-span-2 md:col-span-1">
                        <label className="font-semibold text-gray-700 w-12">Fv</label>
                        <input type="number" value={fv} onChange={e=>setFv(e.target.value)} className="border border-gray-300 rounded p-1.5 w-full md:w-28 focus:border-green-500 outline-none text-right font-mono" placeholder="-300000" />
                    </div>
                </div>
                
                <div className="border-t border-gray-200 mt-4 pt-3 flex justify-between items-center -mx-4 -mb-4 px-4 pb-4 bg-gray-50/80">
                    <span className="text-gray-500 font-bold text-xs">= Formula result</span>
                    <span className={`font-mono font-bold text-lg ${pvVal !== null ? 'text-green-800' : 'text-gray-400'}`}>

            </div>
        </div>
    );
};

const Calculator = ({ isOpen, onClose }) => {
    const [input, setInput] = React.useState("");
    const [result, setResult] = React.useState("");

    React.useEffect(() => {
        if (!isOpen) {
            setInput("");
            setResult("");
        }
    }, [isOpen]);

    if (!isOpen) return null;

    const safeEval = (exp) => {
        if (!exp) return null;
        const clean = exp.toString().replace(/,/g, "");
        if (!/^[0-9+\-*/().\s]+$/.test(clean)) return null;
        try {
            const res = new Function("return " + clean)();
            if (typeof res !== "number" || !isFinite(res)) return null;
            return res;
        } catch (e) {
            return null;
        }
    };

    const handleClick = (val) => {
        if (val === "=") {
            const res = safeEval(input);
            if (res === null) {
                setResult("Error");
                return;
            }
            setResult(Number(res).toLocaleString(undefined, { maximumFractionDigits: 8 }));
            setInput(String(res));
            return;
        }
        if (val === "C") {
            setInput("");
            setResult("");
            return;
        }
        if (val === "⌫") {
            setInput((prev) => prev.slice(0, -1));
            return;
        }
        setInput((prev) => prev + val);
    };

    const buttons = [
        "C","⌫","(",")",
        "7","8","9","/",
        "4","5","6","*",
        "1","2","3","-",
        "0",".","=","+"
    ];

    return (
        <>
            <div className="fixed inset-0 bg-black/50 z-[240] md:hidden" onClick={onClose}></div>
            <div className="fixed z-[250] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden instructor-toolbar 
                            top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-[320px] 
                            md:top-20 md:left-auto md:right-4 md:translate-x-0 md:translate-y-0 md:w-64">
                <div className="bg-slate-50 p-2 border-b flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-2">
                        Calculator
                    </span>
                    <button
                        onClick={onClose}
                        className="p-2 hover:bg-slate-200 rounded text-slate-500"
                        title="Close"
                    >
                        <Icon name="x" className="w-4 h-4" />
                    </button>
                </div>
                <div className="p-4 bg-slate-900 text-right">
                    <div className="text-slate-400 text-xs h-4 mb-1 truncate">
                        {result !== "" ? input : ""}
                    </div>
                    <div className="text-white text-2xl font-mono font-bold truncate">
                        {result !== "" ? result : (input || "0")}
                    </div>
                </div>
                <div className="grid grid-cols-4 gap-px bg-slate-200 border-t border-slate-200">
                    {buttons.map((btn) => (
                        <button
                            key={btn}
                            onClick={() => handleClick(btn)}
                            className={`p-4 md:p-3 text-lg md:text-sm font-bold transition-colors active:bg-opacity-80 touch-manipulation ${
                                btn === "="
                                    ? "bg-blue-600 text-white hover:bg-blue-700"
                                    : ["C","⌫"].includes(btn)
                                    ? "bg-red-50 text-red-600 hover:bg-red-100"
                                    : ["/","*","-","+"].includes(btn)
                                    ? "bg-slate-100 text-slate-800 hover:bg-slate-200"
                                    : "bg-white text-slate-700 hover:bg-slate-50"
                            }`}
                        >
                            {btn}
                        </button>
                    ))}
                </div>
            </div>
        </>
    );
};

const SmartInput = ({ id, value, onChange, isPct, correctValueEncoded, instructorMode, onFocus, isFocused, small = false }) => {
    
    // Evaluates math & basic Excel macros (like =PV)
    const evaluateExpression = (expression) => {
        if (!expression) return { val: "", valid: false };
        let cleanExp = expression.toString().replace(/,/g, '');
        
        // Convert '50%' to 0.5
        cleanExp = cleanExp.replace(/(\d+(\.\d+)?)%/g, (match, p1) => parseFloat(p1) / 100);
        
        // Intercept Excel =PV(rate, nper, pmt, fv)
        cleanExp = cleanExp.replace(/(^|=)PV\(([^)]+)\)/gi, (match, prefix, args) => {
             try {
                const evaluatedArgs = new Function('return [' + args + ']')();
                const [r, n, p, f] = evaluatedArgs.map(v => parseFloat(v)||0);
                if (r===0) return -(p*n+f);
                return -(p/r*(1-Math.pow(1+r,-n)) + f*Math.pow(1+r,-n));
             } catch(e) { return match; }
        });

        if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(cleanExp)) return { val: expression, valid: false };
        try {
            const result = new Function('return ' + cleanExp)();
            return { val: parseFloat(result.toFixed(4)), valid: true };
        } catch (e) { return { val: expression, valid: false }; }
    };

    const handleChange = (e) => {
        onChange(id, e.target.value);
    };

    const handleBlur = (e) => {
        const val = e.target.value;
        const { val: calculated, valid } = evaluateExpression(val);
        if (valid && calculated != val) {
            onChange(id, calculated);
        }
    };

    let status = "neutral";
    const correctValue = d(correctValueEncoded);

    if (value !== "" && value !== undefined && correctValue !== undefined) {
        const numVal = parseFloat(value);
        if (!isNaN(numVal)) {
            const margin = Math.abs(correctValue * 0.02); // 2% Error Margin
            let isCorrect = Math.abs(numVal - correctValue) <= margin;

            if (!isCorrect) {
                const asPercentDecimal = numVal / 100;
                if (Math.abs(asPercentDecimal - correctValue) <= margin) {
                    isCorrect = true;
                }
            }

            if (!isCorrect) {
                const asWholeNumber = numVal * 100;
                if (Math.abs(asWholeNumber - correctValue) <= (Math.abs(correctValue * 0.02))) {
                    isCorrect = true;
                }
            }
            
            status = isCorrect ? "correct" : "incorrect";
        }
    }

    const borderClass = isFocused 
        ? "border-blue-500 ring-2 ring-blue-200" 
        : (status === "correct" ? "border-green-500 bg-green-50 text-green-900 font-bold" : (status === "incorrect" ? "border-red-500 bg-red-50" : "border-gray-300"));

    const paddingClass = small ? "p-1.5 text-sm" : "p-3";

    return (
        <div className="relative w-full">
            <input
                type="text"
                id={id}
                value={value || ""}
                onFocus={() => onFocus(id)}
                onBlur={handleBlur}
                onChange={handleChange}
                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                className={`w-full ${paddingClass} border rounded shadow-sm transition-all outline-none font-mono ${borderClass}`}
                placeholder={isPct ? "0.0%" : "0"}
                inputMode="decimal" 
            />
            {status === "correct" && !small && (
                <div className="absolute right-3 top-3.5 text-green-600 flex items-center gap-1 text-sm font-bold pointer-events-none">
                    <Icon name="check" className="w-5 h-5" />
                </div>
            )}
            {status === "correct" && small && (
                <div className="absolute right-1 top-1.5 text-green-600 flex items-center gap-1 text-xs font-bold pointer-events-none">
                    <Icon name="check" className="w-4 h-4" />
                </div>
            )}
             {instructorMode && correctValue !== undefined && (
                <div className="mt-1 p-1 bg-purple-100 border border-purple-300 text-purple-900 text-xs font-bold inline-block rounded shadow-sm absolute -bottom-6 left-0 z-10 whitespace-nowrap">
                    Key: {isPct ? (correctValue * 100).toFixed(2) + "%" : correctValue}
                </div>
            )}
        </div>
    );
};

const ReferenceItem = ({ data, onNumberClick }) => {
    const renderCell = (content) => {
        const numRegex = /^[\$]?[\(\-]?[0-9,]+(\.[0-9]+)?[\)]?%?$/;
        if (numRegex.test(content) && content !== "-" && content !== "N/A") {
            return (
                <span 
                    className="clickable-number px-1" 
                    title="Tap to insert"
                    onMouseDown={(e) => {
                        e.preventDefault(); 
                        let clean = content.replace(/[^0-9\.-]/g, '');
                        if (content.includes('(')) clean = '-' + clean;
                        if (content.includes('%')) clean = (parseFloat(clean)/100).toString();
                        onNumberClick(clean);
                    }}
                >
                    {content}
                </span>
            );
        }
        return content;
    };

    if (data.type === 'key-value') {
         return (
            <div className="mb-4 bg-white border border-gray-200 rounded shadow-sm">
                {data.title && <div className="p-2 bg-gray-50 border-b text-xs font-bold text-gray-700">{data.title}</div>}
                <div className="p-2 grid grid-cols-2 gap-2 text-xs">
                    {data.data.map((pair, idx) => (
                        <React.Fragment key={idx}>
                            <div className="text-gray-500">{pair[0]}:</div>
                            <div className="font-mono text-gray-800 text-right">{renderCell(pair[1])}</div>
                        </React.Fragment>
                    ))}
                </div>
            </div>
         );
    }
    if (data.type === 'sections') {
        return (
            <div className="space-y-2">
                {data.sections.map((sec, idx) => <ReferenceItem key={idx} data={sec} onNumberClick={onNumberClick} />)}
            </div>
        );
    }
    return null;
};

const ConceptCheck = ({ id, questions, instructorMode, answers, updateAnswer }) => {
    const handleSelect = (qId, option) => {
        if (answers[qId] || instructorMode) return;
        updateAnswer(qId, option);
    };

    return (
        <div className="space-y-6">
            {questions.map((q, idx) => {
                const userSelection = answers[q.id];
                const isAnswered = !!userSelection;
                
                return (
                    <div key={q.id} className="bg-white p-4 rounded-lg shadow border border-gray-200">
                        <div className="font-bold text-gray-800 mb-3 flex gap-2">
                            <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-sm shrink-0 h-fit">Q{idx+1}</span>
                            <span>{q.text}</span>
                        </div>
                        <div className="space-y-2 mb-4">
                            {q.options.map(opt => {
                                let btnClass = "w-full text-left p-3 rounded text-sm transition-all border active:scale-[0.99] touch-manipulation ";
                                
                                if (instructorMode) {
                                    if (opt === q.answer) {
                                        btnClass += "bg-green-100 border-green-500 text-green-900 font-bold shadow-sm ring-2 ring-green-500/50";
                                    } else {
                                        btnClass += "border-gray-100 text-gray-400 opacity-60";
                                    }
                                } else {
                                    if (isAnswered) {
                                        if (opt === userSelection) {
                                            if (opt === q.answer) {
                                                btnClass += "bg-green-100 border-green-500 text-green-900 font-bold";
                                            } else {
                                                btnClass += "bg-red-100 border-red-500 text-red-900 font-bold";
                                            }
                                        } else {
                                            btnClass += "border-gray-200 text-gray-400 opacity-50 cursor-not-allowed";
                                        }
                                    } else {
                                        btnClass += "hover:bg-gray-50 border-gray-200 text-gray-600";
                                    }
                                }

                                return (
                                    <button
                                        key={opt}
                                        onClick={() => handleSelect(q.id, opt)}
                                        disabled={isAnswered || instructorMode}
                                        className={btnClass}
                                    >
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                        {instructorMode && (
                            <div className="mt-3 bg-purple-50 border border-purple-200 p-3 rounded text-sm text-purple-900">
                                <div className="font-bold flex items-center gap-2 mb-1">
                                    <Icon name="graduation-cap" className="w-4 h-4" /> 
                                    Answer & Explanation
                                </div>
                                <p className="opacity-90">{q.explanation}</p>
                            </div>
                        )}
                    </div>
                );
            })}
        </div>
    );
};

                                    </thead>
                                    <tbody>
                                        {Object.entries(_DATA_MATRIX).map(([key, data]) => (
                                            <tr key={key} className="border-b hover:bg-purple-50">
                                                <td className="p-3 font-medium">{data.label}</td>
                                                <td className="p-3 font-mono font-bold text-purple-700">
                                                    {data.isPct ? (d(data.val) * 100).toFixed(2) + "%" : d(data.val)}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                {/* Right Panel: Data Source */}
                <div className="lg:w-80 flex-shrink-0 flex flex-col mb-20 lg:mb-0">
                    <div className="bg-slate-100 p-4 rounded-lg border border-slate-200 h-full overflow-y-auto custom-scrollbar sticky top-4">
                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2">
                            <Icon name="database" className="w-4 h-4" /> Data Source
                        </h3>
                        {refs ? refs.map((ref, i) => (
                            <ReferenceItem key={i} data={ref} onNumberClick={handleNumberClick} />
                        )) : <div className="text-sm text-gray-500 italic">No reference data needed for this section.</div>}
                        
                        <div className="mt-4 p-3 bg-blue-50 text-blue-800 text-xs rounded border border-blue-100 flex gap-2">
                            <Icon name="mouse-pointer-click" className="w-4 h-4 shrink-0" />
                            <span>Tap any number in the tables to insert it into your selected input field.</span>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const renderInput = (id, label, isPct = false, linkedValue = null, customClass = "mb-4", small = false) => (
        <FieldWithHint 
            key={id} id={id} label={label} isPct={isPct} 
            answers={answers} updateAnswer={updateAnswer} 
            correctValueEncoded={_DATA_MATRIX[id]?.val} instructorMode={instructorMode}
            onFocus={handleInputFocus} isFocused={activeInputId === id}
            linkedValue={linkedValue ? answers[linkedValue] : null}
            className={customClass} small={small}
        />
    );

    return (
        <div className="flex flex-col h-full">
            <header className="bg-slate-900 text-white p-3 md:p-4 flex justify-between items-center shadow-md sticky-header z-50 shrink-0">
                <div className="flex items-center gap-3">
                    <div className="p-2 bg-blue-600 rounded-lg"><Icon name="bar-chart-3" className="w-6 h-6 text-white" /></div>
                    <div>
                        <h1 className="text-lg md:text-xl font-bold tracking-tight">Comcast Bond Sim</h1>
                    </div>
                </div>
                <div className="flex items-center gap-2 md:gap-3">
                    <input type="text" placeholder="Your Name" className="bg-slate-800 border-slate-700 px-3 py-1 rounded text-sm text-white w-28 md:w-auto outline-none focus:ring-1 focus:ring-blue-500" />
                    <button
                        onClick={() => setShowCalculator(prev => !prev)}
                        className="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded text-sm font-medium flex items-center gap-2 transition"
                        title="Open Calculator"
                    >
                        <Icon name="calculator" className="w-4 h-4" />
                        <span className="hidden md:inline">Calc</span>
                    </button>
                    <button 
                        onClick={() => instructorMode ? setInstructorMode(false) : setShowAuthModal(true)}
                        className={`opacity-20 hover:opacity-100 flex items-center gap-2 px-3 py-2 rounded text-sm font-medium transition-all ${instructorMode ? 'bg-purple-600 text-white opacity-100' : 'text-white'}`}
                    >
                        <Icon name={instructorMode ? "unlock" : "lock"} className="w-4 h-4" />
                    </button>
                </div>
            </header>

            {/* Sticky Instructor Toolbar */}
            {instructorMode && (
                <div className="bg-purple-700 text-white p-2 shadow-md flex items-center justify-between z-40 instructor-toolbar shrink-0 overflow-x-auto">
                    <div className="flex items-center gap-2 md:gap-3 px-2 md:px-4 shrink-0">
                        <span className="bg-white/20 p-1.5 rounded"><Icon name="graduation-cap" className="w-4 h-4"/></span>
                        <span className="font-bold tracking-wide text-xs md:text-sm">INSTRUCTOR</span>
                    </div>
                    <div className="flex gap-2 px-2 md:px-4 shrink-0">
                        <button onClick={autoFillAll} className="flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 bg-green-500 hover:bg-green-600 rounded text-xs md:text-sm font-bold transition">
                            <Icon name="wand-2" className="w-3 h-3 md:w-4 md:h-4" /> Fill
                        </button>
                        <button onClick={() => setShowClearModal(true)} className="flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 bg-red-500 hover:bg-red-600 rounded text-xs md:text-sm font-bold transition">
                            <Icon name="log-out" className="w-3 h-3 md:w-4 md:h-4" /> Clear
                        </button>
                    </div>
                </div>
            )}

            <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                
                {/* Mobile Dropdown Nav */}
                <div className="md:hidden bg-white border-b p-3 shrink-0">
                     <select 
                        value={activeModule} 
                        onChange={(e) => setActiveModule(e.target.value)}
                        className="w-full p-2 border border-gray-300 rounded bg-gray-50 font-medium text-slate-800"
                    >
                        {MODULES.map(mod => <option key={mod.id} value={mod.id}>{mod.reviewId}: {mod.title}</option>)}
                    </select>
                </div>

                {/* Desktop Sidebar Nav */}
                <nav 
                    className="bg-white border-r border-gray-200 overflow-y-auto custom-scrollbar flex-shrink-0 hidden md:block relative"
                    style={{ width: navWidth }}
                >
                    <div className="p-4 border-b bg-gray-50 text-xs font-bold text-gray-500 uppercase">Progression</div>
                    <div className="p-2 space-y-1">
                        {MODULES.map(mod => (
                            <button
                                key={mod.id}
                                onClick={() => setActiveModule(mod.id)}
                                className={`w-full text-left px-3 py-3 rounded-md text-sm font-medium flex items-center gap-3 transition-all ${
                                    activeModule === mod.id 
                                    ? "bg-blue-50 text-blue-700 border border-blue-200 shadow-sm" 
                                    : "text-gray-600 hover:bg-gray-100"
                                }`}
                            >
                                <span className={`w-6 h-6 flex items-center justify-center rounded text-xs font-bold ${mod.type === 'concept' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'}`}>
                                    {mod.type === 'concept' ? '?' : mod.reviewId.split(' ')[1]}
                                </span>
                                <span className="truncate">{mod.title}</span>
                            </button>
                        ))}
                    </div>
                    {/* Resizer Handle */}
                    <div className="resizer-handle" onMouseDown={startResizing}></div>
                </nav>

                <main className="flex-1 overflow-hidden relative bg-gray-50 p-3 md:p-6">
                    {renderModuleContent()}
                </main>
            </div>
            
            {/* Calculator Widget */}
            <Calculator 
                isOpen={showCalculator} 
                onClose={() => setShowCalculator(false)} 
            />

            {/* Login Modal */}
            <Modal isOpen={showAuthModal} title="System Access" onClose={() => setShowAuthModal(false)}>
                <div className="space-y-4">
                    <input 
                        type="password" 
                        className="w-full border p-2 rounded outline-none focus:border-purple-500"
                        placeholder="Access Code (Hint: review)"
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleAuth()}
                    />
                    <button 
                        onClick={handleAuth}
                        className="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded font-medium"
                    >
                        Unlock
                    </button>
                </div>
            </Modal>

            {/* Clear Confirmation Modal */}
            <Modal isOpen={showClearModal} title="Clear All & Exit?" onClose={() => setShowClearModal(false)}>
                <div className="space-y-4">
                    <div className="flex items-center gap-3 text-red-600 mb-2">
                        <Icon name="alert-triangle" className="w-6 h-6" />
                        <h4 className="font-bold">Warning</h4>
                    </div>
                    <p className="text-sm text-gray-600">This will remove all student answers and lock Instructor Mode. This action cannot be undone.</p>
                    <div className="flex justify-end gap-3 mt-4">
                        <button onClick={() => setShowClearModal(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                        <button onClick={performClear} className="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded font-medium">Confirm Clear</button>
                    </div>
                </div>
            </Modal>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
