                return parseFloat(d(correctValueEnc));
            }, [correctValueEnc]);

                if (!str) return "";
                try {
                    let sanitized = str.replace(/[^0-9+\-*/()., %]/g, ''); 
                    sanitized = sanitized.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
                    if (!sanitized) return "";
                    return Function('"use strict";return (' + sanitized + ')')();
                } catch (e) {
                    return str;
                }
            };

            const checkCorrectness = (val) => {
                if (!val || val === "" || correctValue === undefined || isNaN(correctValue)) {
                    setIsCorrect(null);
                    return;
                }
                const numVal = parseFloat(val);
                if (isNaN(numVal)) {
                    setIsCorrect(false);
                    return;
                }

                let valid = false;
                if (Math.abs(numVal - correctValue) <= tolerance) valid = true;
                else if (Math.abs(numVal - correctValue) <= (Math.abs(correctValue) * tolerance)) valid = true;

                if (!valid && isPercent) {
                    if (Math.abs((numVal * 100) - correctValue) <= tolerance) valid = true;
                }

                setIsCorrect(valid);
            };

            const handleBlur = () => {
                const computed = evaluateMath(value);
                let displayVal = computed;
                if (typeof computed === 'number' && !Number.isInteger(computed)) {

                if (displayVal !== undefined && displayVal !== null) {

        // Component to check exact string matches (like Moody's ratings with modifiers)
        const TextCheckInput = ({ id, value, onChange, correctValueEnc, placeholder }) => {
            const correctValue = useMemo(() => {
                if(!correctValueEnc) return undefined;
                return d(correctValueEnc);
            }, [correctValueEnc]);

            const isCorrect = value && correctValue && value.trim().toLowerCase() === correctValue.trim().toLowerCase();
            const isWrong = value && correctValue && value.trim().length > 0 && value.trim().toLowerCase() !== correctValue.trim().toLowerCase();

            let borderColor = "border-slate-300";
            if (isCorrect) borderColor = "border-green-500 bg-green-50";
            else if (isWrong) borderColor = "border-red-400 bg-red-50";

                <div className="relative">
                    <input
                        type="text"
                        className={`w-full text-sm p-2 rounded border ${borderColor} focus:outline-none transition-colors font-mono`}

                        onChange={(e) => onChange(id, e.target.value)}

        // Trend Interpretation Component
        const TrendSelect = ({ id, value, onChange, correctTrend, trendType }) => {
            if (!correctTrend || trendType === 'none') return <div className="hidden sm:block col-span-2 sm:col-span-1"></div>;

            let options = [];
            if (trendType === 'liquidity' || trendType === 'cashflow') {
                options = ["Better", "Worse"];
            } else if (trendType === 'solvency') {
                options = ["More solvent", "Less solvent"];
            } else if (trendType === 'coverage') {
                options = ["Better Coverage", "Worse Coverage"];
            }

            const isCorrect = value && value === correctTrend;
            const isWrong = value && value !== correctTrend && value !== "Select Trend";

            let borderColor = "border-slate-300";
            if (isCorrect) borderColor = "border-green-500 bg-green-50";
            else if (isWrong) borderColor = "border-red-400 bg-red-50";

            return (
                <div className="flex flex-col col-span-2 sm:col-span-1 justify-end mt-2 sm:mt-0">

                    <select
                        value={value || ""}

        const SectionHeader = ({ title, isOpen, toggle }) => (

        // Draggable Matrix Modal
        const DraggableModal = ({ title, children, onClose }) => {
            const [pos, setPos] = useState({ x: Math.max(0, window.innerWidth / 2 - 350), y: 50 });
            const dragRef = useRef({ isDragging: false, startX: 0, startY: 0, initialX: 0, initialY: 0 });

            const onMouseDown = (e) => {
                dragRef.current.isDragging = true;
                dragRef.current.startX = e.clientX;
                dragRef.current.startY = e.clientY;
                dragRef.current.initialX = pos.x;
                dragRef.current.initialY = pos.y;
                document.body.style.userSelect = 'none';
            };

            useEffect(() => {
                const onMouseMove = (e) => {
                    if (!dragRef.current.isDragging) return;
                    let newX = dragRef.current.initialX + (e.clientX - dragRef.current.startX);
                    let newY = dragRef.current.initialY + (e.clientY - dragRef.current.startY);
                    
                    // Simple bounds checking
                    newX = Math.max(0, Math.min(window.innerWidth - 100, newX));
                    newY = Math.max(0, Math.min(window.innerHeight - 50, newY));

                    setPos({ x: newX, y: newY });
                };
                const onMouseUp = () => {
                    dragRef.current.isDragging = false;
                    document.body.style.userSelect = 'auto';
                };
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
            }, []);

            return (
                <div style={{ position: 'fixed', left: pos.x, top: pos.y, zIndex: 9999 }} className="bg-white shadow-[0_10px_40px_rgba(0,0,0,0.2)] border border-slate-300 rounded-lg w-full max-w-[700px] flex flex-col pointer-events-auto">

                const name = modal.studentName.trim();
                if (!name) return;
                
                let content = `Student: ${name}\nDate: ${new Date().toLocaleString()}\nCompany: ${company}\n\n`;
                const currInputs = inputs[company];
                content += "--- INPUTS ---\n";
                Object.keys(currInputs).forEach(k => {
                    content += `${k}: ${currInputs[k]}\n`;
                });
                
                // Append raw data for restoring state later
                content += `\n\n--- RAW DATA (DO NOT EDIT) ---\n`;
                content += JSON.stringify({ inputs, studentName: name }, null, 2);

                const blob = new Blob([content], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${name.replace(/ /g, '_')}_Module4_CreditAnalysis.txt`;

                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        let loadedName = studentName;
                        const nameLine = content.split('\n').find(line => line.startsWith('Student:'));
                        if (nameLine) loadedName = nameLine.replace('Student:', '').trim();

                        const rawDataMarker = "--- RAW DATA (DO NOT EDIT) ---";
                        const dataIndex = content.indexOf(rawDataMarker);
                        
                        if (dataIndex !== -1) {
                            const jsonStr = content.substring(dataIndex + rawDataMarker.length).trim();
                            const parsed = JSON.parse(jsonStr);
                            
                            if (parsed.inputs) setInputs(parsed.inputs);
                            if (parsed.studentName) loadedName = parsed.studentName;
                            
                            setStudentName(loadedName);

                    { id: 'cfo_debt', type: 'cashflow' },
                    { id: 'focf_debt', type: 'cashflow' },

                trendMappings.forEach(m => {

                    const v21 = parseFloat(d(key[`${m.id}_2021`]));
                    if (m.type === 'liquidity' || m.type === 'cashflow') {
                        newInputs[`${m.id}_trend`] = v22 >= v21 ? "Better" : "Worse";

                        newInputs[`${m.id}_trend`] = v22 <= v21 ? "More solvent" : "Less solvent";
                    } else if (m.type === 'coverage') {
                        newInputs[`${m.id}_trend`] = v22 >= v21 ? "Better Coverage" : "Worse Coverage";
                    }

                                {teacherMode ? <Icons.Unlock className="text-green-600" /> : <Icons.Lock />}
                            </button>

                            <button onClick={requestDownload} className="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 shadow flex items-center gap-2 font-bold transition">
                                <Icons.Download /> <span className="hidden sm:inline">Save</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA WITH DRAWER LAYOUT */}
                    <div className="flex flex-1 overflow-hidden relative">
                        
                        {/* LEFT PANEL: DATA (Sidebar on Desktop, Drawer on Mobile) */}
                        <div 
                            className={`
                                fixed inset-y-0 left-0 z-40 bg-white border-r border-slate-200 flex flex-col shadow-2xl transition-transform duration-300 transform 
                                ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} 
                                md:translate-x-0 md:relative md:shadow-none md:z-0
                            `}
                            style={{ width: window.innerWidth >= 768 ? `${sidebarWidth}%` : '85%' }}
                        >
                            <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 leading-none">{companyData.name}</h2>
                                    <p className="text-xs text-slate-500 font-mono mt-1">Currency: {companyData.currency}</p>
                                </div>
                                <button className="md:hidden text-slate-400" onClick={() => setMobileMenuOpen(false)}><Icons.X /></button>
                            </div>

                            <div className="flex-1 overflow-y-auto scroller p-4">
                                <p className="text-xs text-blue-600 mb-4 bg-blue-50 p-2 rounded border border-blue-100">
                                    <span className="font-bold">Tip:</span> Click any number in the tables below to insert it into the active input field.
                                </p>

                                {Object.entries(companyData.CASE_DATA).map(([key, section]) => (
                                    <div key={key} className="mb-6">
                                        <h3 className="font-bold text-slate-700 text-sm border-b-2 border-slate-100 mb-2 pb-1 uppercase tracking-wide">{section.title}</h3>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs text-left border-collapse min-w-[300px]">
                                                <thead>
                                                    <tr className="text-slate-400 border-b">
                                                        {section.headers.map((h, i) => (
                                                            <th key={i} className={`p-1.5 font-medium ${i > 0 ? 'text-right' : ''}`}>{h}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {section.rows.map((row, rIndex) => (
                                                        <tr key={rIndex} className="hover:bg-blue-50 transition-colors group">
                                                            {row.map((cell, cIndex) => (
                                                                <td 
                                                                    key={cIndex} 
                                                                    className={`p-1.5 border-b border-slate-50 ${cIndex > 0 ? 'text-right font-mono text-slate-700 cursor-pointer hover:bg-blue-100 hover:text-blue-700 hover:font-bold' : 'text-slate-600 font-medium'}`}
                                                                    onMouseDown={(e) => e.preventDefault()} 
                                                                    onClick={() => cIndex > 0 && handleDataClick(cell)}
                                                                    title={cIndex > 0 ? "Click to insert value" : ""}
                                                                >
                                                                    {cell}
                                                                </td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* RESIZE HANDLE (Desktop Only) */}
                        <div 
                            className="hidden md:flex w-1 bg-slate-200 hover:bg-blue-400 cursor-col-resize items-center justify-center transition-colors z-20 flex-shrink-0"
                            onMouseDown={startResize}
                        >
                            <div className="h-8 w-1 bg-slate-400 rounded-full"></div>
                        </div>

                        {/* RIGHT PANEL: WORKSPACE */}
                        <div 
                            className="flex-1 bg-slate-50 overflow-y-auto scroller p-4 pb-20 relative w-full" 
                            ref={workspaceRef}
                        >
                            <div className="max-w-3xl mx-auto">
                                <h2 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <Icons.Briefcase /> Analysis Workspace
                                </h2>

                                {/* 1. LIQUIDITY */}
                                <div className="bg-white rounded shadow-sm border border-slate-200 mb-4">
                                    <SectionHeader title="1. Liquidity Ratios" isOpen={sections.liquidity} toggle={() => toggleSection('liquidity')} />
                                    {sections.liquidity && <div className="p-4">
                                        {renderRow("Current Ratio", "current_ratio", false, "Current Assets / Current Liabilities", true, "liquidity")}
                                        {renderRow("Quick Ratio", "quick_ratio", false, "Cash + Marketable Securities + Trade AR / Current Liabilities", true, "liquidity")}
                                    </div>}
                                </div>

                                {/* 2. CAPITAL STRUCTURE */}
                                <div className="bg-white rounded shadow-sm border border-slate-200 mb-4">
                                    <SectionHeader title="2. Capital Structure" isOpen={sections.capStructure} toggle={() => toggleSection('capStructure')} />
                                    {sections.capStructure && <div className="p-4">
                                        {renderRow("Total Debt ($)", "total_debt", false, "Short-term + Long-term Debt + Operating Leases", true, "none")}
                                        {renderRow("Liabilities to Equity", "liab_equity", false, "Total Liabilities / Total Equity", true, "solvency")}
                                        {renderRow("Debt to Equity", "debt_equity", false, "Total Debt (incl. Leases) / Total Equity", true, "solvency")}
                                    </div>}
                                </div>

                                {/* 3. COVERAGE */}
                                <div className="bg-white rounded shadow-sm border border-slate-200 mb-4">
                                    <SectionHeader title="3. Coverage Ratios" isOpen={sections.coverage} toggle={() => toggleSection('coverage')} />
                                    {sections.coverage && <div className="p-4">
                                        {renderRow("Times Interest Earned", "tie", false, "Operating Income / Interest Expense", true, "coverage")}
                                        {/* Intermittent Calculation Step */}
                                        {renderRow("EBITDA ($)", "ebitda_val", false, "Operating Income + Depreciation + Amortization", true, "none")}
                                        {renderRow("EBITDA Coverage", "ebitda_cov", false, "EBITDA / Interest Expense", true, "coverage")}
                                    </div>}
                                </div>

                                {/* 4. CASH FLOW */}
                                <div className="bg-white rounded shadow-sm border border-slate-200 mb-4">
                                    <SectionHeader title="4. Cash Flow Protection" isOpen={sections.cashFlow} toggle={() => toggleSection('cashFlow')} />
                                    {sections.cashFlow && <div className="p-4">
                                        {renderRow("CFO to Debt", "cfo_debt", false, "Cash from Ops / Total Debt", true, "cashflow")}
                                        {renderRow("Free Op Cash Flow to Debt", "focf_debt", false, "(CFO - Capex) / Total Debt", true, "cashflow")}
                                    </div>}
                                </div>

                                {/* 5. MOODY'S ANALYSIS */}
                                <div className="bg-white rounded shadow-sm border border-indigo-100 ring-1 ring-indigo-50 mb-4">
                                    <div 
                                        className="flex items-center justify-between bg-indigo-50 p-3 cursor-pointer hover:bg-indigo-100 border-b border-indigo-200"
                                        onClick={() => toggleSection('moody')}
                                    >
                                        <h3 className="font-bold text-indigo-900 text-sm uppercase tracking-wide">5. Moody's Credit Rating (2022)</h3>
                                        <span className="text-indigo-500">{sections.moody ? '▼' : '▶'}</span>
                                    </div>
                                    {sections.moody && <div className="p-4 bg-white">
                                        <div className="grid grid-cols-4 gap-2 mb-2 font-bold text-xs text-slate-400 uppercase">
                                            <div className="col-span-2">Metric</div>
                                            <div className="col-span-1">Computed</div>
                                            <div className="col-span-1">Rating</div>
                                        </div>
                                        {renderMoodyRow("Debt / EBITDA", "moody_debt_ebitda", "x", "Total Debt / EBITDA")}
                                        
                                        {/* New Intermittent Step for EBITA */}
                                        <div className="grid grid-cols-4 gap-2 mb-2 items-center border-b border-indigo-50 bg-indigo-50/50 p-1 rounded">
                                            <div className="col-span-2 text-sm text-indigo-800 flex items-center font-medium">
                                                EBITA ($)
                                                <div className="ml-1 group relative"><Icons.Info />
                                                    <div className="hidden group-hover:block absolute z-50 left-0 bottom-full mb-1 w-64 bg-slate-800 text-white text-xs p-2 rounded shadow-lg pointer-events-none">Operating Income + Amortization Expense</div>
                                                </div>
                                            </div>
                                            <div className="col-span-2 sm:col-span-1">
                                                <SmartInput 
                                                    id="ebita_val" 
                                                    label="" 
                                                    value={inputs[company]["ebita_val"]} 
                                                    onChange={handleInputChange} 
                                                    correctValueEnc={_DATA_MATRIX[company]["ebita_val"]} 
                                                    activeId={activeInputId}
                                                    setActiveId={setActiveInputId}
                                                />
                                            </div>
                                        </div>

                                        {renderMoodyRow("EBITA / Interest", "moody_ebita_int", "x", "EBITA / Interest Expense")}
                                        {renderMoodyRow("Revenue ($Bn)", "moody_rev", "$", "Revenue in Billions")}
                                        {renderMoodyRow("EBITA Margin", "moody_ebita_marg", "%", "EBITA / Revenue")}
                                        {renderMoodyRow("Operating Margin", "moody_op_marg", "%", "Operating Income / Revenue")}
                                        {renderMoodyRow("FFO / Debt", "moody_ffo_debt", "%", "Funds From Ops / Total Debt")}
                                        {renderMoodyRow("(FFO+Int) / Int", "moody_ffo_int_int", "x", "(FFO + Interest) / Interest")}
                                        {renderMoodyRow("EBITA / Avg Assets", "moody_ebita_assets", "%", "EBITA / Average Assets")}
                                        {renderMoodyRow("Capex / Depreciation", "moody_capex_dep", "x", "Capex / Depreciation")}

                                        {/* Conclusion / Overall Rating Step */}
                                        <div className="mt-6 border-t-2 border-indigo-100 pt-4">
                                            <h4 className="font-bold text-indigo-900 text-sm mb-3">Overall Rating Conclusion</h4>
                                            
                                            {/* Guess Rating */}
                                            <div className="grid grid-cols-4 gap-2 mb-4 items-center">
                                                <div className="col-span-4 sm:col-span-2 text-sm text-slate-700 font-medium">
                                                    Estimated Overall Rating
                                                    <div className="text-xs text-slate-500 font-normal">Based on your metrics above, what do you think the rating is? (No wrong answer)</div>
                                                </div>
                                                <div className="col-span-4 sm:col-span-2">
                                                    <input 
                                                        type="text" 
                                                        className="w-full text-sm p-2 rounded border border-slate-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
                                                        placeholder="e.g., Baa, A, Aa..."
                                                        value={inputs[company]['estimated_rating'] || ''}
                                                        onChange={(e) => handleInputChange('estimated_rating', e.target.value)}
                                                    />
                                                </div>
                                            </div>

                                            {/* Actual Rating */}
                                            <div className="grid grid-cols-4 gap-2 mb-2 items-start bg-indigo-50 p-3 rounded border border-indigo-100">
                                                <div className="col-span-4 sm:col-span-2 text-sm text-slate-700 font-medium">
                                                    Actual Moody's Rating
                                                    {company === 'PH' ? (
                                                        <div className="text-xs text-slate-600 font-normal mt-1 pr-2">
                                                            Search the <a href="https://www.sec.gov/ix?doc=/Archives/edgar/data/0000076334/000007633422000034/ph-20220630.htm" target="_blank" rel="noreferrer" className="text-blue-600 underline hover:text-blue-800">PH 2022 10-K (MD&A Section)</a> to find their reported credit rating.
                                                        </div>
                                                    ) : (
                                                        <div className="text-xs text-slate-600 font-normal mt-1 pr-2">
                                                            ITW doesn't explicitly report their rating in the 10-K. Do a quick web search for <strong>"ITW Moody's credit rating 2022"</strong> to find it.
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="col-span-4 sm:col-span-2 pt-1">
                                                    <TextCheckInput 
                                                        id="actual_moodys_score"
                                                        value={inputs[company]['actual_moodys_score']}
                                                        onChange={handleInputChange}
                                                        correctValueEnc={_DATA_MATRIX[company]['actual_moodys_score']}
                                                        placeholder="Enter actual rating (e.g., Baa1)"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>}
                                </div>

                                {/* 6. ALTMAN Z-SCORE */}
                                <div className="bg-white rounded shadow-sm border border-slate-200 mb-4">
                                    <SectionHeader title="6. Altman Z-Score (2022)" isOpen={sections.zScore} toggle={() => toggleSection('zScore')} />
                                    {sections.zScore && <div className="p-4">
                                        <p className="text-xs text-slate-500 mb-3 italic">Formula: Z = 1.2A + 1.4B + 3.3C + 0.6D + 0.99E</p>
                                        {renderZRow("(A) Working Cap / Assets", "z_wc_ta", 1.2, "Working Capital / Total Assets")}
                                        {renderZRow("(B) Retained Earnings / Assets", "z_re_ta", 1.4, "Retained Earnings / Total Assets")}
                                        {renderZRow("(C) EBIT / Assets", "z_ebit_ta", 3.3, "EBIT / Total Assets")}
                                        {renderZRow("(D) Mkt Value Equity / Liabs", "z_mve_tl", 0.6, "Market Cap / Total Liabilities")}
                                        {renderZRow("(E) Sales / Assets", "z_sales_ta", 0.99, "Revenue / Total Assets")}
                                        
                                        <div className="mt-4 pt-3 border-t-2 border-slate-100 flex justify-between items-center">
                                            <label className="font-bold text-slate-800">Total Computed Z-Score:</label>
                                            <div className="w-32 bg-slate-100 border border-slate-300 rounded p-1.5 text-right font-mono font-bold text-slate-700 shadow-inner">
                                                {calcZScoreTotal()}
                                            </div>
                                        </div>

                                        {/* Z-SCORE LEGEND */}
                                        <div className="mt-6 border border-slate-200 rounded-md overflow-hidden">
                                            <div className="bg-slate-100 px-3 py-1.5 text-xs font-bold text-slate-600 border-b border-slate-200">
                                                Z-Score Interpretation Guide
                                            </div>
                                            <div className="divide-y divide-slate-100">
                                                <div className="grid grid-cols-2 p-2 bg-green-50 text-green-800 text-xs">
                                                    <span className="font-mono font-bold">&gt; 3.0</span>
                                                    <span className="font-semibold text-right">Low Bankruptcy Risk</span>
                                                </div>
                                                <div className="grid grid-cols-2 p-2 bg-yellow-50 text-yellow-800 text-xs">
                                                    <span className="font-mono font-bold">1.8 – 3.0</span>
                                                    <span className="font-semibold text-right">Grey Zone</span>
                                                </div>
                                                <div className="grid grid-cols-2 p-2 bg-red-50 text-red-800 text-xs">
                                                    <span className="font-mono font-bold">&lt; 1.8</span>
                                                    <span className="font-semibold text-right">High Bankruptcy Risk</span>
                                                </div>
                                            </div>
                                        </div>
                                        
                                    </div>}
                                </div>

                            </div>
                        </div>
                    </div>

                    {/* MODALS */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[9999] p-4">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-full max-w-sm animate-fade-in">
                                {modal.type === 'download' && (
                                    <>
                                        <h3 className="font-bold text-lg mb-2 text-slate-800">Save Your Work</h3>
                                        <input 
                                            type="text" 
                                            className="w-full border border-slate-300 p-2 rounded mb-4 text-base" 
                                            placeholder="Student Name"
                                            value={modal.studentName}
                                            onChange={(e) => setModal(prev => ({ ...prev, studentName: e.target.value }))}
                                            autoFocus
                                        />
                                        <div className="flex justify-end gap-2">
                                            <button onClick={closeModal} className="text-slate-500 text-sm py-2 px-3">Cancel</button>
                                            <button onClick={handleConfirmDownload} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">Download</button>
                                        </div>
                                    </>
                                )}
                                {modal.type === 'clear' && (
                                    <>
                                        <h3 className="font-bold text-lg mb-2 text-red-600">Clear Data?</h3>
                                        <p className="text-sm text-slate-600 mb-4">This will erase all your current inputs for {company}.</p>
                                        <div className="flex justify-end gap-2">
                                            <button onClick={closeModal} className="text-slate-500 text-sm py-2 px-3">Cancel</button>
                                            <button onClick={handleConfirmClear} className="bg-red-600 text-white px-4 py-2 rounded text-sm font-bold">Yes, Clear</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MOODY'S TABLE MODAL (DRAGGABLE) */}
                    {showRefTable && (
                        <DraggableModal title="Exhibit 4.4: Moody's Ratios & Risk Classes" onClose={() => setShowRefTable(false)}>
                            <h4 className="font-bold text-slate-700 mb-2 text-sm">Part 1: Core Metrics & Margins</h4>
                            <div className="overflow-x-auto mb-6">
                                <table className="w-full text-left border-collapse text-xs sm:text-sm whitespace-nowrap">
                                    <thead>
                                        <tr className="bg-slate-100">
                                            <th className="p-2 border">Rating</th>
                                            <th className="p-2 border">Debt/EBITDA</th>
                                            <th className="p-2 border">EBITA/Int</th>
                                            <th className="p-2 border">Rev ($B)</th>
                                            <th className="p-2 border">EBITA Margin</th>
                                            <th className="p-2 border">Op Margin</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[
                                            ["Aaa", "1.1", "63.0", "146.0", "38.26%", "34.1%"],
                                            ["Aa", "1.3", "29.7", "143.2", "22.85%", "22.2%"],
                                            ["A", "2.1", "14.4", "22.4", "19.71%", "16.9%"],
                                            ["Baa", "2.6", "8.4", "10.7", "17.04%", "15.0%"],
                                            ["Ba", "3.3", "5.1", "3.5", "14.32%", "12.3%"],
                                            ["B", "6.0", "2.1", "0.9", "12.28%", "7.4%"],
                                            ["Caa-C", "9.5", "0.8", "0.5", "7.08%", "2.2%"],
                                        ].map((r, i) => (
                                            <tr key={i} className={i%2===0 ? "bg-white" : "bg-slate-50"}>
                                                <td className="font-bold border p-2 text-center">{r[0]}</td>
                                                {r.slice(1).map((c, j) => <td key={j} className="border p-2 text-center">{c}</td>)}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <h4 className="font-bold text-slate-700 mb-2 text-sm">Part 2: Cash Flow & Other Metrics</h4>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse text-xs sm:text-sm whitespace-nowrap">
                                    <thead>
                                        <tr className="bg-slate-100">
                                            <th className="p-2 border">Rating</th>
                                            <th className="p-2 border">FFO/Debt</th>
                                            <th className="p-2 border">(FFO+Int)/Int</th>
                                            <th className="p-2 border">EBITA/Avg Assets</th>
                                            <th className="p-2 border">CAPEX/Dep</th>
                                            <th className="p-2 border">Rev Volatility</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[
                                            ["Aaa", "83.5%", "62.4", "21.0%", "1.6", "15.5"],
                                            ["Aa", "65.4%", "30.9", "12.0%", "1.2", "15.6"],
                                            ["A", "41.7%", "16.1", "15.1%", "1.2", "12.7"],
                                            ["Baa", "32.6%", "10.4", "10.2%", "1.2", "12.2"],
                                            ["Ba", "24.9%", "6.7", "10.8%", "1.1", "15.8"],
                                            ["B", "9.7%", "2.7", "7.2%", "1.1", "18.8"],
                                            ["Caa-C", "3.1%", "1.4", "4.4%", "0.8", "15.8"],
                                        ].map((r, i) => (
                                            <tr key={i} className={i%2===0 ? "bg-white" : "bg-slate-50"}>
                                                <td className="font-bold border p-2 text-center">{r[0]}</td>
                                                {r.slice(1).map((c, j) => <td key={j} className="border p-2 text-center">{c}</td>)}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </DraggableModal>
                    )}

                    {/* INSTRUCTOR LOGIN MODAL */}
                    {showTeacherLogin && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[9999] p-4">
                            <div className="bg-white p-6 rounded-lg shadow-lg w-full max-w-xs">
                                <h3 className="font-bold mb-4 text-lg text-slate-800">Instructor Access</h3>
                                <input 
                                    type="password" 
                                    className="w-full border p-3 mb-4 rounded text-base" 
                                    placeholder="Password" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && handleTeacherLogin()}
                                    autoFocus
                                />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowTeacherLogin(false)} className="text-slate-500 py-2 px-3">Cancel</button>
                                    <button onClick={handleTeacherLogin} className="bg-blue-600 text-white px-4 py-2 rounded font-bold">Login</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script src="../access-control.js"></script>
</body>
</html>
