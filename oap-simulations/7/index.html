        /* Custom Table Styles */
        .ref-table th, .ref-table td {
            padding: 8px 10px;
            font-size: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        .ref-table tr:hover { background-color: #f1f5f9; }
        .ref-table .val-cell { 
            text-align: right; 
            font-family: 'Roboto Mono', monospace; 
            cursor: pointer;
            color: #2563eb;
            transition: all 0.2s;
            font-weight: 500;
        }
        .ref-table .val-cell:hover { 
            background-color: #dbeafe; 
            color: #1e40af;
            transform: scale(1.05);
        }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* XP Gamification Animations */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-25px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }
        .animate-float-xp {
            animation: floatUp 1.5s ease-out forwards;
        }

        /* Coin Spin Animation */
        @keyframes spin-once {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.3); }
            100% { transform: rotateY(360deg) scale(1); }
        }
        .animate-spin-once {
            animation: spin-once 0.6s ease-out;
            display: inline-block;
        }
        
        /* Animated Gradients for Top Rank */
        @keyframes gradient-x {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 3s ease infinite;
        }

        /* Level Up Toast Animation */
        .level-up-toast {
            animation: slideInDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOutUp 0.5s 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes slideInDown {
            from { transform: translate(-50%, -150%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeOutUp {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, -150%); opacity: 0; }
        }
        
        /* Progress Bar Striping */
        @keyframes progressStripes {
            0% { background-position: 1rem 0; }
            100% { background-position: 0 0; }
        }
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progressStripes 1s linear infinite;
        }

        /* Resize Handle Styles */
        .resize-handle {
            transition: background-color 0.2s;
        }
        .resize-handle:hover, .resize-handle:active {
            background-color: #3b82f6;
        }

                osc1.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.1);

        // Shared Validation Function
        const validateAnswer = (val, correctValue, isPct = false) => {
            if (correctValue === undefined || val === undefined || val === "") return false;

            // Handle String Matching (Textareas or dropdowns)
            if (typeof correctValue === 'string') {
                if (correctValue.length > 20) {
                    // For long explanations, just check if they typed a substantial answer
                    return String(val).trim().length > 10;
                } else {
                    // Exact match for dropdowns or short texts
                    return String(val).trim().toLowerCase() === correctValue.toLowerCase();
                }
            }

            // Clean the string (Handle %, commas, spaces)
            let cleanVal = String(val).replace(/[%,\s]/g, '');
            let numVal = parseFloat(cleanVal);

            // Eval simple math expressions
            if (isNaN(numVal) && typeof val === 'string' && val.match(/[+\-*\/]/)) {
                  try {
                    numVal = Function('"use strict";return (' + val + ')')();
                  } catch(e) {}
            }

            if (isNaN(numVal)) return false;
            
            // Tolerance: Max of 2% relative error or absolute 0.1
            const tolerance = Math.max(Math.abs(correctValue * 0.02), 0.1); 
            
            // Direct Match Validation
            let isValid = Math.abs(numVal - correctValue) <= tolerance;

            // Smart Percentage Validation (Bi-directional)
            if (isPct || Math.abs(correctValue) <= 1.0) {
                 if (!isValid && Math.abs((numVal * 100) - correctValue) <= tolerance) isValid = true;
                 if (!isValid && Math.abs((numVal / 100) - correctValue) <= tolerance) isValid = true;
            }
            return isValid;
        };

            }, [value]);

            const validateLocal = (val) => {
                if (correctValue === undefined) return;
                const isValid = validateAnswer(val, correctValue, isPct);
                
                if (isValid) {
                    if (status !== "correct") {
                        playCoinSound();
                        setShowXP(true);
                        setTimeout(() => setShowXP(false), 1500);
                    }
                    setStatus("correct");
                } else {
                    setStatus("incorrect");
                }
            };

            const calculateExpression = (val) => {
                // Strip non-math chars but keep operators
                const cleanForEval = String(val).replace(/[^0-9+\-*\/().]/g, '');
                if (cleanForEval.match(/[+\-*\/]/)) {
                    try {
                        let calculated = Function('"use strict";return (' + cleanForEval + ')')();
                        
                        // Auto-scale percentages if the user divided but forgot to multiply by 100
                        if (isPct && Math.abs(calculated) < 2 && !cleanForEval.includes('*')) {
                            calculated = calculated * 100;
                        }

                        // Prevent premature rounding errors by using up to 6 decimal places
                        return parseFloat(calculated.toFixed(6));
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            };

            const handleBlur = (e) => {
                let val = e.target.value;
                const calculated = calculateExpression(val);
                if (calculated !== null) {
                    onAnswer(id, calculated);
                    setLocalVal(calculated);
                    validateLocal(calculated);
                    return;
                }
                onAnswer(id, val);
                validateLocal(val);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.target.blur();
                }
            };

            const borderColor = status === 'correct' ? 'border-teal-500 bg-teal-50 text-teal-900' : 
                                status === 'incorrect' ? 'border-red-500 bg-red-50 text-red-900' : 
                                isActive ? 'border-blue-500 ring-2 ring-blue-100 bg-white' : 'border-slate-300 bg-white';

            return (
                <div className="flex flex-col relative">
                    {label && <label className="text-[10px] text-slate-500 mb-1 uppercase font-bold tracking-wider">{label}</label>}
                    <div className="relative flex items-center">
                        <input
                            id={id}
                            type="text" 
                            value={localVal}
                            onChange={(e) => { 
                                setLocalVal(e.target.value); 
                                onAnswer(id, e.target.value); 
                            }}
                            onFocus={() => onFocus(id)}
                            onBlur={handleBlur}
                            onKeyDown={handleKeyDown}
                            className={`w-full p-2 text-sm border rounded shadow-sm transition-all outline-none font-mono ${borderColor} min-w-[100px]`}
                            placeholder="" 
                        />
                        {isPct && <span className="absolute right-8 text-slate-400 text-xs">%</span>}
                        
                         {status === 'correct' && (
                             <div className="absolute right-8 text-teal-500 pointer-events-none animate-bounce">
                                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                             </div>
                         )}
                         
                         {showXP && <div className="absolute right-0 -top-8 text-amber-500 font-black text-lg pointer-events-none animate-float-xp z-50 drop-shadow-md whitespace-nowrap flex items-center gap-1"><span className="text-2xl animate-spin-once">🪙</span> +100 XP</div>}

                        {hint && (
                            <div 
                                className="ml-2 text-slate-400 hover:text-amber-500 cursor-help transition-colors relative flex items-center justify-center h-full"
                                onMouseEnter={() => setShowHint(true)}
                                onMouseLeave={() => setShowHint(false)}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                                
                                {/* Hint Popover */}
                                {showHint && (
                                    <div className="absolute z-50 bottom-full mb-2 right-0 w-48 bg-slate-800 text-white text-xs rounded p-2 shadow-lg font-sans text-left leading-relaxed">
                                        {hint}
                                        <div className="absolute top-full right-0.5 border-4 border-transparent border-t-slate-800"></div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                    {teacherMode && (
                        <div className="text-[10px] text-teal-600 font-mono mt-0.5 tracking-tight flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            {correctValue}
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENT: APP ---
        function App() {
            const [activeInputId, setActiveInputId] = useState(null);
            const [studentAnswers, setStudentAnswers] = useState({});
            const [studentName, setStudentName] = useState("");
            const [teacherMode, setTeacherMode] = useState(false);
            const [showPwdModal, setShowPwdModal] = useState(false);
            const [confirmation, setConfirmation] = useState({ isOpen: false, message: '', onConfirm: null });
            
            // Layout States
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [currentModule, setCurrentModule] = useState("conceptual");
            const [sidebarWidth, setSidebarWidth] = useState(384); // Default 384px (w-96)
            const [isResizing, setIsResizing] = useState(false);
            const [isMobile, setIsMobile] = useState(false);
            const fileInputRef = useRef(null);

            // --- GAMIFICATION LOGIC ---
            const { score, totalPoints, pctComplete, rankInfo } = useMemo(() => {
                let pts = 0;
                let total = Object.keys(FULL_ANSWER_KEY).length;
                
                Object.keys(FULL_ANSWER_KEY).forEach(key => {
                    const corVal = FULL_ANSWER_KEY[key];
                    const stuVal = studentAnswers[key];
                    if (stuVal === undefined || stuVal === "") return;
                    
                    if (validateAnswer(stuVal, corVal, true)) {
                        pts++;
                    }
                });

                const pct = total === 0 ? 0 : Math.round((pts / total) * 100);
                
                let rank = { name: "Novice Analyst", icon: "📘", color: "from-slate-400 to-slate-500", glow: "shadow-slate-900/50 text-slate-100" };
                if (pct >= 100) rank = { name: "Master Analyst", icon: "🏛️", color: "from-yellow-300 via-amber-400 to-orange-500 animate-gradient-x", glow: "shadow-amber-500/40 text-white" };
                else if (pct >= 80) rank = { name: "Principal Analyst", icon: "📊", color: "from-blue-600 to-indigo-800", glow: "shadow-blue-500/40 text-blue-100" };
                else if (pct >= 60) rank = { name: "Lead Analyst", icon: "📈", color: "from-indigo-500 to-purple-600", glow: "shadow-purple-500/40 text-indigo-100" };
                else if (pct >= 40) rank = { name: "Senior Associate", icon: "📋", color: "from-teal-400 to-emerald-500", glow: "shadow-teal-500/40 text-teal-50" };
                else if (pct >= 20) rank = { name: "Financial Associate", icon: "📝", color: "from-cyan-500 to-blue-500", glow: "shadow-cyan-500/40 text-cyan-50" };

                return { score: pts, totalPoints: total, pctComplete: pct, rankInfo: rank };
            }, [studentAnswers]);

            // Track Rank Changes for Level Up Hype
            const prevRank = useRef("Novice Analyst");
            const [showLevelUp, setShowLevelUp] = useState(null);

            useEffect(() => {
                if (rankInfo.name !== prevRank.current && score > 0) {
                    setShowLevelUp(rankInfo);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.3 }, zIndex: 1000 });
                    setTimeout(() => setShowLevelUp(null), 4000);
                    prevRank.current = rankInfo.name;
                }
            }, [rankInfo.name, score]);

            // --- RESIZE LOGIC ---
            
            useEffect(() => {
                const checkMobile = () => {
                    setIsMobile(window.innerWidth < 768); // Tailwind md breakpoint
                };
                
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            const startResizing = useCallback(() => {
                setIsResizing(true);
            }, []);

            const stopResizing = useCallback(() => {
                setIsResizing(false);
            }, []);

            const resize = useCallback((mouseMoveEvent) => {
                if (isResizing) {
                    const newWidth = mouseMoveEvent.clientX;
                    if (newWidth > 250 && newWidth < 800) { // Min/Max constraints
                        setSidebarWidth(newWidth);
                    }

            }, [isResizing]);

            useEffect(() => {
                window.addEventListener("mousemove", resize);
                window.addEventListener("mouseup", stopResizing);
                return () => {
                    window.removeEventListener("mousemove", resize);
                    window.removeEventListener("mouseup", stopResizing);
                };
            }, [resize, stopResizing]);

            // --- GLOBAL HANDLERS ---
            
            const handleInputFocus = (id) => {
                setActiveInputId(id);
            };

            const handleGlobalValueClick = (val) => {
                if (!activeInputId) return;
                
                setStudentAnswers(prev => {
                    const currentVal = String(prev[activeInputId] || "");
                    const lastChar = currentVal.trim().slice(-1);
                    const isOperator = ['+', '-', '*', '/'].includes(lastChar);
                    
                    if (currentVal === "") return { ...prev, [activeInputId]: String(val) };
                    if (isOperator) return { ...prev, [activeInputId]: currentVal + val };
                    return { ...prev, [activeInputId]: `${currentVal}+${val}` };

                    const el = document.getElementById(activeInputId);

            const checkPassword = (inputPwd) => {

                if (btoa(inputPwd) === _0x12a4[0]) {

                    alert("Incorrect Password");
                }
            };

            const autoFillAnswers = () => {
                setConfirmation({
                    isOpen: true,
                    message: "Are you sure you want to overwrite all answers with the key?",

                        setStudentAnswers(FULL_ANSWER_KEY);
                        setConfirmation({ isOpen: false, message: '', onConfirm: null });

            };

            const clearAnswers = () => {

                    }
                });
            };

            const downloadAnswers = () => {
                const name = studentName || prompt("Please enter your name:");
                if (!name) return;
                setStudentName(name);

                let content = `Financial Analysis Simulation\nStudent: ${name}\nDate: ${new Date().toLocaleDateString()}\n\n-- ANSWERS --\n\n`;
                Object.entries(studentAnswers).forEach(([key, val]) => {
                    content += `${key}: ${val}\n`;
                });

                // Append raw data for restoring state later
                content += `\n\n--- RAW DATA (DO NOT EDIT) ---\n`;
                content += JSON.stringify({ studentAnswers }, null, 2);

                const blob = new Blob([content], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${name.replace(/\s+/g, '_')}_Financial_Analysis.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        let loadedName = studentName;
                        const nameLine = content.split('\n').find(line => line.startsWith('Student:'));
                        if (nameLine) loadedName = nameLine.replace('Student:', '').trim();

                        const rawDataMarker = "--- RAW DATA (DO NOT EDIT) ---";
                        const dataIndex = content.indexOf(rawDataMarker);
                        
                        if (dataIndex !== -1) {
                            const jsonStr = content.substring(dataIndex + rawDataMarker.length).trim();
                            const parsed = JSON.parse(jsonStr);
                            
                            if (parsed.studentAnswers) setStudentAnswers(parsed.studentAnswers);
                            
                            setStudentName(loadedName);
                            alert("Progress loaded successfully!");
                        } else {
                            alert("This file appears to be from an older version or is missing the saved data block. It cannot be loaded automatically.");
                        }
                    } catch (err) {
                        console.error("Failed to parse file:", err);
                        alert("Could not read the file correctly. Please make sure you are uploading a valid saved report file.");
                    }
                    
                    // Reset input
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            // Helpers for displaying active module icon in header
            const getModuleIcon = () => {
                switch(currentModule) {
                    case 'conceptual': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
                    case 'operating': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
                    case 'warranty': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
                    case 'debt': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
                    case 'contingencies': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path><path d="M8.5 8.5v.01"></path><path d="M16 15.5v.01"></path><path d="M12 12v.01"></path><path d="M11 17v.01"></path><path d="M7 14v.01"></path></svg>;
                    default: return null;
                }
            }
            
            const getModuleColorClass = () => {
                switch(currentModule) {
                    case 'conceptual': return 'text-violet-600 bg-violet-100';
                    case 'operating': return 'text-cyan-600 bg-cyan-100';
                    case 'warranty': return 'text-amber-600 bg-amber-100';
                    case 'debt': return 'text-indigo-600 bg-indigo-100';
                    case 'contingencies': return 'text-rose-600 bg-rose-100';
                    default: return 'text-blue-600 bg-blue-100';
                }
            }

            // --- RENDER ---
            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden relative font-sans text-slate-800">
                    
                    {/* LEVEL UP MODAL */}
                    {showLevelUp && (
                        <div className="fixed top-12 left-1/2 -translate-x-1/2 z-[100] level-up-toast pointer-events-none">
                            <div className="bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.3)] flex items-center gap-5 border border-white/10">
                                <div className="text-5xl animate-bounce drop-shadow-lg">{showLevelUp.icon}</div>
                                <div>
                                    <div className="text-white font-black text-2xl uppercase tracking-widest drop-shadow-md">Rank Up!</div>
                                    <div className={`font-bold text-transparent bg-clip-text bg-gradient-to-r ${showLevelUp.color}`}>
                                        You are now a {showLevelUp.name}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRMATION MODAL */}
                    {confirmation.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-96 animate-in fade-in zoom-in duration-200 border border-slate-200">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" className="text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>

                                </h3>
                                <p className="text-sm text-slate-600 mb-6">{confirmation.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmation({ isOpen: false, message: '', onConfirm: null })} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-md font-medium transition-colors">Cancel</button>
                                    <button onClick={confirmation.onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md text-sm font-medium shadow-sm transition-colors">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PASSWORD MODAL */}
                    {showPwdModal && (
                        <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-lg shadow-2xl w-80 animate-in fade-in zoom-in duration-200 border border-slate-200">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" className="text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    Instructor Access
                                </h3>
                                <div className="mb-4">
                                    <label className="block text-xs font-bold text-slate-500 mb-1">PASSWORD</label>
                                    <input 
                                        type="password" 
                                        id="pwdInput"
                                        autoFocus
                                        className="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
                                        placeholder="Enter password..."
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') checkPassword(e.target.value);
                                        }}
                                    />
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowPwdModal(false)} className="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
                                    <button onClick={() => checkPassword(document.getElementById('pwdInput').value)} className="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium shadow-sm">Login</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div 
                        style={{ width: isMobile ? '100%' : (isSidebarOpen ? sidebarWidth : '4rem') }}
                        className={`bg-[#0f172a] text-slate-300 flex flex-col shadow-2xl z-20 shrink-0 transition-width duration-200 ease-linear ${isMobile ? 'h-auto' : 'h-full'}`}
                    >
                        <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-[#0b1120]">
                            {(isSidebarOpen || isMobile) && (
                                <div className="flex flex-col">
                                    <h1 className="font-bold text-[15px] leading-tight text-white tracking-wide flex items-center gap-2 truncate">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" className="text-blue-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                        <span className="truncate">Financial Analysis Simulation</span>
                                    </h1>
                                </div>
                            )}
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded ml-auto transition-colors shrink-0">
                                {isMobile ? (
                                    isSidebarOpen ? <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg> : <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                ) : (
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

                            </button>
                        </div>

                        {/* Sidebar Content (Accordion on Mobile, Full on Desktop) */}

                            {/* PLAYER PROFILE CARD (Overarching Name Input & Rank) */}

                                <div className="relative z-10">
                                    <input 
                                        type="text" 
                                        placeholder="Enter Player Name..." 
                                        className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-md px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-bold mb-4 placeholder:text-slate-500 shadow-inner"
                                        value={studentName}
                                        onChange={(e) => setStudentName(e.target.value)}
                                    />

                                    <div className={`rounded-xl p-[2px] bg-gradient-to-br ${rankInfo.color} ${rankInfo.glow} shadow-lg transition-all duration-1000`}>
                                        <div className="bg-[#0b1120] rounded-[10px] p-3 h-full w-full relative overflow-hidden flex flex-col justify-center">
                                            
                                            <div className="flex justify-between items-end mb-2">
                                                <div>
                                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-0.5">Current Rank</div>
                                                    <div className={`font-black text-transparent bg-clip-text bg-gradient-to-br ${rankInfo.color} flex items-center gap-1.5`}>
                                                        <span className="text-base drop-shadow-md">{rankInfo.icon}</span> 
                                                        <span className={pctComplete===100?'text-white':''}>{rankInfo.name}</span>
                                                    </div>

                                <strong>Common Types:</strong> Product liability, workers comp, environmental issues.
                            </div>
                        </div>
                         <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h4 className="font-bold mb-4 text-cyan-800 flex items-center gap-2">
                                ITW (Illinois Tool Works)
                            </h4>
                            <label className="text-xs text-slate-500 font-bold uppercase tracking-wider mb-2 block">Accrued Amount Disclosed?</label>
                            <select 
                                className="w-full p-2.5 border border-slate-300 rounded-md text-sm bg-white font-bold cursor-pointer focus:ring-2 focus:ring-blue-100 outline-none"
                                value={answers.itw_cont_disc || ''}
                                onChange={(e) => onAnswer('itw_cont_disc', e.target.value)}
                            >
                                <option value="">Select...</option>
                                <option value="yes">Yes, specific amount listed</option>
                                <option value="no">No, aggregate exposure not material</option>
                            </select>
                            {teacherMode && answers.itw_cont_disc === 'no' && <span className="text-teal-600 text-xs block mt-2 font-bold bg-teal-50 p-1 px-2 rounded w-fit border border-teal-100">Correct</span>}
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
