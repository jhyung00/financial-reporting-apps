            color: #38bdf8;
            transition: all 0.2s;
            font-weight: 500;
        }
        .ref-table .val-cell:hover { 
            background-color: #0284c7; 
            color: #ffffff;
            transform: scale(1.05);
        }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Gamification Animations */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-25px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }
        .animate-float-xp {
            animation: floatUp 1.5s ease-out forwards;
        }

        /* Spin Animation */
        @keyframes spin-once {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.3); }
            100% { transform: rotateY(360deg) scale(1); }
        }
        .animate-spin-once {
            animation: spin-once 0.6s ease-out;
            display: inline-block;
        }
        
        /* Animated Gradients for Top Rank */
        @keyframes gradient-x {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 3s ease infinite;
        }

        /* Level Up Toast Animation */
        .level-up-toast {
            animation: slideInDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOutUp 0.5s 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes slideInDown {
            from { transform: translate(-50%, -150%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeOutUp {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, -150%); opacity: 0; }
        }
        
        /* Progress Bar Striping */
        @keyframes progressStripes {
            0% { background-position: 1rem 0; }
            100% { background-position: 0 0; }
        }
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progressStripes 1s linear infinite;
        }

        /* Martini Shower Animation */
        @keyframes martiniFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .martini-drop {
            position: fixed;

            z-index: 9999;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1500, ctx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(3000, ctx.currentTime + 0.1);
                gain1.gain.setValueAtTime(0, ctx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.02);
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc1.start(ctx.currentTime);
                osc1.stop(ctx.currentTime + 0.1);
            } catch(e) {}

            if (correctValue === undefined || val === undefined || val === "") return false;

            if (typeof correctValue === 'string') {
                if (correctValue.length > 20) {
                    return String(val).trim().length > 10;
                } else {
                    return String(val).trim().toLowerCase() === correctValue.toLowerCase();
                }
            }

            let cleanVal = String(val).replace(/[%,\s]/g, '');
            let numVal = parseFloat(cleanVal);

            if (isNaN(numVal) && typeof val === 'string' && val.match(/[+\-*\/]/)) {
                  try {
                    numVal = Function('"use strict";return (' + val + ')')();
                  } catch(e) {}
            }

            if (isNaN(numVal)) return false;

        const SmartInput = ({ id, value, correctValue, onFocus, onAnswer, isActive, teacherMode, hasExported, label, isPct = false, hint }) => {
            const [localVal, setLocalVal] = useState(value || "");
            const [status, setStatus] = useState("neutral");
            const [showHint, setShowHint] = useState(false);
            
            const showResult = hasExported || teacherMode;

            useEffect(() => {
                setLocalVal(value || "");
                if (value === undefined || value === "" || value === null) {
                    setStatus("neutral");
                } else {
                    validateLocal(value);
                }
            }, [value]);

            const validateLocal = (val) => {
                if (correctValue === undefined) return;
                const isValid = validateAnswer(val, correctValue, isPct);
                
                if (isValid) {
                    setStatus("correct");
                } else {
                    setStatus("incorrect");
                }
            };

            const calculateExpression = (val) => {
                const cleanForEval = String(val).replace(/[^0-9+\-*\/().]/g, '');
                if (cleanForEval.match(/[+\-*\/]/)) {
                    try {
                        let calculated = Function('"use strict";return (' + cleanForEval + ')')();
                        if (isPct && Math.abs(calculated) < 2 && !cleanForEval.includes('*')) {
                            calculated = calculated * 100;
                        }
                        return parseFloat(calculated.toFixed(6));
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            };

            const handleBlur = (e) => {
                let val = e.target.value;
                const calculated = calculateExpression(val);
                if (calculated !== null) {
                    onAnswer(id, calculated);
                    setLocalVal(calculated);
                    validateLocal(calculated);
                    return;
                }
                onAnswer(id, val);
                validateLocal(val);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.target.blur();
                }
            };

                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="bg-white p-6 rounded-xl border border-stone-200 relative shadow-sm">
                            <h4 className="font-bold mb-4 text-sky-700 flex items-center gap-2 uppercase tracking-widest text-sm border-b border-stone-100 pb-3">
                                PH (Parker Hannifin)
                            </h4>
                            <label className="text-[10px] text-stone-500 font-bold uppercase tracking-widest mb-2 block">Accrued Environmental Remediation (2022)</label>
                            <SmartInput 
                                id="ph_env_22" 
                                value={answers.ph_env_22} 
                                correctValue={16.4} 
                                onFocus={onFocus} 
                                onAnswer={onAnswer} 
                                isActive={activeId === 'ph_env_22'} 
                                teacherMode={teacherMode}
                                hasExported={hasExported}
                                label=""
                                hint="Search 'Environmental' in Notes"
                            />
                             <div className="mt-4 text-[10px] text-stone-500 bg-stone-50 p-3 rounded border border-stone-200 flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" className="text-rose-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                <span><strong className="text-stone-800">Common Types:</strong> Product liability, workers comp, environmental issues.</span>
                            </div>
                        </div>
                         <div className="bg-white p-6 rounded-xl border border-stone-200 relative shadow-sm">
                            <h4 className="font-bold mb-4 text-sky-700 flex items-center gap-2 uppercase tracking-widest text-sm border-b border-stone-100 pb-3">
                                ITW (Illinois Tool Works)
                            </h4>
                            <label className="text-[10px] text-stone-500 font-bold uppercase tracking-widest mb-2 block">Accrued Amount Disclosed?</label>
                            <select 
                                className="w-full p-2.5 border border-stone-300 rounded bg-white text-stone-800 text-sm font-bold cursor-pointer focus:ring-1 focus:ring-rose-500 outline-none"
                                value={answers.itw_cont_disc || ''}
                                onChange={(e) => onAnswer('itw_cont_disc', e.target.value)}
                            >
                                <option value="">Select...</option>
                                <option value="yes">Yes, specific amount listed</option>
                                <option value="no">No, aggregate exposure not material</option>
                            </select>
                            {(hasExported || teacherMode) && answers.itw_cont_disc === 'no' && <span className="text-emerald-700 text-xs mt-3 block font-bold bg-emerald-100/50 p-1.5 px-2 rounded w-fit border border-emerald-200">Correct</span>}
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
