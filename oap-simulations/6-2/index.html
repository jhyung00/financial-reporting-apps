    <!-- Tailwind CSS -->

    <!-- Lucide Icons -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom scrollbar for data panel */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Resizer Handle */
        .resizer { width: 8px; cursor: col-resize; background-color: #e2e8f0; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s; z-index: 20; flex-shrink: 0; }
        .resizer:hover, .resizer.active { background-color: #3b82f6; }
        .resizer-dots { height: 24px; width: 2px; background-color: #93c5fd; border-radius: 1px; }

        /* Fade In Animation */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Gamified XP Toast - Corporate Theme */
        .toast-xp {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border: 2px solid #eff6ff; color: white;
            font-weight: 900; font-size: 1.1rem; padding: 14px 28px; border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.3), 0 8px 10px -6px rgba(37, 99, 235, 0.2);
            transform: translateY(20px) scale(0.8); opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none;
            display: flex; align-items: center; gap: 10px; letter-spacing: -0.025em;
        }
        .toast-xp.show { transform: translateY(0) scale(1); opacity: 1; }

        /* Normal Toast */
        .toast-info {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            background-color: #1e293b; color: white; padding: 12px 24px; border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); opacity: 0; transform: translateY(10px);
            transition: all 0.3s ease; pointer-events: none; font-weight: 600; font-size: 0.95rem;
        }
        .toast-info.show { opacity: 1; transform: translateY(0); }

        /* Level Up Modal Animation */
        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            60% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .level-up-modal { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* Mobile specific adjustments */
        @media (max-width: 768px) { .resizer { display: none; } }
    </style>
</head>

<script type="text/babel">

    // --- 1. THE DATASET (Source of Truth) ---
    const DATA_SETS = {

                is: { title: "Income Statement", headers: ["Item", "2022", "2021"], rows: [ ["Operating Revenue", "15,932", "14,455"], ["Cost of Revenue", "9,429", "8,489"], ["Gross Profit", "6,503", "5,966"], ["Operating Income", "3,790", "3,477"], ["Interest Expense", "203", "202"], ["Net Income", "3,034", "2,694"] ] },

            CASE_DATA: {
                bs: { title: "Consolidated Balance Sheet", headers: ["Item", "2022", "2021", "2020", "2019"], rows: [ ["Cash & cash equivalents", "535,799", "733,117", "685,514", "3,219,767"], ["Marketable securities", "27,862", "39,116", "70,805", "150,931"], ["Trade A/R, net", "2,341,504", "2,183,594", "1,854,398", "2,131,054"], ["Non-trade & notes rec.", "543,757", "326,315", "244,870", "310,708"], ["Inventories", "2,214,553", "2,090,642", "1,964,195", "1,833,469"], ["Prepaid expenses & other", "6,383,169", "243,966", "214,986", "182,494"], ["Total Current Assets", "12,046,644", "5,616,750", "5,034,768", "7,828,423"], ["PPE, gross", "5,897,955", "6,040,220", "5,810,681", "5,186,730"], ["Accumulated depreciation", "(3,775,197)", "(3,773,744)", "(3,517,946)", "(3,418,443)"], ["PPE, net", "2,122,758", "2,266,476", "2,292,735", "1,768,287"], ["Deferred income taxes", "110,585", "104,251", "126,839", "150,462"], ["Investments & other assets", "788,057", "774,239", "764,563", "747,773"], ["Intangible assets, net", "3,135,817", "3,519,797", "3,798,913", "1,783,277"], ["Goodwill", "7,740,082", "8,059,687", "7,869,935", "5,453,805"], ["Total Assets", "25,943,943", "20,341,200", "19,887,753", "17,732,027"] ] },
                note_3: { title: "Note 3: Acquisitions (2020 Allocation)", hidden: true, headers: ["Item", "Lord", "Exotic"], rows: [ ["Cash acquired", "74,013", "8,179"], ["Accounts receivable", "153,765", "81,336"], ["Inventories", "248,600", "114,661"], ["Plant and equipment", "409,163", "178,393"], ["Intangible assets", "1,446,660", "874,470"], ["Goodwill", "1,966,865", "503,725"], ["Total assets acquired", "4,365,417", "1,765,390"], ["Net assets acquired", "3,455,443", "1,705,566"] ] },
                note_8: { title: "Note 8: Intangibles Details (2020)", hidden: true, headers: ["Item", "Gross '20", "Acc Amort '20"], rows: [ ["Patents and technology", "991,596", "162,528"], ["Trademarks", "748,326", "285,197"], ["Customer lists and other", "3,791,505", "1,284,789"], ["Total", "5,531,427", "1,732,514"] ] },
                cf_2020: { title: "Cash Flows (2020 Focus)", headers: ["Item", "2020", "2019"], rows: [ ["Net Income", "1,206,703", "1,512,931"], ["Depreciation", "252,899", "225,675"], ["Amortization", "284,632", "210,514"], ["Net Cash from Ops", "2,070,949", "1,730,140"] ] },
                ppe_detail: { title: "PPE Details (Notes)", headers: ["Item", "2022", "2021"], rows: [ ["Land & Improvements", "364,577", "362,096"], ["Buildings & Equipment", "1,783,805", "1,848,141"], ["Machinery & Equipment", "3,588,106", "3,653,566"], ["Construction in Progress", "161,467", "176,417"], ["Total Gross PPE", "5,897,955", "6,040,220"], ["Accumulated Depreciation", "(3,775,197)", "(3,773,744)"] ] },
                is_stub: { title: "Income Statement (Summary)", headers: ["Item", "2022", "2021"], rows: [ ["Net Sales", "15,861,608", "14,347,640"], ["Net Income", "1,315,605", "1,746,100"] ] }
            }
        }
    };

    // Global Quiz Questions
    const QUIZ_QUESTIONS = [
        { q: "What types of assets does depreciation primarily apply to?", options: [ "Intangible assets like patents and trademarks", "Tangible assets like buildings, trucks, and equipment", "Financial assets like stocks and bonds", "Current assets like cash and inventory" ], correct: 1, feedback: "Correct. Depreciation applies to tangible (physical) assets that wear out over time." },
        { q: "Why are depreciation and amortization expenses recorded over multiple periods rather than all at once?", options: [ "To minimize taxes in the current year", "To follow the Matching Principle, matching expenses with the revenue they generate", "Because cash is paid in installments", "To increase the value of the asset on the balance sheet" ], correct: 1, feedback: "Correct. The Matching Principle dictates expenses should be matched with the benefits/revenue they help generate." },
        { q: "If an intangible asset supports general business functions (like HR software), where is its amortization typically recorded?", options: [ "Cost of Goods Sold (COGS)", "Operating Expenses (Opex)", "Interest Expense", "Other Comprehensive Income" ], correct: 1, feedback: "Correct. Assets supporting general functions are classified under Operating Expenses (Opex)." },
        { q: "What is the typical accounting treatment for a permanent loss in value of an indefinite-lived intangible asset like Goodwill?", options: [ "Accelerated Depreciation", "Amortization over 5 years", "Impairment Charge (One-time)", "Revaluation to higher fair value" ], correct: 2, feedback: "Correct. Indefinite-lived assets are tested for impairment and written down via a one-time charge if value is lost." },
        { q: "How are Depreciation and Amortization treated on the Statement of Cash Flows?", options: [ "Subtracted from Investing Activities", "Added back to Net Income in Operating Activities", "Subtracted from Financing Activities", "They do not appear on the Cash Flow Statement" ], correct: 1, feedback: "Correct. They are non-cash expenses, so they are added back to Net Income to calculate cash flow from operations." },
        { q: "What does a high level of depreciation relative to revenue often signal about a company?", options: [ "It is a service-based company", "It has high capital intensity and future replacement costs", "It has very new assets", "It is about to go bankrupt" ], correct: 1, feedback: "Correct. High depreciation suggests heavy investment in physical assets (capital intensity) and future maintenance needs." },
        { q: "A sudden, sharp spike in Amortization expense is most likely an indicator of what?", options: [ "Buying new furniture", "Significant M&A (Merger & Acquisition) activity", "Paying off debt", "Hiring more employees" ], correct: 1, feedback: "Correct. M&A activity brings new intangible assets (customer lists, patents) onto the books, increasing amortization." },
        { q: "Why do analysts often use EBITDA to assess a company's performance?", options: [ "It includes all taxes and interest", "It represents the exact cash balance", "It excludes non-cash expenses and financing decisions to show core profitability", "It is required by GAAP" ], correct: 2, feedback: "Correct. EBITDA removes the effects of financing, accounting decisions (depreciation), and taxes to show core operational performance." }
    ];

    const COMPARE_QUESTIONS = [
        { id: 'c1', text: "Which company is more efficient at generating revenue from its physical assets (Highest PPE Turnover)?", options: ["ITW", "PH"], correct: "ITW" },
        { id: 'c2', text: "Which company's balance sheet indicates a heavier reliance on historical acquisitions (Highest Goodwill %)?", options: ["ITW", "PH"], correct: "PH" },
        { id: 'c3', text: "Which company has a more depleted/older physical asset base (Highest % Used Up)?", options: ["ITW", "PH"], correct: "ITW" }
    ];

    // --- GAMIFICATION CONFIG (Corporate Theme) ---
    const LEVELS = [
        { threshold: 0, title: "Junior Analyst", icon: "briefcase" },
        { threshold: 800, title: "Financial Investigator", icon: "search" },
        { threshold: 1800, title: "Senior Analyst", icon: "bar-chart-2" },
        { threshold: 2800, title: "Lead Strategist", icon: "pie-chart" },
        { threshold: 4500, title: "Principal Forensics Officer", icon: "building" }
    ];

    const CATEGORY_MAP = {
        avgNetPPE: 'Efficiency', ppeTurnover: 'Efficiency',
        avgGrossPPE: 'Aging', avgUsefulLife: 'Aging', percentUsed: 'Aging',
        intPct: 'Intangibles', gwPct: 'Intangibles',
        totalIntAcq: 'Deep Dive', totalGWAcq: 'Deep Dive', patNet: 'Deep Dive', tmNet: 'Deep Dive', listNet: 'Deep Dive', amort2020: 'Deep Dive', impairmentStatus: 'Deep Dive', phInsight: 'Deep Dive',
        mtsGw: 'Deep Dive', mtsInt: 'Deep Dive', ncvCust: 'Deep Dive', ncvTrade: 'Deep Dive', ncvPat: 'Deep Dive', ncvOther: 'Deep Dive', ncvIndef: 'Deep Dive', itwAmort: 'Deep Dive'
    };

    // --- 2. UTILITY FUNCTIONS ---
    const parseFinNumber = (str) => {
        if (!str) return 0;
        let clean = str.toString().replace(/,/g, '');
        if (clean.includes('(') && clean.includes(')')) clean = '-' + clean.replace(/[()]/g, '');
        return parseFloat(clean) || 0;
    };

    const safeEvaluate = (expr) => {
        try {
            const sanitized = expr.replace(/[^0-9+\-*/(). ]/g, '');
            // eslint-disable-next-line no-new-func
            return new Function('return ' + sanitized)();
        } catch (e) { return null; }
    };

    const getExpectations = (company) => {
        const rev22 = getData(company, 'is', 'Revenue', 1) || getData(company, 'is_stub', 'Net Sales', 1) || getData(company, 'is', 'Net Sales', 1);
        const netPPE22 = getData(company, 'bs', 'PPE, net', 1) || getData(company, 'bs', 'Plant & Equip', 1) || getData(company, 'bs', 'Net Plant', 1);
        const netPPE21 = getData(company, 'bs', 'PPE, net', 2) || getData(company, 'bs', 'Plant & Equip', 2) || getData(company, 'bs', 'Net Plant', 2);
        const grossPPE22 = getData(company, 'ppe_detail', 'Total Gross', 1);
        const grossPPE21 = getData(company, 'ppe_detail', 'Total Gross', 2);
        const depExp = company === 'ITW' ? getData(company, 'cf', 'Depreciation', 1) : getData(company, 'cf_2020', 'Depreciation', 1); 
        const accumDep22 = Math.abs(getData(company, 'ppe_detail', 'Accumulated', 1));
        const totalAssets = getData(company, 'bs', 'Total Assets', 1);
        const intangibles = getData(company, 'bs', 'Intangible', 1);
        const goodwill = getData(company, 'bs', 'Goodwill', 1);

        const avgNetPPE = (netPPE22 + netPPE21) / 2;
        const ppeTurnover = avgNetPPE ? (rev22 / avgNetPPE) : 0;
        const avgGrossPPE = (grossPPE22 + grossPPE21) / 2;
        const depExpValid = depExp || 0; 
        const avgUsefulLife = depExpValid ? (avgGrossPPE / depExpValid) : 0;
        const percentUsed = grossPPE22 ? (accumDep22 / grossPPE22) * 100 : 0;
        const intPct = totalAssets ? (intangibles / totalAssets) * 100 : 0;
        const gwPct = totalAssets ? (goodwill / totalAssets) * 100 : 0;

        let deepDiveData = {};
        if (company === 'PH') {
            const totalIntAcq = getData('PH', 'note_3', 'Intangible assets', 1) + getData('PH', 'note_3', 'Intangible assets', 2);
            const totalGWAcq = getData('PH', 'note_3', 'Goodwill', 1) + getData('PH', 'note_3', 'Goodwill', 2);
            const patNet = getData('PH', 'note_8', 'Patents', 1) - getData('PH', 'note_8', 'Patents', 2);
            const tmNet = getData('PH', 'note_8', 'Trademarks', 1) - getData('PH', 'note_8', 'Trademarks', 2);
            const listNet = getData('PH', 'note_8', 'Customer', 1) - getData('PH', 'note_8', 'Customer', 2);
            const amort2020 = getData('PH', 'cf_2020', 'Amortization', 1);
            deepDiveData = { totalIntAcq, totalGWAcq, patNet, tmNet, listNet, amort2020, impairmentStatus: "No, no charges recorded.", phInsight: "Significant acquisitions occurred (Inorganic Growth)" };
        } else if (company === 'ITW') {
            const mtsGw = getData('ITW', 'note_9', 'Goodwill', 1);
            const mtsInt = getData('ITW', 'note_9', 'Intangible Assets', 1);
            const ncvCust = getData('ITW', 'note_intangibles', 'Customer', 1);
            const ncvTrade = getData('ITW', 'note_intangibles', 'Trademarks', 1);
            const ncvPat = getData('ITW', 'note_intangibles', 'Patents', 1);
            const ncvOther = getData('ITW', 'note_intangibles', 'Other', 1);
            const ncvIndef = getData('ITW', 'note_intangibles', 'Indefinite', 1);
            const itwAmort = getData('ITW', 'cf', 'Amortization', 1);
            deepDiveData = { mtsGw, mtsInt, ncvCust, ncvTrade, ncvPat, ncvOther, ncvIndef, itwAmort, impairmentStatus: "No" };
        }

        return { avgNetPPE, ppeTurnover, avgGrossPPE, avgUsefulLife, percentUsed, intPct, gwPct, ...deepDiveData };
    };

    const getData = (company, section, rowName, colIndex) => {
        if (!DATA_SETS[company].CASE_DATA[section]) return 0;
        const rows = DATA_SETS[company].CASE_DATA[section].rows;
        const row = rows.find(r => r[0].toLowerCase().includes(rowName.toLowerCase()));
        if (!row) return 0;
        return parseFinNumber(row[colIndex]);
    };

    // --- 3. COMPONENTS ---

    function Toast({ message, type, show }) {
        const isXp = type === "xp";
        return (
            <div className={`${isXp ? 'toast-xp' : 'toast-info'} ${show ? 'show' : ''}`}>
                {isXp && <span key="trending-up" className="flex items-center"><i data-lucide="trending-up" className="w-5 h-5 text-blue-200"></i></span>}
                {message}
            </div>
        );
    }

    function DoughnutChart({ percent }) {
        const radius = 60;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - (percent / 100) * circumference;
        return (
            <div className="relative flex items-center justify-center w-40 h-40 flex-shrink-0">
                <svg className="transform -rotate-90 w-full h-full drop-shadow-md">
                    <circle cx="80" cy="80" r={radius} stroke="#e2e8f0" strokeWidth="14" fill="none" />
                    <circle cx="80" cy="80" r={radius} stroke="url(#gradient)" strokeWidth="14" fill="none"
                        strokeDasharray={circumference} strokeDashoffset={strokeDashoffset}
                        className="transition-all duration-1000 ease-out" strokeLinecap="round" />
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor="#3b82f6" />
                            <stop offset="100%" stopColor="#4f46e5" />
                        </linearGradient>
                    </defs>
                </svg>
                <div className="absolute flex flex-col items-center justify-center">
                    <span className="text-3xl font-black text-slate-800">{Math.round(percent)}%</span>
                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Mastered</span>
                </div>
            </div>
        );
    }

    function ProgressBar({ label, percent, color }) {
         return (
             <div className="mb-4 w-full">
                 <div className="flex justify-between text-xs mb-1.5 font-bold text-slate-600 uppercase tracking-wide">
                     <span>{label}</span>
                     <span className={color.replace('bg-', 'text-')}>{Math.round(percent)}%</span>
                 </div>
                 <div className="h-3 w-full bg-slate-200 rounded-full overflow-hidden shadow-inner">
                     <div className={`h-full ${color} transition-all duration-1000 ease-out`} style={{ width: `${percent}%` }}></div>
                 </div>
             </div>
         )
    }

    const PasswordModal = ({ isOpen, onClose, onSuccess }) => {
        const [password, setPassword] = React.useState("");
        const [error, setError] = React.useState("");

        if (!isOpen) return null;

        const handleSubmit = () => {
            const _0x12a4=["\x54\x30\x46\x51\x4e\x69\x30\x79\x4c\x55\x74\x6c\x65\x54\x56\x55"];
            if (btoa(password) === _0x12a4[0]) {
                onSuccess(); onClose(); setPassword(""); setError("");
            } else { setError("Incorrect authorization"); }
        };

        return (
            <div className="fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-sm">
                <div className="bg-white rounded-xl p-6 w-80 shadow-2xl border border-blue-200 fade-in">
                    <h2 className="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
                        <i data-lucide="shield" className="w-5 h-5 text-blue-600"></i>
                        Instructor Override
                    </h2>
                    <p className="text-xs text-slate-500 mb-3">Enter authorization code to reveal solutions.</p>
                    <input type="password" value={password} onChange={(e) => { setPassword(e.target.value); setError(""); }} placeholder="Code" className="w-full border border-slate-300 p-2.5 rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" onKeyDown={(e) => e.key === 'Enter' && handleSubmit()} autoFocus />
                    {error && <p className="text-xs text-red-500 mb-3 font-medium">{error}</p>}
                    <div className="flex justify-end gap-2 mt-2">
                        <button onClick={() => { onClose(); setPassword(""); setError(""); }} className="px-3 py-1.5 text-slate-600 hover:bg-slate-100 rounded-lg text-sm transition-colors">Cancel</button>
                        <button onClick={handleSubmit} className="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium shadow-sm transition-colors">Authorize</button>
                    </div>
                </div>
            </div>
        );
    };

    const SubmissionModal = ({ isOpen, onClose, onDownload, studentName, setStudentName }) => {
        const [name, setName] = React.useState("");

        React.useEffect(() => { if (isOpen) setName(studentName || ""); }, [isOpen, studentName]);

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-sm">
                <div className="bg-white rounded-xl p-6 w-96 shadow-2xl border border-slate-200 fade-in">
                    <h2 className="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                        <i data-lucide="file-check" className="w-5 h-5 text-blue-600"></i>
                        Save Report
                    </h2>
                    <p className="text-sm text-slate-600 mb-4">Enter your name to finalize this analysis report.</p>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Analyst Name" className="w-full border border-slate-300 p-3 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-sm" />

    const SmartInput = ({ id, value, onChange, onFocus, isActive, expectedValue, placeholder, isPercentage }) => {
        const [localValue, setLocalValue] = React.useState(value || "");
        const [status, setStatus] = React.useState('neutral');
        const [isFocused, setIsFocused] = React.useState(false);

        React.useEffect(() => {
            setLocalValue(value || "");
            validate(value);
        }, [value, expectedValue]);

        React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [status]);

        const validate = (val) => {
            if (val === undefined || val === "" || expectedValue === null || expectedValue === undefined) {
                setStatus('neutral'); return;
            }

            let cleanVal = String(val).replace(/[%,\s]/g, '');
            let numVal = parseFloat(cleanVal);

            if (isNaN(numVal) && typeof val === 'string' && val.match(/[+\-*\/]/)) {
                  try { numVal = Function('"use strict";return (' + val + ')')(); } catch(e) {}
            }

            if (isNaN(numVal)) {
                if (typeof expectedValue === 'string' && String(val).toLowerCase() === expectedValue.toLowerCase()) {
                    setStatus('correct'); return;
                }
                setStatus('incorrect'); return;
            }
            
            const tolerance = Math.max(Math.abs(expectedValue * 0.02), 0.1); 
            let isValid = Math.abs(numVal - expectedValue) <= tolerance;

            if (!isValid) {
                 if (Math.abs((numVal * 100) - expectedValue) <= tolerance) isValid = true;
                 if (Math.abs((numVal / 100) - expectedValue) <= tolerance) isValid = true;
            }
            
            setStatus(isValid ? 'correct' : 'incorrect');
        };

        const handleChange = (e) => {
            setLocalValue(e.target.value);
            onChange(id, e.target.value);
        };

        const handleFocusInternal = () => { setIsFocused(true); if (onFocus) onFocus(id); };

        const handleBlur = () => {
            setIsFocused(false);
            const result = safeEvaluate(localValue);
            if (result !== null && !isNaN(result)) {
                const rounded = parseFloat(result.toFixed(2));
                setLocalValue(rounded.toString());
                onChange(id, rounded.toString());
                validate(rounded);
            } else {
                validate(localValue);
            }
        };

        const handleKeyDown = (e) => { if (e.key === 'Enter') e.target.blur(); };

        let borderColor = 'border-slate-300';
        let bgColor = 'bg-white';
        let textColor = 'text-slate-800';
        
        if (isFocused) borderColor = 'border-blue-500 ring-2 ring-blue-100';
        else if (status === 'correct') { borderColor = 'border-emerald-500'; bgColor = 'bg-emerald-50/50'; textColor = 'text-emerald-900'; }
        else if (status === 'incorrect') { borderColor = 'border-rose-500'; bgColor = 'bg-rose-50/50'; textColor = 'text-rose-900'; }

        return (
            <div className="relative w-full group">
                <input type="text" value={localValue} onChange={handleChange} onFocus={handleFocusInternal} onBlur={handleBlur} onKeyDown={handleKeyDown} className={`w-full px-4 py-2.5 border-2 rounded-xl text-sm font-semibold transition-all duration-300 focus:outline-none font-mono ${borderColor} ${bgColor} ${textColor} shadow-sm`} placeholder={placeholder} />
                {status === 'correct' && (
                    <div key="correct-icon" className="absolute right-3 top-3 text-emerald-500 drop-shadow-sm transform scale-0 group-hover:scale-100 transition-transform">
                        <i data-lucide="check-circle-2" className="w-5 h-5"></i>
                    </div>

            </div>
        );
    };

                       <div className="w-full md:w-1/2 flex flex-col gap-3">
                           {Object.entries(stats).map(([cat, data]) => {
                               const pct = data.total > 0 ? (data.correct / data.total) * 100 : 0;
                               return <ProgressBar key={cat} label={cat} percent={pct} color={data.color} />;
                           })}
                       </div>
                   </div>
                   
                   {xpToNext > 0 && (
                       <div className="mt-8 text-sm font-medium text-slate-500">
                           Continue your analysis! Earn <strong className="text-blue-600 text-base">{xpToNext} more XP</strong> for a promotion to <strong className="text-blue-800 font-bold">{nextLevelObj.title}</strong>!
                       </div>
                   )}
                </div>
            </div>
        );
    }

    const App = () => {
        const [activeCompany, setActiveCompany] = React.useState('ITW');
        const [activeTab, setActiveTab] = React.useState('simulation');
        const [activeInputId, setActiveInputId] = React.useState(null);
        const [inputValues, setInputValues] = React.useState({ ITW: {}, PH: {} });
        const [showFormula, setShowFormula] = React.useState({ s1: false, s2: false, s3: false });
        const [showSolution, setShowSolution] = React.useState(false);
        const [isInstructor, setIsInstructor] = React.useState(false);
        const [showSubmissionModal, setShowSubmissionModal] = React.useState(false);
        const [showPasswordModal, setShowPasswordModal] = React.useState(false);
        const [studentName, setStudentName] = React.useState("");
        
        // Quiz & Compare State
        const [quizAnswers, setQuizAnswers] = React.useState({});
        const [quizShowResults, setQuizShowResults] = React.useState(false);
        const [compareAnswers, setCompareAnswers] = React.useState({});
        const [showCompareResults, setShowCompareResults] = React.useState(false);

        // Gamification States
        const [toastMessage, setToastMessage] = React.useState("");
        const [toastType, setToastType] = React.useState("info");
        const [showLevelUp, setShowLevelUp] = React.useState(false);
        const [prevLevelTitle, setPrevLevelTitle] = React.useState(LEVELS[0].title);

        // Layout State
        const [sidebarWidth, setSidebarWidth] = React.useState(40);
        const sidebarRef = React.useRef(null);
        const fileInputRef = React.useRef(null);
        const isResizing = React.useRef(false);
        const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);

        React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [activeCompany, isInstructor, showLevelUp, activeTab]);
        React.useEffect(() => { setShowSolution(false); }, [activeCompany]);

        React.useEffect(() => {
            const handleResize = () => setIsMobile(window.innerWidth < 768);
            window.addEventListener('resize', handleResize);
            return () => window.removeEventListener('resize', handleResize);
        }, []);

        const startResizing = React.useCallback(() => { isResizing.current = true; }, []);
        const stopResizing = React.useCallback(() => { isResizing.current = false; }, []);
        const resize = React.useCallback((e) => {
            if (isResizing.current) {
                const newWidth = (e.clientX / window.innerWidth) * 100;
                if (newWidth > 20 && newWidth < 80) setSidebarWidth(newWidth);
            }
        }, []);
        React.useEffect(() => { window.addEventListener("mousemove", resize); window.addEventListener("mouseup", stopResizing); return () => { window.removeEventListener("mousemove", resize); window.removeEventListener("mouseup", stopResizing); }; }, [resize, stopResizing]);

        const showToast = (msg, type="info") => {
            setToastMessage(msg); setToastType(type);
            setTimeout(() => setToastMessage(""), 3000);
        };

        // --- XP & Progression Engine ---
        const EXPECTATIONS = React.useMemo(() => ({ ITW: getExpectations('ITW'), PH: getExpectations('PH') }), []);

        const checkIsCorrect = React.useCallback((comp, key, value) => {
            const expected = EXPECTATIONS[comp][key];
            if (value === undefined || value === "" || expected === null || expected === undefined) return false;
            let cleanVal = String(value).replace(/[%,\s]/g, '');
            let numVal = parseFloat(cleanVal);
            if (isNaN(numVal) && typeof value === 'string' && value.match(/[+\-*\/]/)) {
                try { numVal = Function('"use strict";return (' + value + ')')(); } catch(e) {}
            }
            if (isNaN(numVal)) {
                if (typeof expected === 'string') return String(value).toLowerCase() === expected.toLowerCase();
                return false;
            }
            const tolerance = Math.max(Math.abs(expected * 0.02), 0.1);
            let isValid = Math.abs(numVal - expected) <= tolerance;
            if (!isValid) {
                if (Math.abs((numVal * 100) - expected) <= tolerance) isValid = true;
                if (Math.abs((numVal / 100) - expected) <= tolerance) isValid = true;
            }
            return isValid;
        }, [EXPECTATIONS]);

        const { currentXP, correctCount, totalCount, stats } = React.useMemo(() => {
            let xp = 0; let correct = 0; let total = 0;
            const localStats = {
                'Efficiency': { correct: 0, total: 0, color: 'bg-indigo-500' },
                'Aging': { correct: 0, total: 0, color: 'bg-cyan-500' },
                'Intangibles': { correct: 0, total: 0, color: 'bg-blue-500' },
                'Deep Dive': { correct: 0, total: 0, color: 'bg-rose-500' },
                'Analysis': { correct: 0, total: 0, color: 'bg-teal-500' },
                'Quiz': { correct: 0, total: 0, color: 'bg-purple-500' }
            };

            // Calculate Simulation XP
            Object.keys(EXPECTATIONS).forEach(comp => {
                Object.keys(EXPECTATIONS[comp]).forEach(key => {
                    const cat = CATEGORY_MAP[key];
                    if (cat) {
                        total++; localStats[cat].total++;
                        if (checkIsCorrect(comp, key, inputValues[comp]?.[key])) {
                            xp += 100; correct++; localStats[cat].correct++;
                        }
                    }
                });
            });

            // Calculate Quiz XP (only if submitted)
            QUIZ_QUESTIONS.forEach((q, i) => {
                total++; localStats['Quiz'].total++;
                if (quizShowResults && quizAnswers[i] === q.correct) {
                    xp += 100; correct++; localStats['Quiz'].correct++;
                }
            });

            // Calculate Compare XP (only if submitted)
            COMPARE_QUESTIONS.forEach((q, i) => {
                total++; localStats['Analysis'].total++;
                if (showCompareResults && compareAnswers[q.id] === q.correct) {
                    xp += 150; correct++; localStats['Analysis'].correct++;
                }
            });

            return { currentXP: xp, correctCount: correct, totalCount: total, stats: localStats };
        }, [inputValues, quizAnswers, compareAnswers, quizShowResults, showCompareResults, EXPECTATIONS, checkIsCorrect]);

        const { currentLevelObj, nextLevelObj, levelIndex } = React.useMemo(() => {
            let curr = LEVELS[0]; let next = LEVELS[1]; let idx = 1;
            for (let i = LEVELS.length - 1; i >= 0; i--) {
                if (currentXP >= LEVELS[i].threshold) { curr = LEVELS[i]; next = LEVELS[i+1] || LEVELS[i]; idx = i + 1; break; }
            }
            return { currentLevelObj: curr, nextLevelObj: next, levelIndex: idx };
        }, [currentXP]);

        React.useEffect(() => {
            if (currentLevelObj.title !== prevLevelTitle && currentXP > 0) {
                const prevIndex = LEVELS.findIndex(l => l.title === prevLevelTitle);
                const currIndex = LEVELS.findIndex(l => l.title === currentLevelObj.title);
                if (currIndex > prevIndex) {
                    setShowLevelUp(true); setTimeout(() => setShowLevelUp(false), 4000);
                }
                setPrevLevelTitle(currentLevelObj.title);
            }
        }, [currentLevelObj.title, currentXP, prevLevelTitle]);

        // --- Interaction Handlers ---
        const handleValueClick = (val) => {
            if (!activeInputId) return showToast("Select an input box first!", "info");
            const currentVal = inputValues[activeCompany][activeInputId] || "";
            const lastChar = currentVal.toString().slice(-1);
            let nextVal = val;
            if (/[0-9]/.test(lastChar)) nextVal = "+" + val;
            handleInputChange(activeInputId, currentVal + nextVal);
        };

        const handleInputChange = (id, val) => {
            const prevVal = inputValues[activeCompany]?.[id];
            const wasCorrect = checkIsCorrect(activeCompany, id, prevVal);
            const isNowCorrect = checkIsCorrect(activeCompany, id, val);
            
            setInputValues(prev => ({ ...prev, [activeCompany]: { ...prev[activeCompany], [id]: val } }));
            if (!wasCorrect && isNowCorrect) showToast("+100 XP! Accurate calculation.", "xp");
        };

        const handleFocus = (id) => setActiveInputId(id);
        const toggleFormula = (section) => setShowFormula(prev => ({...prev, [section]: !prev[section]}));
        const toggleSolution = () => setShowSolution(!showSolution);

        const handleAutoFill = () => {
            const formatForInput = (obj) => {
                const newObj = {};
                for (const key in obj) if (obj[key] !== undefined && obj[key] !== null) newObj[key] = obj[key].toString();
                return newObj;
            };
            setInputValues({ ITW: formatForInput(EXPECTATIONS.ITW), PH: formatForInput(EXPECTATIONS.PH) });
            setShowSolution(true); 
            
            const correctQuiz = {};
            QUIZ_QUESTIONS.forEach((q, i) => correctQuiz[i] = q.correct);
            setQuizAnswers(correctQuiz);
            setQuizShowResults(true);

            const correctCompare = {};
            COMPARE_QUESTIONS.forEach(q => correctCompare[q.id] = q.correct);
            setCompareAnswers(correctCompare);
            setShowCompareResults(true);
        };

        const handleClear = () => { 
            setInputValues({ ITW: {}, PH: {} }); 
            setShowSolution(false); 
            setQuizAnswers({});
            setQuizShowResults(false);
            setCompareAnswers({});
            setShowCompareResults(false);
        };
        
        const handleQuizSubmit = () => { 
            setQuizShowResults(true); 
            const correct = QUIZ_QUESTIONS.filter((q, i) => quizAnswers[i] === q.correct).length;
            if (correct > 0) showToast(`+${correct * 100} XP! Certification Complete!`, "xp");
        };

        const handleCompareSubmit = () => {
            setShowCompareResults(true);
            const correct = COMPARE_QUESTIONS.filter(q => compareAnswers[q.id] === q.correct).length;
            if (correct > 0) showToast(`+${correct * 150} XP! Excellent Analysis!`, "xp");
        };

        const handleDownloadSubmission = (submittedName) => {
            setStudentName(submittedName);
            let content = `Corporate Asset Forensics Report\nAnalyst: ${submittedName}\nDate: ${new Date().toLocaleDateString()}\nRank: ${currentLevelObj.title} (${currentXP} XP)\n\n`;
            
            ['ITW', 'PH'].forEach(company => {
                content += `--- ${company} ---\n`;
                content += JSON.stringify(inputValues[company], null, 2) + `\n\n`;
            });
            content += `--- SCRYING (COMPARE) ---\n`;
            content += JSON.stringify(compareAnswers, null, 2) + `\n\n`;
            content += `--- TRIAL (QUIZ) ---\nScore: ${QUIZ_QUESTIONS.filter((q, i) => quizAnswers[i] === q.correct).length} / ${QUIZ_QUESTIONS.length}\n`;
            content += `\n--- RAW DATA (DO NOT EDIT) ---\n` + JSON.stringify({ inputValues, quizAnswers, compareAnswers }, null, 2);

            const blob = new Blob([content], { type: 'text/plain' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${submittedName.replace(/\s+/g, '_')}_Asset_Forensics.txt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            setShowSubmissionModal(false);
        };

        const handleFileUpload = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                try {
                    let loadedName = studentName;
                    const nameLine = content.split('\n').find(line => line.startsWith('Analyst:'));
                    if (nameLine) loadedName = nameLine.replace('Analyst:', '').trim();

                    const dataIndex = content.indexOf("--- RAW DATA (DO NOT EDIT) ---");
                    if (dataIndex !== -1) {
                        const jsonStr = content.substring(dataIndex + 30).trim();
                        const parsed = JSON.parse(jsonStr);
                        if (parsed.inputValues) setInputValues(parsed.inputValues);
                        if (parsed.quizAnswers) { setQuizAnswers(parsed.quizAnswers); if (Object.keys(parsed.quizAnswers).length > 0) setQuizShowResults(true); }
                        if (parsed.compareAnswers) { setCompareAnswers(parsed.compareAnswers); if (Object.keys(parsed.compareAnswers).length > 0) setShowCompareResults(true); }
                        setStudentName(loadedName); showToast("Report Loaded Successfully!", "info");
                    } else { alert("Invalid file format."); }
                } catch (err) { alert("Could not parse file."); }
                e.target.value = null;
            };
            reader.readAsText(file);
        };

        const SectionHeader = ({ title, sectionKey, hideFormula = false, colorClass = "text-slate-800" }) => (
            <div className="flex justify-between items-center mb-4 pb-3 border-b-2 border-slate-100">
                <h3 className={`font-black text-lg ${colorClass} tracking-tight`}>{title}</h3>
                {!hideFormula && (
                    <button onClick={() => toggleFormula(sectionKey)} className="text-[11px] font-bold uppercase tracking-wider text-slate-400 hover:text-blue-600 flex items-center gap-1.5 transition-colors bg-slate-50 hover:bg-blue-50 px-2.5 py-1.5 rounded-md">
                        <span key={showFormula[sectionKey] ? "eye-off" : "eye"} className="flex shrink-0">
                            <i data-lucide={showFormula[sectionKey] ? "eye-off" : "eye"} className="w-3.5 h-3.5"></i>
                        </span>
                        {showFormula[sectionKey] ? "Hide Formulas" : "View Formulas"}
                    </button>
                )}
            </div>
        );

        const FormulaBox = ({ show, children, borderColor = "border-yellow-200", bgColor = "bg-yellow-50", textColor = "text-yellow-800" }) => {
            if (!show) return null;
            return <div className={`mb-6 p-4 rounded-xl border-2 text-sm font-mono shadow-inner ${borderColor} ${bgColor} ${textColor} leading-relaxed`}>{children}</div>;
        };

        const xpProgressPercent = nextLevelObj.threshold === currentLevelObj.threshold ? 100 : ((currentXP - currentLevelObj.threshold) / (nextLevelObj.threshold - currentLevelObj.threshold)) * 100;

        return (
            <div className="flex flex-col h-screen w-full overflow-hidden relative bg-slate-100 font-sans">
                <Toast message={toastMessage} type={toastType} show={!!toastMessage} />
                <SubmissionModal isOpen={showSubmissionModal} onClose={() => setShowSubmissionModal(false)} onDownload={handleDownloadSubmission} studentName={studentName} setStudentName={setStudentName} />
                <PasswordModal isOpen={showPasswordModal} onClose={() => setShowPasswordModal(false)} onSuccess={() => setIsInstructor(true)} />

                {/* Level Up Modal */}
                {showLevelUp && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100]">
                        <div className="bg-white p-10 rounded-3xl shadow-2xl text-center level-up-modal max-w-sm border-4 border-blue-400 relative overflow-hidden">
                            <div className="absolute -top-10 -right-10 text-blue-50 opacity-50"><i data-lucide="trending-up" className="w-40 h-40"></i></div>
                            <i data-lucide="award" className="w-16 h-16 mx-auto mb-4 text-blue-500 relative z-10"></i>
                            <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2 relative z-10">Promotion Earned!</h2>
                            <p className="text-slate-500 font-bold uppercase tracking-widest mb-6 relative z-10 text-sm">You are now a</p>
                            <div className="text-2xl font-black text-blue-700 bg-blue-50 px-6 py-4 rounded-2xl border-2 border-blue-100 relative z-10 shadow-sm">
                                {currentLevelObj.title}
                            </div>
                        </div>
                    </div>
                )}

                {/* Top Gamified Header */}
                <div className="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shadow-lg z-50 shrink-0 border-b border-slate-800">
                    <div className="flex items-center gap-6 flex-1">
                        <div className="flex items-center gap-4">
                            <h1 className="font-black text-xl tracking-tight flex items-center gap-2">
                                <div className="bg-blue-600 p-1.5 rounded shadow-sm"><i data-lucide="bar-chart" className="w-4 h-4 text-white"></i></div>
                                FinSim Global
                                <span className="font-medium text-blue-300 text-sm hidden sm:inline ml-1 border-l border-slate-700 pl-3">Asset Forensics</span>
                            </h1>
                            {activeTab === 'simulation' && (
                                <div className="bg-slate-800 p-1 rounded-lg flex ml-2 border border-slate-700/50">
                                    <button onClick={() => setActiveCompany('ITW')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition-all ${activeCompany === 'ITW' ? 'bg-blue-600 shadow-sm text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'}`}> ITW </button>
                                    <button onClick={() => setActiveCompany('PH')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition-all ${activeCompany === 'PH' ? 'bg-blue-600 shadow-sm text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'}`}> PH </button>
                                </div>
                            )}
                        </div>

                        {/* Player XP HUD */}
                        <div className="flex-1 max-w-md ml-auto mr-8 hidden lg:block cursor-help" title="Solve inputs correctly to earn XP and earn a promotion!">
                            <div className="flex justify-between text-[11px] font-black mb-1.5 px-1 tracking-wider uppercase">
                                <span className="text-blue-400 flex items-center gap-1.5">
                                    <span key={currentLevelObj.icon} className="flex shrink-0">
                                        <i data-lucide={currentLevelObj.icon} className="w-3.5 h-3.5"></i>
                                    </span>
                                     Lvl {levelIndex}: {currentLevelObj.title}
                                </span>
                                <span className="text-slate-300 font-mono">{currentXP} / {nextLevelObj.threshold === currentLevelObj.threshold ? 'MAX' : nextLevelObj.threshold} XP</span>
                            </div>
                            <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden shadow-inner border border-slate-700">
                                 <div className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-700 ease-out" style={{ width: `${xpProgressPercent}%` }}></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-2">
                        {isInstructor && (
                            <>
                                <button onClick={handleAutoFill} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 hidden md:flex transition-colors"><i data-lucide="check-circle" className="w-3 h-3"></i> Solve All</button>
                                <button onClick={handleClear} className="px-3 py-1.5 bg-rose-700 hover:bg-rose-600 rounded text-xs font-bold uppercase tracking-wider hidden md:block transition-colors">Clear All</button>
                            </>
                        )}
                        <input type="file" ref={fileInputRef} accept=".txt" style={{ display: 'none' }} onChange={handleFileUpload} />
                        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-sm flex items-center gap-1.5 transition-colors text-slate-300 hover:text-white">
                            <i data-lucide="upload" className="w-4 h-4"></i> <span className="hidden md:inline font-semibold text-xs uppercase tracking-wide">Load Report</span>
                        </button>
                        <button onClick={() => setShowSubmissionModal(true)} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 border border-blue-500 rounded text-sm flex items-center gap-1.5 transition-colors text-white">
                            <i data-lucide="save" className="w-4 h-4"></i> <span className="hidden md:inline font-semibold text-xs uppercase tracking-wide">Save Report</span>
                        </button>
                        <button onClick={() => isInstructor ? setIsInstructor(false) : setShowPasswordModal(true)} className={`px-3 py-1.5 rounded flex items-center gap-1 transition-colors border ${isInstructor ? 'bg-amber-500/20 text-amber-400 border-amber-500/50 hover:bg-amber-500/30' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                            <span key={isInstructor ? "unlock" : "lock"} className="flex shrink-0">
                                <i data-lucide={isInstructor ? "unlock" : "lock"} className="w-4 h-4"></i>
                            </span>
                        </button>
                    </div>
                </div>

                <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                    
                    {/* Left Data Panel - ONLY SHOW IN SIMULATION */}
                    {activeTab === 'simulation' && (
                        <div className="w-full md:w-auto h-1/2 md:h-full bg-[#0f172a] border-r border-slate-800 flex-shrink-0 z-20 shadow-2xl" style={{ width: !isMobile ? `${sidebarWidth}%` : '100%' }}>
                            <DataPanel companyKey={activeCompany} onCellClick={handleValueClick} />
                        </div>
                    )}
                    {activeTab === 'simulation' && !isMobile && (
                        <div className="resizer hover:bg-blue-500" onMouseDown={startResizing}>
                            <div className="resizer-dots"></div>
                        </div>
                    )}

                    {/* Right Workspace */}
                    <div className="flex-1 h-1/2 md:h-full bg-slate-50 flex flex-col overflow-hidden relative">
                        
                        {/* Interactive Tab Navigation */}
                        <div className="bg-white border-b border-slate-200 px-6 pt-4 pb-0 z-10 shadow-sm flex items-end gap-6 overflow-x-auto custom-scrollbar shrink-0">
                            <button onClick={() => setActiveTab('simulation')} className={`pb-3 px-2 text-sm font-bold transition-colors border-b-[3px] flex items-center gap-2 whitespace-nowrap ${activeTab === 'simulation' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-400 hover:text-slate-700 hover:border-slate-300'}`}>
                                <i data-lucide="search" className="w-4 h-4"></i> Asset Forensics
                            </button>
                            <button onClick={() => setActiveTab('compare')} className={`pb-3 px-2 text-sm font-bold transition-colors border-b-[3px] flex items-center gap-2 whitespace-nowrap ${activeTab === 'compare' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-400 hover:text-slate-700 hover:border-slate-300'}`}>
                                <i data-lucide="git-compare" className="w-4 h-4"></i> Strategic Comparison
                            </button>
                            <button onClick={() => setActiveTab('quiz')} className={`pb-3 px-2 text-sm font-bold transition-colors border-b-[3px] flex items-center gap-2 whitespace-nowrap ${activeTab === 'quiz' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-400 hover:text-slate-700 hover:border-slate-300'}`}>
                                <i data-lucide="clipboard-check" className="w-4 h-4"></i> Analyst Certification
                            </button>
                            <button onClick={() => setActiveTab('profile')} className={`pb-3 px-2 text-sm font-bold transition-colors border-b-[3px] flex items-center gap-2 whitespace-nowrap ml-auto ${activeTab === 'profile' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-400 hover:text-slate-700 hover:border-slate-300'}`}>
                                <i data-lucide="award" className="w-4 h-4"></i> Profile & Rank
                            </button>
                        </div>

                        {/* Scrollable Content Pane */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                            
                            {activeTab === 'profile' && (
                                <ProfileView stats={stats} correctCount={correctCount} totalCount={totalCount} currentXP={currentXP} currentLevelObj={currentLevelObj} nextLevelObj={nextLevelObj} />
                            )}

                            {activeTab === 'compare' && (
                                <CompareView inputValues={inputValues} compareAnswers={compareAnswers} setCompareAnswers={setCompareAnswers} showResults={showCompareResults} setShowResults={setShowCompareResults} onSubmit={handleCompareSubmit} isInstructor={isInstructor} />
                            )}

                            {activeTab === 'quiz' && (
                                <Quiz answers={quizAnswers} onSelect={(q, o) => setQuizAnswers(prev => ({...prev, [q]: o}))} showResults={quizShowResults} setShowResults={setQuizShowResults} setAnswers={setQuizAnswers} onSubmit={handleQuizSubmit} isInstructor={isInstructor} />
                            )}

                            {activeTab === 'simulation' && (
                                <div className="max-w-4xl mx-auto space-y-8 fade-in pb-20">
                                    
                                    {/* Section 1 */}
                                    <div className="bg-white p-6 md:p-8 rounded-2xl border border-indigo-100 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="bg-indigo-100 p-3 rounded-xl text-indigo-600"><i data-lucide="activity" className="w-6 h-6"></i></div>
                                            <div className="flex-1"><SectionHeader title="1. PPE Productivity & Efficiency" sectionKey="s1" colorClass="text-indigo-900" /></div>
                                        </div>
                                        <FormulaBox show={showFormula.s1} borderColor="border-indigo-200" bgColor="bg-indigo-50/50" textColor="text-indigo-800">
                                            Avg Net PPE = (Net PPE 2022 + Net PPE 2021) / 2 <br/>
                                            PPE Turnover = Revenue / Avg Net PPE
                                        </FormulaBox>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Average Net PPE</label>
                                                <SmartInput id="avgNetPPE" value={inputValues[activeCompany].avgNetPPE || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "avgNetPPE"} expectedValue={EXPECTATIONS[activeCompany].avgNetPPE} placeholder="(Y2 + Y1) / 2" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">PPE Turnover</label>
                                                <SmartInput id="ppeTurnover" value={inputValues[activeCompany].ppeTurnover || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "ppeTurnover"} expectedValue={EXPECTATIONS[activeCompany].ppeTurnover} placeholder="Revenue / Avg Net" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Section 2 */}
                                    <div className="bg-white p-6 md:p-8 rounded-2xl border border-cyan-100 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="bg-cyan-100 p-3 rounded-xl text-cyan-600"><i data-lucide="clock" className="w-6 h-6"></i></div>
                                            <div className="flex-1"><SectionHeader title="2. Asset Aging & Replacement" sectionKey="s2" colorClass="text-cyan-900" /></div>
                                        </div>
                                        <FormulaBox show={showFormula.s2} borderColor="border-cyan-200" bgColor="bg-cyan-50/50" textColor="text-cyan-800">
                                            Avg Gross PPE = (Gross PPE 2022 + Gross PPE 2021) / 2 <br/>
                                            Avg Useful Life = Avg Gross PPE / Depreciation Expense <br/>
                                            Percent Used Up = Acc. Depreciation / Total Gross PPE
                                        </FormulaBox>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Avg Gross PPE</label>
                                                <SmartInput id="avgGrossPPE" value={inputValues[activeCompany].avgGrossPPE || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "avgGrossPPE"} expectedValue={EXPECTATIONS[activeCompany].avgGrossPPE} placeholder="(G22+G21)/2" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Est. Useful Life</label>
                                                <SmartInput id="avgUsefulLife" value={inputValues[activeCompany].avgUsefulLife || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "avgUsefulLife"} expectedValue={EXPECTATIONS[activeCompany].avgUsefulLife} placeholder="Avg Gross/Depr" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">% Used Up (2022)</label>
                                                <SmartInput id="percentUsed" value={inputValues[activeCompany].percentUsed || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "percentUsed"} expectedValue={EXPECTATIONS[activeCompany].percentUsed} placeholder="(Acc Dep/Gross)" isPercentage={true} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Section 3 */}
                                    <div className="bg-white p-6 md:p-8 rounded-2xl border border-blue-100 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="bg-blue-100 p-3 rounded-xl text-blue-600"><i data-lucide="layers" className="w-6 h-6"></i></div>
                                            <div className="flex-1"><SectionHeader title="3. Intangibles & Goodwill" sectionKey="s3" colorClass="text-blue-900" /></div>
                                        </div>
                                        <FormulaBox show={showFormula.s3} borderColor="border-blue-200" bgColor="bg-blue-50/50" textColor="text-blue-800">
                                            Intangibles % = (Intangibles / Total Assets) * 100 <br/>
                                            Goodwill % = (Goodwill / Total Assets) * 100
                                        </FormulaBox>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Intangibles % of Assets</label>
                                                <SmartInput id="intPct" value={inputValues[activeCompany].intPct || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "intPct"} expectedValue={EXPECTATIONS[activeCompany].intPct} placeholder="(Int / Assets)" isPercentage={true} />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Goodwill % of Assets</label>
                                                <SmartInput id="gwPct" value={inputValues[activeCompany].gwPct || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "gwPct"} expectedValue={EXPECTATIONS[activeCompany].gwPct} placeholder="(GW / Assets)" isPercentage={true} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Section 4 (Deep Dive) */}
                                    <div className="bg-gradient-to-br from-white to-rose-50/30 p-6 md:p-8 rounded-2xl border border-rose-100 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden">
                                        <div className="absolute -right-6 -bottom-6 opacity-10"><i data-lucide="microscope" className="w-48 h-48 text-rose-500"></i></div>
                                        
                                        <div className="flex items-start gap-4 mb-8 relative z-10">
                                            <div className="bg-rose-100 p-3 rounded-xl text-rose-600 shadow-sm"><i data-lucide="search" className="w-6 h-6"></i></div>
                                            <div className="flex-1">
                                                <div className="flex justify-between items-center mb-1">
                                                    <h3 className="font-black text-xl text-rose-900 tracking-tight">4. Deep Dive Analysis</h3>
                                                    <div className="flex gap-2">
                                                        <button onClick={toggleSolution} className={`text-[10px] font-bold uppercase px-3 py-1.5 rounded-lg border flex items-center gap-1.5 shadow-sm transition-all ${showSolution ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>
                                                            {showSolution ? "Hide Data Notes" : "View Data Notes"} 
                                                            <span key={showSolution ? "eye-off" : "eye"} className="flex shrink-0">
                                                                <i data-lucide={showSolution ? "eye-off" : "eye"} className="w-3.5 h-3.5"></i>
                                                            </span>
                                                        </button>
                                                    </div>
                                                </div>
                                                <p className="text-sm font-medium text-rose-700/80">Investigate the specific M&A notes and intangible breakdowns.</p>
                                            </div>
                                        </div>

                                        {showSolution && <div className="relative z-10"><SolutionDataViewer companyKey={activeCompany} noteKeys={activeCompany === 'ITW' ? ['note_9', 'note_intangibles'] : ['note_3', 'note_8']} /></div>}

                                        {activeCompany === 'ITW' ? (
                                            <div className="relative z-10 space-y-8">
                                                <div>
                                                    <SectionHeader title="Part A: MTS Acquisition (Note 9)" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Goodwill Recorded</label>
                                                            <SmartInput id="mtsGw" value={inputValues[activeCompany].mtsGw || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "mtsGw"} expectedValue={EXPECTATIONS[activeCompany].mtsGw} placeholder="See Note 9" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Intangibles Recorded</label>
                                                            <SmartInput id="mtsInt" value={inputValues[activeCompany].mtsInt || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "mtsInt"} expectedValue={EXPECTATIONS[activeCompany].mtsInt} placeholder="See Note 9" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <SectionHeader title="Part B: Net Carrying Values 2022" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Customer Lists</label>
                                                            <SmartInput id="ncvCust" value={inputValues[activeCompany].ncvCust || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "ncvCust"} expectedValue={EXPECTATIONS[activeCompany].ncvCust} placeholder="Net Value" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Trademarks</label>
                                                            <SmartInput id="ncvTrade" value={inputValues[activeCompany].ncvTrade || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "ncvTrade"} expectedValue={EXPECTATIONS[activeCompany].ncvTrade} placeholder="Net Value" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Patents</label>
                                                            <SmartInput id="ncvPat" value={inputValues[activeCompany].ncvPat || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "ncvPat"} expectedValue={EXPECTATIONS[activeCompany].ncvPat} placeholder="Net Value" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <SectionHeader title="Part C: Amortization & Impairment" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2022 Amortization Expense</label>
                                                            <SmartInput id="itwAmort" value={inputValues[activeCompany].itwAmort || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "itwAmort"} expectedValue={EXPECTATIONS[activeCompany].itwAmort} placeholder="From Cash Flows" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Did ITW record Impairment?</label>
                                                            <SmartSelect 
                                                                id="impairmentStatus" 
                                                                value={inputValues[activeCompany].impairmentStatus} 
                                                                onChange={handleInputChange} 
                                                                expectedValue={EXPECTATIONS[activeCompany].impairmentStatus} 
                                                                options={["Yes", "No"]} 
                                                                placeholder="Select insight..." 
                                                                isInstructor={isInstructor} 
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="relative z-10 space-y-8">
                                                <div>
                                                    <SectionHeader title="Part A: Acquisition Impact (Note 3)" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Total Intangibles Acquired (2020)</label>
                                                            <SmartInput id="totalIntAcq" value={inputValues[activeCompany].totalIntAcq || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "totalIntAcq"} expectedValue={EXPECTATIONS[activeCompany].totalIntAcq} placeholder="See Note 3" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Total Goodwill Created (2020)</label>
                                                            <SmartInput id="totalGWAcq" value={inputValues[activeCompany].totalGWAcq || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "totalGWAcq"} expectedValue={EXPECTATIONS[activeCompany].totalGWAcq} placeholder="See Note 3" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <SectionHeader title="Part B: Net Carrying Values 2020 (Note 8)" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Patents & Tech Net Value</label>
                                                            <SmartInput id="patNet" value={inputValues[activeCompany].patNet || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "patNet"} expectedValue={EXPECTATIONS[activeCompany].patNet} placeholder="Gross - Acc. Amort" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Trademarks Net Value</label>
                                                            <SmartInput id="tmNet" value={inputValues[activeCompany].tmNet || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "tmNet"} expectedValue={EXPECTATIONS[activeCompany].tmNet} placeholder="Gross - Acc. Amort" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Customer Lists Net Value</label>
                                                            <SmartInput id="listNet" value={inputValues[activeCompany].listNet || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "listNet"} expectedValue={EXPECTATIONS[activeCompany].listNet} placeholder="Gross - Acc. Amort" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <SectionHeader title="Part C: Amortization & Impairment" sectionKey="s4" hideFormula={true} colorClass="text-slate-800 text-sm uppercase tracking-wider" />
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2020 Amortization Expense</label>
                                                            <SmartInput id="amort2020" value={inputValues[activeCompany].amort2020 || ""} onChange={handleInputChange} onFocus={handleFocus} isActive={activeInputId === "amort2020"} expectedValue={EXPECTATIONS[activeCompany].amort2020} placeholder="From Cash Flows" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Did PH record Impairment?</label>
                                                            <SmartSelect 
                                                                id="impairmentStatus" 
                                                                value={inputValues[activeCompany].impairmentStatus} 
                                                                onChange={handleInputChange} 
                                                                expectedValue={EXPECTATIONS[activeCompany].impairmentStatus} 
                                                                options={["Yes, significant charges.", "No, no charges recorded."]} 
                                                                placeholder="Select insight..." 
                                                                isInstructor={isInstructor} 
                                                            />
                                                        </div>
                                                    </div>

                                                    <div className="p-5 bg-blue-50/80 rounded-xl border border-blue-100 shadow-sm">
                                                        <label className="block text-[11px] font-black text-blue-800 mb-2 uppercase tracking-widest flex items-center gap-2"><i data-lucide="bar-chart-2" className="w-4 h-4"></i> Analysis Insight</label>
                                                        <p className="text-sm text-blue-900/80 mb-3 font-semibold">Observe the sharp jump in Goodwill % in 2020 (39.6%) vs 2019 (30.8%). What does this suggest?</p>
                                                        <SmartSelect 
                                                            id="phInsight" 
                                                            value={inputValues[activeCompany].phInsight} 
                                                            onChange={handleInputChange} 
                                                            expectedValue={EXPECTATIONS[activeCompany].phInsight} 
                                                            options={[
                                                                "Significant acquisitions occurred (Inorganic Growth)", 
                                                                "Organic growth of internal assets", 
                                                                "Accounting error in 2019"
                                                            ]} 
                                                            placeholder="Select your analysis..." 
                                                            isInstructor={isInstructor} 
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
