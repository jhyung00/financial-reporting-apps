<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Tycoon: Berkshire vs Apple</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Gamified Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #1e1b4b; /* Deep Indigo Game Background */
            color: #e2e8f0;
            font-family: 'Nunito', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #312e81 0%, #1e1b4b 70%);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .game-font {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Custom Game Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #1e1b4b; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 8px; border: 2px solid #1e1b4b; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* Chunky Game Buttons */
        .btn-game {
            position: relative;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.3);
            transform: translateY(0);
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.3);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .float-anim { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .sticky-toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        /* Table Styles - Gamified */
        .fin-table { border-collapse: separate; border-spacing: 0; }
        .fin-table th {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-family: 'Fredoka', sans-serif;
        }
        .fin-table td { vertical-align: middle; }
        
        .xp-bar-container {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS COMPONENT ---
        const Icon = ({ name, size = 18, className = "", label }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);

            return (
                <span className={`inline-flex items-center justify-center gap-1.5 ${className}`}>
                    <i data-lucide={name} width={size} height={size} strokeWidth="2.5"></i>
                    {label && <span className="font-semibold">{label}</span>}
                </span>
            );
        };

        // --- DATA CONFIGURATION (Real World Narrative) ---
        const SCENARIO_A_DATA = [
            { 
                id: 'a1', 
                text: "Mission 1: Buy 5,000 Apple shares ($30/share)", 
                correct: { cash: -150000, noncash: 150000, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 } 
            },
            { 
                id: 'a2', 
                text: "Mission 2: Apple reports Net Income ($88,000)", 
                correct: { cash: 0, noncash: 0, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 } 
            },
            { 
                id: 'a3', 
                text: "Mission 3: Receive Apple dividend ($1.10/share)", 
                correct: { cash: 5500, noncash: 0, liab: 0, cc: 0, ec: 5500, rev: 5500, exp: 0, ni: 5500 } 
            },
            { 
                id: 'a4', 
                text: "Mission 4: Apple share price surges to $38/share", 
                correct: { cash: 0, noncash: 40000, liab: 0, cc: 0, ec: 40000, rev: 40000, exp: 0, ni: 40000 } 
            }
        ];

        const SCENARIO_B_DATA = [
            { 
                id: 'b1', 
                text: "Mission 1: Buy 5,000 Apple shares ($30/share)", 
                correct: { cash: -150000, noncash: 150000, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 } 
            },
            { 
                id: 'b2', 
                text: "Mission 2: Record 30% share of Apple's $88k NI", 
                correct: { cash: 0, noncash: 26400, liab: 0, cc: 0, ec: 26400, rev: 26400, exp: 0, ni: 26400 } 
            },
            { 
                id: 'b3', 
                text: "Mission 3: Receive Apple dividend ($1.10/share)", 
                correct: { cash: 5500, noncash: -5500, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 } 
            },
            { 
                id: 'b4', 
                text: "Mission 4: Apple share price surges to $38/share", 
                correct: { cash: 0, noncash: 0, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 } 
            }
        ];

        const QUIZ_DATA = [
            {
                id: 'q1',
                question: "How does Berkshire handle the Apple dividends received under the Equity Method compared to the Passive Investment method?",
                options: [
                    "Both methods record dividends as Investment Income.",
                    "Equity Method reduces the Investment account; Passive records it as Revenue.",
                    "Equity Method records them as Revenue; Passive reduces the Investment account.",
                    "Both methods ignore dividends."
                ],
                correctIndex: 1
            },
            {
                id: 'q2',
                question: "How does Apple's impressive Net Income affect Berkshire's books?",
                options: [
                    "Passive: Increases Investment Asset | Equity: No Entry",
                    "Passive: Records Revenue | Equity: Records Dividend Income",
                    "Passive: No Entry | Equity: Increases Investment Asset & Records Revenue",
                    "Both methods record a share of Net Income as Revenue."
                ],
                correctIndex: 2
            },
            {
                id: 'q3',
                question: "At year-end, Apple's stock price jumped. How should Berkshire record this?",
                options: [
                    "Passive: Recognize Unrealized Gain in Net Income | Equity: No Entry.",
                    "Passive: No Entry | Equity: Increase Investment account to Fair Value.",
                    "Both methods recognize the gain in Net Income.",
                    "Both methods adjust the Investment account to market value but record it in OCI."
                ],
                correctIndex: 0
            },
            {
                id: 'q4',
                question: "Assuming Apple continues to be profitable and retains most of its earnings, which method gives Berkshire a higher Investment Asset balance over time?",
                options: [
                    "Passive Investment Method",
                    "Equity Method",
                    "They result in the exact same balance.",
                    "Impossible to determine."
                ],
                correctIndex: 1
            }
        ];

        // --- COMPONENT: SMART INPUT (GAMIFIED) ---
        const SmartInput = ({ value, onChange, correctValue, instructorMode, placeholder = "0" }) => {
            const [localVal, setLocalVal] = useState(value || "");
            const [isValid, setIsValid] = useState(null);
            const [justCorrect, setJustCorrect] = useState(false);

            useEffect(() => {
                setLocalVal(value === 0 || value ? value : "");
                if (value === "" || value === undefined) {
                    setIsValid(null);
                } else {
                    validate(value);
                }
            }, [value]);

            const validate = (val) => {
                if (val === "" || val === null || val === undefined) {
                    setIsValid(null);
                    return;
                }
                const numVal = parseFloat(val);
                if (isNaN(numVal)) {
                    setIsValid(false);
                    return;
                }
                const target = parseFloat(correctValue);
                if (isNaN(target)) return;

                let valid = false;
                if (Math.abs(numVal - target) < 0.01) valid = true;
                else if (target !== 0 && Math.abs((numVal - target) / target) <= 0.02) valid = true; 
                
                if (valid && isValid !== true) {
                    // Trigger combo/pop animation
                    setJustCorrect(true);
                    setTimeout(() => setJustCorrect(false), 600);
                }
                setIsValid(valid);
            };

            const handleBlur = () => {
                let processedVal = localVal;
                if (typeof localVal === 'string') {
                    const cleanStr = localVal.replace(/,/g, '');
                    if (cleanStr.match(/[+\-*\/]/)) {
                        try {
                            const result = Function('"use strict";return (' + cleanStr.replace(/[^0-9+\-*\/.\(\)]/g, '') + ')')();
                            if (isFinite(result)) {
                                processedVal = parseFloat(result.toFixed(2));
                                onChange(processedVal); 
                            }
                        } catch (e) {}
                    }
                }
                validate(processedVal);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') e.target.blur();
            };

            // Gamified styling based on state
            let baseClass = "w-full px-3 py-2 text-right text-sm font-bold rounded-lg border-2 outline-none transition-all focus:scale-105 shadow-sm";
            let stateClass = "border-indigo-500/50 bg-indigo-900/40 text-white focus:border-indigo-400 focus:bg-indigo-800/80 focus:shadow-[0_0_15px_rgba(99,102,241,0.5)]";
            
            if (isValid === true) {
                stateClass = "border-emerald-500 bg-emerald-900/40 text-emerald-300 shadow-[0_0_10px_rgba(16,185,129,0.3)]";
            } else if (isValid === false) {
                stateClass = "border-rose-500 bg-rose-900/40 text-rose-300";
            }

            return (
                <div className="relative w-full group">
                    <input
                        type="text"
                        className={`${baseClass} ${stateClass} ${justCorrect ? 'pop-in' : ''}`}
                        value={localVal}
                        onChange={(e) => { setLocalVal(e.target.value); onChange(e.target.value); }}
                        onBlur={handleBlur}
                        onKeyDown={handleKeyDown}
                        placeholder={placeholder}
                    />
                    {isValid === true && (
                        <div className={`absolute -right-2 -top-2 text-emerald-400 bg-emerald-900 rounded-full p-0.5 border border-emerald-500 shadow-lg pointer-events-none ${justCorrect ? 'pop-in' : ''}`}>
                            <Icon name="star" size={14} className="fill-emerald-400" />
                        </div>
                    )}
                    {instructorMode && (
                        <div className="absolute z-10 -bottom-6 left-1/2 -translate-x-1/2 w-max text-[11px] font-black tracking-wider text-center bg-fuchsia-600 text-white border-2 border-fuchsia-300 rounded-md py-0.5 px-2 fade-in shadow-xl opacity-0 group-hover:opacity-100 transition-opacity">
                            KEY: {correctValue}
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APPLICATION ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('A'); // A, B, or Quiz
            
            // State initialization
            const [transA, setTransA] = useState(SCENARIO_A_DATA.map(t => ({
                ...t, userValues: { cash: '', noncash: '', liab: '', cc: '', ec: '', rev: '', exp: '' }
            })));

            const [transB, setTransB] = useState(SCENARIO_B_DATA.map(t => ({
                ...t, userValues: { cash: '', noncash: '', liab: '', cc: '', ec: '', rev: '', exp: '' }
            })));

            const [quizAnswers, setQuizAnswers] = useState({});

            // Instructor States
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [isInstructor, setIsInstructor] = useState(false);
            const [teacherPass, setTeacherPass] = useState('');
            const [authError, setAuthError] = useState('');
            const [confirmation, setConfirmation] = useState({ isOpen: false, message: '', onConfirm: null });
            const [showDownloadModal, setShowDownloadModal] = useState(false);
            const [studentName, setStudentName] = useState('');

            // --- COMPUTED TOTALS & GAMIFICATION METRICS ---
            const calculateTotals = (transactions) => {
                const sums = { cash: 0, noncash: 0, liab: 0, cc: 0, ec: 0, rev: 0, exp: 0, ni: 0 };
                let correctFields = 0;
                let totalFields = 0;

                transactions.forEach(t => {
                    const rRev = parseFloat(t.userValues.rev) || 0;
                    const rExp = parseFloat(t.userValues.exp) || 0;
                    const rNI = rRev - rExp;
                    
                    sums.cash += parseFloat(t.userValues.cash) || 0;
                    sums.noncash += parseFloat(t.userValues.noncash) || 0;
                    sums.liab += parseFloat(t.userValues.liab) || 0;
                    sums.cc += parseFloat(t.userValues.cc) || 0;
                    sums.ec += (parseFloat(t.userValues.ec) || 0) + rNI; 
                    sums.rev += rRev;
                    sums.exp += rExp;
                    sums.ni += rNI;

                    // Calculate correct fields for XP
                    const keys = ['cash', 'noncash', 'liab', 'cc', 'ec', 'rev', 'exp'];
                    keys.forEach(k => {
                        totalFields++;
                        const uv = parseFloat(t.userValues[k]);
                        const cv = parseFloat(t.correct[k]);
                        if (!isNaN(uv) && Math.abs(uv - cv) < 0.1) correctFields++;
                    });
                });
                return { sums, correctFields, totalFields };
            };

            const statsA = useMemo(() => calculateTotals(transA), [transA]);
            const statsB = useMemo(() => calculateTotals(transB), [transB]);

            const isBalancedA = Math.abs((statsA.sums.cash + statsA.sums.noncash) - (statsA.sums.liab + statsA.sums.cc + statsA.sums.ec)) < 0.1;
            const isBalancedB = Math.abs((statsB.sums.cash + statsB.sums.noncash) - (statsB.sums.liab + statsB.sums.cc + statsB.sums.ec)) < 0.1;

            const quizScore = useMemo(() => {
                let score = 0;
                QUIZ_DATA.forEach(q => { if (quizAnswers[q.id] === q.correctIndex) score++; });
                return score;
            }, [quizAnswers]);

            // Calculate Player XP & Level
            const totalCorrectInputs = statsA.correctFields + statsB.correctFields;
            const totalPossibleInputs = statsA.totalFields + statsB.totalFields;
            const xp = (totalCorrectInputs * 50) + (quizScore * 250);
            const maxXp = (totalPossibleInputs * 50) + (QUIZ_DATA.length * 250);
            const xpPercent = Math.min(100, Math.round((xp / maxXp) * 100)) || 0;
            
            const level = Math.floor(xp / 500) + 1;

            // --- HANDLERS ---
            const handleTransChange = (scenario, id, field, val) => {
                const setFunc = scenario === 'A' ? setTransA : setTransB;
                setFunc(prev => prev.map(t => t.id === id ? {
                    ...t, userValues: { ...t.userValues, [field]: val }
                } : t));
            };

            const handleQuizSelect = (qId, optionIndex) => {
                setQuizAnswers(prev => ({...prev, [qId]: optionIndex}));
            };

            // --- INSTRUCTOR FUNCTIONS ---
            const attemptLogin = () => {
                if (teacherPass.toLowerCase() === 'teacher') {
                    setIsInstructor(true);
                    setShowAuthModal(false);
                    setAuthError('');
                    setTeacherPass('');
                } else {
                    setAuthError('Access Denied');
                }
            };

            const autoFill = () => {
                const fillValues = (item) => ({ ...item, userValues: { ...item.correct } });
                if (activeTab === 'A') setTransA(prev => prev.map(fillValues));
                else if (activeTab === 'B') setTransB(prev => prev.map(fillValues));
                else {
                    const autoQuiz = {};
                    QUIZ_DATA.forEach(q => autoQuiz[q.id] = q.correctIndex);
                    setQuizAnswers(autoQuiz);
                }
            };

            const clearAll = () => {
                setConfirmation({
                    isOpen: true,
                    message: "Wipe all player progress and exit God Mode?",
                    onConfirm: () => {
                        const clearValues = (item) => ({ ...item, userValues: { cash: '', noncash: '', liab: '', cc: '', ec: '', rev: '', exp: '' } });
                        setTransA(prev => prev.map(clearValues));
                        setTransB(prev => prev.map(clearValues));
                        setQuizAnswers({});
                        setIsInstructor(false);
                        setConfirmation({ isOpen: false, message: '', onConfirm: null });
                    }
                });
            };

            // --- GAMIFIED RENDER HELPERS ---
            const renderTable = (data, scenarioId, totalsData, isBalanced) => {
                const { sums, correctFields, totalFields } = totalsData;
                const isPerfect = correctFields === totalFields;

                return (
                    <div className="bg-indigo-950/80 rounded-2xl border-4 border-indigo-800 shadow-2xl overflow-hidden animate-fade-in relative">
                        
                        {/* Perfect Badge Overlay */}
                        {isPerfect && (
                            <div className="absolute top-4 right-4 z-20 bg-gradient-to-r from-yellow-400 to-yellow-600 text-yellow-950 px-4 py-1 rounded-full font-black game-font text-sm shadow-[0_0_20px_rgba(250,204,21,0.6)] flex items-center gap-2 pop-in transform rotate-3">
                                <Icon name="trophy" size={16} /> PERFECT CLEAR!
                            </div>
                        )}

                        <div className="overflow-x-auto">
                            <table className="w-full text-left fin-table min-w-[1100px]">
                                <thead>
                                    {/* Super Header */}
                                    <tr className="bg-indigo-900 border-b-2 border-indigo-800">
                                        <th className="p-4 w-72 border-r-2 border-indigo-800 sticky left-0 z-10 bg-indigo-900 text-indigo-200">
                                            Mission Objectives
                                        </th>
                                        <th className="text-center border-r-2 border-indigo-800 bg-cyan-900/30 text-cyan-300 py-3" colSpan="2">
                                            <Icon name="coins" className="mb-1" /> ASSETS
                                        </th>
                                        <th className="text-center w-8 text-indigo-400 font-black text-xl">=</th>
                                        <th className="text-center border-r-2 border-indigo-800 bg-rose-900/30 text-rose-300" colSpan="1">
                                            <Icon name="credit-card" className="mb-1" /> LIABILITIES
                                        </th>
                                        <th className="text-center w-8 text-indigo-400 font-black text-xl">+</th>
                                        <th className="text-center border-r-2 border-indigo-800 bg-purple-900/30 text-purple-300" colSpan="2">
                                            <Icon name="pie-chart" className="mb-1" /> EQUITY
                                        </th>
                                        <th className="w-2 bg-indigo-950"></th>
                                        <th className="text-center bg-amber-900/30 text-amber-300" colSpan="3">
                                            <Icon name="trending-up" className="mb-1" /> INCOME STATEMENT
                                        </th>
                                    </tr>
                                    {/* Sub Header */}
                                    <tr className="bg-indigo-800/50 text-xs text-indigo-300 border-b-2 border-indigo-800">
                                        <th className="p-3 border-r-2 border-indigo-800 sticky left-0 z-10 bg-indigo-800 text-center">Description</th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-32 text-center text-cyan-200">Cash</th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-32 text-center text-cyan-200">Non-Cash (Invest)</th>
                                        <th></th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-32 text-center text-rose-200">Liabilities</th>
                                        <th></th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-32 text-center text-purple-200">Contrib. Capital</th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-32 text-center text-purple-200">Earned Capital</th>
                                        <th className="w-2 bg-indigo-950"></th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-28 text-center text-amber-200">Revenue</th>
                                        <th className="p-3 border-r-2 border-indigo-800 w-28 text-center text-amber-200">Expense</th>
                                        <th className="p-3 w-28 text-center bg-amber-900/40 text-amber-100 rounded-tr-xl">Net Income</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((row, idx) => {
                                        // Calculate row progress
                                        let rowCorrect = 0;
                                        let rowTotal = 7;
                                        const keys = ['cash', 'noncash', 'liab', 'cc', 'ec', 'rev', 'exp'];
                                        keys.forEach(k => {
                                            const uv = parseFloat(row.userValues[k]);
                                            const cv = parseFloat(row.correct[k]);
                                            if (!isNaN(uv) && Math.abs(uv - cv) < 0.1) rowCorrect++;
                                        });
                                        const isRowDone = rowCorrect === rowTotal;

                                        return (
                                            <tr key={row.id} className="border-b-2 border-indigo-800/50 hover:bg-indigo-800/40 transition-colors group relative">
                                                <td className="p-4 border-r-2 border-indigo-800 bg-indigo-900 group-hover:bg-indigo-800 sticky left-0 z-10 transition-colors">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black shadow-inner border-2 ${isRowDone ? 'bg-emerald-500 border-emerald-300 text-white shadow-[0_0_10px_rgba(16,185,129,0.8)] pop-in' : 'bg-indigo-950 border-indigo-700 text-indigo-400'}`}>
                                                            {isRowDone ? <Icon name="check" size={18} /> : idx + 1}
                                                        </div>
                                                        <span className="font-bold text-indigo-100 text-[13px] leading-tight flex-1">
                                                            {row.text}
                                                        </span>
                                                    </div>
                                                </td>
                                                
                                                {/* Assets */}
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-cyan-950/10">
                                                    <SmartInput value={row.userValues.cash} onChange={v => handleTransChange(scenarioId, row.id, 'cash', v)} correctValue={row.correct.cash} instructorMode={isInstructor} />
                                                </td>
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-cyan-950/10">
                                                    <SmartInput value={row.userValues.noncash} onChange={v => handleTransChange(scenarioId, row.id, 'noncash', v)} correctValue={row.correct.noncash} instructorMode={isInstructor} />
                                                </td>

                                                <td className="text-center text-indigo-600 font-black text-xl">=</td>

                                                {/* Liab */}
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-rose-950/10">
                                                    <SmartInput value={row.userValues.liab} onChange={v => handleTransChange(scenarioId, row.id, 'liab', v)} correctValue={row.correct.liab} instructorMode={isInstructor} />
                                                </td>

                                                <td className="text-center text-indigo-600 font-black text-xl">+</td>

                                                {/* Equity */}
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-purple-950/10">
                                                    <SmartInput value={row.userValues.cc} onChange={v => handleTransChange(scenarioId, row.id, 'cc', v)} correctValue={row.correct.cc} instructorMode={isInstructor} />
                                                </td>
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-purple-950/10">
                                                    <SmartInput value={row.userValues.ec} onChange={v => handleTransChange(scenarioId, row.id, 'ec', v)} correctValue={row.correct.ec} instructorMode={isInstructor} />
                                                </td>

                                                <td className="w-2 bg-indigo-950"></td>

                                                {/* Income Statement */}
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-amber-950/10">
                                                    <SmartInput value={row.userValues.rev} onChange={v => handleTransChange(scenarioId, row.id, 'rev', v)} correctValue={row.correct.rev} instructorMode={isInstructor} />
                                                </td>
                                                <td className="p-2 border-r-2 border-indigo-800/50 bg-amber-950/10">
                                                    <SmartInput value={row.userValues.exp} onChange={v => handleTransChange(scenarioId, row.id, 'exp', v)} correctValue={row.correct.exp} instructorMode={isInstructor} />
                                                </td>
                                                
                                                {/* Calculated NI */}

                        <div className="fixed inset-0 bg-indigo-950/90 flex items-center justify-center z-[100] backdrop-blur-sm fade-in p-4">
                            <div className="bg-indigo-900 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-rose-500 pop-in">
                                <div className="w-20 h-20 bg-rose-900 border-4 border-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(244,63,94,0.6)] text-rose-300">
                                    <Icon name="bomb" size={40} />
                                </div>
                                <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">Warning</h3>
                                <p className="text-indigo-200 mb-8 text-center font-bold">{confirmation.message}</p>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setConfirmation({ isOpen: false, message: '', onConfirm: null })} className="btn-game px-6 py-3 bg-indigo-800 text-indigo-300 hover:text-white rounded-xl font-black border-2 border-indigo-600">Cancel</button>
                                    <button onClick={confirmation.onConfirm} className="btn-game px-6 py-3 bg-gradient-to-b from-rose-500 to-red-700 border-2 border-red-300 text-white rounded-xl font-black shadow-lg">Nuke It</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Download Modal */}
                    {showDownloadModal && (
                        <div className="fixed inset-0 bg-indigo-950/90 flex items-center justify-center z-[100] backdrop-blur-sm fade-in p-4">
                            <div className="bg-indigo-900 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-emerald-500 pop-in">
                                <div className="w-20 h-20 bg-emerald-900 border-4 border-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(16,185,129,0.6)] text-emerald-300">
                                    <Icon name="award" size={40} />
                                </div>
                                <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">Save Progress</h3>
                                <p className="text-indigo-300 text-center text-sm font-bold mb-6">Enter your Tycoon Name to save your high score.</p>
                                
                                <div className="mb-6">
                                    <input 
                                        type="text" 
                                        value={studentName}
                                        onChange={(e) => setStudentName(e.target.value)}
                                        className="w-full bg-indigo-950 border-4 border-indigo-700 p-4 rounded-xl text-white outline-none focus:border-cyan-500 font-black text-center text-xl shadow-inner placeholder-indigo-700"
                                        placeholder="Player One"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setShowDownloadModal(false)} className="btn-game px-6 py-3 bg-indigo-800 text-indigo-300 hover:text-white rounded-xl font-black border-2 border-indigo-600">Cancel</button>
                                    <button onClick={() => {
                                        // Simple alert for demo instead of full file generation to keep code clean
                                        alert(`Report Submitted, ${studentName || 'Tycoon'}! Points: ${xp}`);
                                        setShowDownloadModal(false);
                                    }} className="btn-game px-6 py-3 bg-gradient-to-b from-emerald-400 to-emerald-600 border-2 border-emerald-300 text-white rounded-xl font-black shadow-lg">Save Data</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Auth Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-indigo-950/90 flex items-center justify-center z-[100] backdrop-blur-sm fade-in p-4">
                            <div className="bg-indigo-900 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-fuchsia-500 pop-in relative">
                                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-indigo-800 rounded-full text-indigo-400 hover:text-white hover:bg-rose-500 transition-colors">&times;</button>
                                
                                <div className="w-20 h-20 bg-fuchsia-900 border-4 border-fuchsia-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(217,70,239,0.6)] text-fuchsia-300">
                                    <Icon name="key" size={40} />
                                </div>
                                <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">God Mode</h3>
                                <p className="text-indigo-300 text-center text-sm font-bold mb-6">Enter admin password to enable cheat codes.</p>
                                
                                <input 
                                    type="password" 
                                    className="w-full bg-indigo-950 border-4 border-indigo-700 p-4 rounded-xl text-white outline-none focus:border-fuchsia-500 font-black text-center text-xl shadow-inner mb-4 tracking-widest placeholder-indigo-700"
                                    placeholder="••••••"
                                    value={teacherPass}
                                    onChange={e => setTeacherPass(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && attemptLogin()}
                                    autoFocus
                                />
                                {authError && <div className="text-rose-400 font-bold text-sm mb-4 text-center bg-rose-950/50 p-2 rounded-lg border border-rose-800 flex items-center justify-center gap-2 pop-in"><Icon name="alert-triangle" size={16} />{authError}</div>}
                                
                                <button 
                                    onClick={attemptLogin}
                                    className="btn-game w-full bg-gradient-to-b from-fuchsia-500 to-purple-700 border-2 border-fuchsia-300 text-white py-4 rounded-xl font-black shadow-lg uppercase tracking-wider text-lg mt-2"
                                >
                                    Unlock Cheats
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
