<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body { 
            background-color: #0a0a0a; 
            color: #f3f4f6; 
            font-family: 'Inter', system-ui, sans-serif; 
            overflow-x: hidden; 
        }

        /* 3B1B Style Glows */
        .glow-ts { text-shadow: 0 0 12px rgba(59, 130, 246, 0.8); }
        .glow-afs { text-shadow: 0 0 12px rgba(234, 179, 8, 0.8); }
        .glow-htm { text-shadow: 0 0 12px rgba(239, 68, 68, 0.8); }
        .glow-white { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* Smooth Slide Transitions */
        .slide-enter {
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* SVG Graph drawing animations */
        .path-draw {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawLine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        
        .fade-in-delayed {
            opacity: 0;
            animation: fadeInNormal 1s ease-in forwards;
            animation-delay: 1.5s;
        }
        @keyframes fadeInNormal {
            to { opacity: 1; }
        }

        /* Math Typography */
        .math-font { 
            font-family: 'Cambria Math', 'Times New Roman', serif; 
            font-style: italic; 
            letter-spacing: 0.5px;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500/30">

    <div id="app" class="flex-grow flex flex-col h-screen">
        <!-- Header -->
        <header class="p-6 border-b border-gray-800 flex justify-between items-center bg-[#0a0a0a] z-10">

                <i data-lucide="bar-chart-2" class="text-blue-500"></i>

            <div class="flex space-x-3" id="progress-dots">

            </div>

        <!-- Main Content Area -->

            <div id="slide-container" class="w-full max-w-5xl relative">

            </div>

        <!-- Footer Controls -->
        <footer class="p-6 flex justify-between items-center border-t border-gray-800 bg-[#0a0a0a] z-10">
            <button id="btn-prev" class="px-6 py-2 rounded-lg border border-gray-700 hover:bg-gray-800 hover:text-white transition-all disabled:opacity-30 flex items-center gap-2 text-gray-400">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Previous

    <script>
        // SLIDE DATA
        const slides = [
            // Slide 1: Introduction
            `
            <div class="flex flex-col items-center justify-center space-y-10 slide-enter">

                <p class="text-xl text-gray-400 max-w-2xl text-center leading-relaxed">

                <div class="w-full max-w-3xl">
                    <svg viewBox="0 0 800 300" class="w-full h-auto drop-shadow-2xl">
                        <!-- Axes -->
                        <line x1="50" y1="250" x2="750" y2="250" stroke="#374151" stroke-width="2" />
                        <line x1="50" y1="50" x2="50" y2="250" stroke="#374151" stroke-width="2" />

                        <line x1="50" y1="100" x2="700" y2="100" stroke="#f3f4f6" stroke-width="2" stroke-dasharray="6,6" class="path-draw" />

                        <circle cx="700" cy="220" r="6" fill="#3b82f6" class="fade-in-delayed shadow-lg" />

                    <p class="text-2xl font-semibold">Do you report a <span class="text-red-500 math-font glow-htm">-$200</span> loss?</p>
                    <p class="text-gray-500 italic">In financial reporting, the answer is: "It depends on your intent."</p>
                </div>
            </div>
            `,
            
            // Slide 2: The Three Categories
            `

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                    <div class="bg-[#111] border border-gray-800 rounded-2xl p-8 flex flex-col items-center text-center hover:border-blue-500/50 hover:shadow-[0_0_30px_rgba(59,130,246,0.1)] transition duration-500 group">
                        <div class="w-16 h-16 rounded-full bg-blue-900/20 border border-blue-500/30 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                            <i data-lucide="zap" class="text-blue-500 w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-bold text-blue-400 mb-3 glow-ts">Trading Securities</h3>
                        <p class="text-sm text-gray-400 mb-8 leading-relaxed">Bought to sell in the near term for a quick profit. Highly liquid.</p>
                        <div class="mt-auto w-full">
                            <div class="px-4 py-3 bg-gray-900/80 rounded-xl border border-gray-800">
                                <span class="text-[10px] text-gray-500 uppercase tracking-widest block mb-1">Measurement</span>
                                <p class="font-mono text-sm text-gray-200">Fair Value (FVNI)</p>
                            </div>
                        </div>
                    </div>
                    <!-- AFS -->
                    <div class="bg-[#111] border border-gray-800 rounded-2xl p-8 flex flex-col items-center text-center hover:border-yellow-500/50 hover:shadow-[0_0_30px_rgba(234,179,8,0.1)] transition duration-500 group">
                        <div class="w-16 h-16 rounded-full bg-yellow-900/20 border border-yellow-500/30 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                            <i data-lucide="scale" class="text-yellow-500 w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-bold text-yellow-400 mb-3 glow-afs">Available-for-Sale</h3>
                        <p class="text-sm text-gray-400 mb-8 leading-relaxed">The middle ground. Holding for yield, but might sell for liquidity needs.</p>
                        <div class="mt-auto w-full">
                            <div class="px-4 py-3 bg-gray-900/80 rounded-xl border border-gray-800">
                                <span class="text-[10px] text-gray-500 uppercase tracking-widest block mb-1">Measurement</span>
                                <p class="font-mono text-sm text-gray-200">Fair Value (FVOCI)</p>
                            </div>

                    </div>
                    <!-- HTM -->
                    <div class="bg-[#111] border border-gray-800 rounded-2xl p-8 flex flex-col items-center text-center hover:border-red-500/50 hover:shadow-[0_0_30px_rgba(239,68,68,0.1)] transition duration-500 group">

                            <div class="px-4 py-3 bg-gray-900/80 rounded-xl border border-gray-800">
                                <span class="text-[10px] text-gray-500 uppercase tracking-widest block mb-1">Measurement</span>
                                <p class="font-mono text-sm text-gray-200">Amortized Cost</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `,

            // Slide 3: Volatility Flow
            `
            <div class="slide-enter">

                            </div>

                        <div class="w-full md:w-1/3 bg-gray-900/80 p-4 rounded-lg border border-gray-700/50 text-center shadow-[0_0_20px_rgba(59,130,246,0.1)] group-hover:border-blue-500/50 transition-colors">
                            <span class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1">Income Statement</span>

                    <div class="flex flex-col md:flex-row items-center gap-6 p-6 border border-gray-800 rounded-xl bg-gradient-to-r from-gray-900/50 to-transparent relative overflow-hidden group">
                         <div class="absolute left-0 top-0 bottom-0 w-1 bg-yellow-500 shadow-[0_0_10px_#eab308]"></div>
                         <div class="w-full md:w-1/3">
                            <h3 class="text-xl text-yellow-400 font-bold mb-1 flex items-center gap-2 glow-afs"><i data-lucide="scale" class="w-5 h-5"></i> AFS</h3>
                            <p class="text-xs text-gray-400">Keeps Net Income clean. Parks in Equity until sold.</p>
                        </div>
                        <div class="w-full md:flex-grow flex items-center justify-center py-4 md:py-0">
                            <div class="h-0.5 bg-gray-800 w-full relative">
                                <div class="absolute inset-0 bg-yellow-500 animate-pulse shadow-[0_0_8px_#eab308]" style="width: 100%"></div>
                                <i data-lucide="chevron-right" class="absolute -right-2 -top-2.5 text-yellow-500"></i>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 bg-gray-900/80 p-4 rounded-lg border border-gray-700/50 text-center shadow-[0_0_20px_rgba(234,179,8,0.1)] group-hover:border-yellow-500/50 transition-colors">
                            <span class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1">Balance Sheet / Equity</span>
                            <span class="text-base font-semibold text-white">Other Comprehensive Income</span>
                        </div>
                    </div>

                    <!-- HTM Flow -->
                    <div class="flex flex-col md:flex-row items-center gap-6 p-6 border border-gray-800 rounded-xl bg-gradient-to-r from-gray-900/50 to-transparent relative overflow-hidden opacity-70 group hover:opacity-100 transition-opacity">
                         <div class="absolute left-0 top-0 bottom-0 w-1 bg-red-500 shadow-[0_0_10px_#ef4444]"></div>
                         <div class="w-full md:w-1/3">
                            <h3 class="text-xl text-red-400 font-bold mb-1 flex items-center gap-2 glow-htm"><i data-lucide="lock" class="w-5 h-5"></i> HTM</h3>
                            <p class="text-xs text-gray-400">Market volatility is ignored on the primary statements.</p>
                        </div>
                        <div class="w-full md:flex-grow flex items-center justify-center py-4 md:py-0">
                            <div class="w-full border-t border-dashed border-gray-700 flex justify-center">
                                <i data-lucide="x" class="text-gray-600 bg-[#0a0a0a] px-2 -mt-3"></i>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 bg-gray-900/30 p-4 rounded-lg border border-gray-800 text-center">
                            <span class="block text-[10px] text-gray-500 uppercase tracking-widest mb-1">Disclosure Only</span>
                            <span class="text-base font-semibold text-gray-400">Footnotes</span>
                        </div>
                    </div>

                </div>
            </div>
            `,

            // Slide 4: Case Study - SVB Expanded
            `
            <div class="slide-enter flex flex-col md:flex-row gap-12 items-start">
                <div class="w-full md:w-1/2 space-y-5">
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-950/40 text-red-400 text-xs font-bold tracking-widest border border-red-900/50 uppercase">
                        <i data-lucide="building" class="w-4 h-4"></i> Case Study: SVB
                    </div>
                    <h2 class="text-4xl font-light leading-tight">The Anatomy of a <br><span class="text-red-400 font-semibold">Bank Run</span></h2>
                    
                    <div class="space-y-4 mt-6">
                        <div class="flex gap-4 items-start">
                            <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center flex-shrink-0 text-gray-400 font-mono text-sm">1</div>
                            <div>
                                <h4 class="text-white font-semibold">The Influx & The Bet</h4>
                                <p class="text-gray-400 text-sm leading-relaxed mt-1">During the 2020-2021 tech boom, SVB's deposits doubled. Seeking yield in a zero-rate environment, they locked <strong class="text-white">$91 Billion</strong> into long-term Treasury and Mortgage-Backed bonds, classifying them as Held-To-Maturity (HTM).</p>
                            </div>
                        </div>
                        <div class="flex gap-4 items-start">
                            <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center flex-shrink-0 text-gray-400 font-mono text-sm">2</div>
                            <div>
                                <h4 class="text-white font-semibold">The Rate Shock</h4>
                                <p class="text-gray-400 text-sm leading-relaxed mt-1">As the Federal Reserve aggressively hiked interest rates in 2022, the fair value of these bonds plummeted. By year-end, SVB was sitting on a <strong class="text-red-400 glow-htm">$15 Billion unrealized loss</strong>. Because of HTM rules, this loss was legally hidden from the primary income statement.</p>
                            </div>
                        </div>
                        <div class="flex gap-4 items-start">
                            <div class="w-8 h-8 rounded-full bg-red-900/30 border border-red-500/30 flex items-center justify-center flex-shrink-0 text-red-400 font-mono text-sm shadow-[0_0_10px_rgba(239,68,68,0.2)]">3</div>
                            <div>
                                <h4 class="text-red-400 font-semibold">The Fatal Unwinding</h4>
                                <p class="text-gray-400 text-sm leading-relaxed mt-1">In March 2023, panicked venture capitalists urged startups to pull funds. Depositors attempted to withdraw <strong class="text-white">$42 billion</strong> in a single day. To fund the exodus, SVB had to sell its bonds, instantly converting the "paper" HTM loss into a realized loss that wiped out their equity.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="w-full md:w-1/2 mt-10 md:mt-0 lg:pl-8">
                    <div class="relative w-full aspect-square max-w-md mx-auto bg-gray-900/30 rounded-2xl border border-gray-800 p-6 flex items-center shadow-2xl">
                        <svg viewBox="0 0 400 300" class="w-full h-full drop-shadow-2xl">
                            <!-- Background grid -->
                            <path d="M 0 50 L 400 50 M 0 150 L 400 150 M 0 250 L 400 250" stroke="#1f2937" stroke-width="1" stroke-dasharray="4,4"/>
                            
                            <!-- HTM Carrying Value (Flat) -->
                            <line x1="20" y1="50" x2="380" y2="50" stroke="#f3f4f6" stroke-width="2" />
                            <text x="25" y="40" fill="#f3f4f6" class="text-[10px] font-mono tracking-wider text-gray-300">REPORTED ASSET VALUE ($91B)</text>
                            
                            <!-- Fair Value Curve (Dropping) -->
                            <path d="M 20 50 C 150 50, 250 250, 380 250" stroke="#ef4444" stroke-width="3" fill="none" class="path-draw"/>
                            
                            <!-- Shaded difference (The hidden loss) -->
                            <path d="M 20 50 C 150 50, 250 250, 380 250 L 380 50 Z" fill="rgba(239, 68, 68, 0.15)" class="fade-in-delayed"/>
                            
                            <text x="170" y="160" fill="#ef4444" class="text-sm font-bold fade-in-delayed glow-htm">Hidden $15B Loss</text>
                            <text x="250" y="270" fill="#ef4444" class="text-[10px] font-mono fade-in-delayed">TRUE FAIR VALUE ($76B)</text>
                        </svg>
                    </div>
                </div>
            </div>
            `,
            
            // Slide 5: Case Study - FT Article & Debate
            `
            <div class="slide-enter flex flex-col md:flex-row gap-12 items-center">
                <div class="w-full md:w-1/2 space-y-5">
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-yellow-950/40 text-yellow-400 text-xs font-bold tracking-widest border border-yellow-900/50 uppercase">
                        <i data-lucide="scale" class="w-4 h-4"></i> The Great Accounting Debate
                    </div>
                    <h2 class="text-4xl font-light leading-tight">Mark-to-Market vs.<br><span class="text-gray-500 text-2xl">Maturity Transformation</span></h2>
                    <p class="text-gray-300 text-[15px] leading-relaxed">The SVB collapse sparked a fierce debate: Does the distinction between HTM and AFS make any sense? After all, an institution's "intent" to hold a bond changes rapidly when depositors demand their cash.</p>
                    
                    <div class="bg-gradient-to-r from-gray-900 to-transparent p-5 border-l-2 border-yellow-500 rounded-r-lg">
                        <p class="text-sm text-gray-400 leading-relaxed mb-2"><strong class="text-white">Flattering the Accounts:</strong> HTM classification gives institutions the chance to hide volatility. In 2022 alone, six major financial institutions moved a staggering <strong class="text-yellow-400 glow-afs">$500 Billion</strong> from AFS to HTM as interest rates began to rise.</p>
                    </div>

                    <p class="text-gray-300 text-[15px] leading-relaxed"><strong>Why not mark everything to market?</strong> While seductive, this ignores the core banking business model: taking short-term deposits to fund long-term loans. If long-duration assets swung wildly on balance sheets, banks would be forced to either raise massive capital or stop long-term lending entirely.</p>
                    
                    <a href="https://www.ft.com/content/28217a36-9f0e-490a-a008-6c2b41e98f21" target="_blank" class="inline-flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300 mt-2 transition-colors">
                        <i data-lucide="external-link" class="w-4 h-4"></i> Read: Financial services: bank runs stoke accounting debate (FT)
                    </a>

                            <h3 class="text-lg font-semibold text-white">The Regulatory Balancing Act</h3>
                            <i data-lucide="scale" class="text-yellow-500 w-6 h-6"></i>
                        </div>
                        <div class="space-y-6">
                            <div class="flex items-start gap-4 p-4 bg-gray-900/50 rounded-xl border border-gray-800">
                                <div class="w-10 h-10 rounded-full bg-red-900/20 flex items-center justify-center flex-shrink-0">
                                    <i data-lucide="trending-down" class="text-red-400 w-5 h-5"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-200">100% Mark-to-Market</h4>
                                    <p class="text-xs text-gray-400 mt-1">Extreme volatility in reported capital. Forces banks to abandon long-term lending, choking economic growth and traditional maturity transformation.</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4 p-4 bg-gray-900/50 rounded-xl border border-blue-900/50 relative overflow-hidden shadow-[0_0_15px_rgba(59,130,246,0.1)]">
                                <div class="absolute inset-0 bg-blue-500/5"></div>
                                <div class="w-10 h-10 rounded-full bg-blue-900/20 flex items-center justify-center flex-shrink-0 relative z-10">
                                    <i data-lucide="check-circle" class="text-blue-400 w-5 h-5"></i>
                                </div>
                                <div class="relative z-10">
                                    <h4 class="text-sm font-bold text-blue-400">Targeted HTM</h4>
                                    <p class="text-xs text-gray-300 mt-1">HTM makes sense, but regulators must ensure it is restricted to small, stable portfolios with low liquidity risk to prevent future banking panics.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `,

            // Slide 6: Interactive Lab
            `
            <div class="slide-enter space-y-10 w-full max-w-5xl mx-auto">
                <div class="text-center">
                    <h2 class="text-3xl md:text-4xl font-light mb-3">Interactive Lab: The Rate Shock</h2>

                </div>

                <!-- Controls -->

        let currentSlide = 0;

        function renderSlide() {
            const container = document.getElementById('slide-container');
            container.innerHTML = slides[currentSlide];
            lucide.createIcons();
            updateControls();
            
            // The Interactive Lab is now on index 5 (Slide 6)
            if (currentSlide === 5) {
                initLab();
            }
        }

        function updateControls() {
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            document.getElementById('btn-prev').disabled = currentSlide === 0;
            document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;
            
            const dots = document.getElementById('progress-dots');
            dots.innerHTML = '';
            for(let i=0; i<slides.length; i++) {
                const dot = document.createElement('div');
                dot.className = `h-1.5 rounded-full transition-all duration-500 ${i === currentSlide ? 'bg-blue-500 w-6 shadow-[0_0_8px_#3b82f6]' : 'bg-gray-800 w-1.5'}`;
                dots.appendChild(dot);
            }
        }

        document.getElementById('btn-prev').addEventListener('click', () => {
            if(currentSlide > 0) { currentSlide--; renderSlide(); }
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if(currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
        });

        // Initialize Interactive Lab Elements
        function initLab() {
            const slider = document.getElementById('rate-slider');
            const rateDisplay = document.getElementById('rate-display');
            
            const tsBs = document.getElementById('ts-bs');
            const tsNi = document.getElementById('ts-ni');
            const afsBs = document.getElementById('afs-bs');
            const afsOci = document.getElementById('afs-oci');
            const htmFn = document.getElementById('htm-fn');
            
            slider.addEventListener('input', (e) => {
                const rate = parseFloat(e.target.value);
                rateDisplay.textContent = rate.toFixed(1) + '%';
                
                // Simplified bond math: Base value 100,000 at 1%.
                // For this simulation: every 0.1% increase drops value by $1,000 (roughly a 10yr duration)
                const rateDiff = rate - 1.0; 
                const loss = rateDiff * 10 * 1000; 
                const fairValue = 100000 - loss;
                
                const fvFormatted = '$' + fairValue.toLocaleString();
                const lossFormatted = loss === 0 ? '$0' : '-$' + loss.toLocaleString();
                
                // Color Logic
                const tsColor = loss > 0 ? 'text-red-400' : 'text-blue-400';
                const afsColor = loss > 0 ? 'text-red-400' : 'text-yellow-400';
                
                // TS Update
                tsBs.textContent = fvFormatted;
                tsNi.textContent = lossFormatted;
                tsNi.className = `font-bold ${tsColor}`;
                document.getElementById('card-ts').style.borderColor = loss > 0 ? '#451a1a' : '#1e3a8a';
                
                // AFS Update
                afsBs.textContent = fvFormatted;
                afsOci.textContent = lossFormatted;
                afsOci.className = `font-bold ${afsColor}`;
                document.getElementById('card-afs').style.borderColor = loss > 0 ? '#451a1a' : '#713f12';
                
                // HTM Update (Book value stays static, Footnote changes)
                htmFn.textContent = fvFormatted;
            });
        }

        // Initial Render
        renderSlide();
    </script>
