        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    };

    levels.forEach(level => {
        level.choices = shuffleArray(level.choices);
    });

    const App = () => {
      const [gameStarted, setGameStarted] = useState(false);
      const [teamData, setTeamData] = useState({ teamName: '' });
      
      const initialFs = {
        assets: { cash: 100000, ar: 40000, inventory: 30000, ppe: 180000, accumDepr: 50000 }, 
        liabilities: { ap: 25000, unearnedRev: 5000, interestPayable: 0, longTermDebt: 60000 }, 
        equity: { paidInCapital: 80000, retainedEarnings: 130000 }, 
        is: { revenue: 400000, cogs: 120000, opEx: 150000, otherIncome: 0, interestExpense: 0, taxExpense: 0 }
      };

      const [state, setState] = useState({
        currentIndex: 0,
        viewingIndex: 0,
        timeLeft: 60, 
        fs: initialFs,
        budget: 5000, 
        score: 0, 
        combo: 1, 
        inventory: { memo: 0, insurance: 0 },
        active: { insurance: false, usedMemo: false },
        finished: false
      });

      const [levelData, setLevelData] = useState({});
      const [showShop, setShowShop] = useState(false);
      const [showFinancials, setShowFinancials] = useState(false);
      const [shake, setShake] = useState(false);
      const [emergencyInfo, setEmergencyInfo] = useState(null);
      
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      const calcMetrics = (fs) => {
        const gm = fs.is.revenue - fs.is.cogs;
        const gmPercent = fs.is.revenue === 0 ? 0 : ((gm / fs.is.revenue) * 100).toFixed(1);
        const netIncome = fs.is.revenue - fs.is.cogs - fs.is.opEx + fs.is.otherIncome - fs.is.interestExpense - fs.is.taxExpense;
        const totalAssets = fs.assets.cash + fs.assets.ar + fs.assets.inventory + fs.assets.ppe - fs.assets.accumDepr;
        const totalLiab = fs.liabilities.ap + fs.liabilities.unearnedRev + fs.liabilities.interestPayable + fs.liabilities.longTermDebt;
        const totalEq = fs.equity.paidInCapital + netIncome; 
        
        const dii = fs.is.cogs > 0 ? ((fs.assets.inventory / fs.is.cogs) * 365).toFixed(0) : "N/A";
        const dso = fs.is.revenue > 0 ? ((fs.assets.ar / fs.is.revenue) * 365).toFixed(0) : "N/A";
        const dpo = fs.is.cogs > 0 ? ((fs.liabilities.ap / fs.is.cogs) * 365).toFixed(0) : "N/A";
        
        let ccc = "N/A";
        if (dii !== "N/A" && dso !== "N/A" && dpo !== "N/A") {
            ccc = (parseFloat(dii) + parseFloat(dso) - parseFloat(dpo)).toFixed(0);
        }

        return { gm, gmPercent, netIncome, totalAssets, totalLiab, totalEq, dii, dso, dpo, ccc };
      };

      const metrics = calcMetrics(state.fs);
      
      // Calculate Cash Health percentage (Max 150k for green, 0 for dead)
      const cashHealthPercent = Math.max(0, Math.min(100, (state.fs.assets.cash / 100000) * 100));

      const triggerPenaltyShake = () => {
        setShake(true);
        setTimeout(() => setShake(false), 500);
      };

      const applyEffectsAndSetState = (effects, wasCorrect, prevState) => {
        let fs = {
          assets: { ...prevState.fs.assets },
          liabilities: { ...prevState.fs.liabilities },
          equity: { ...prevState.fs.equity },
          is: { ...prevState.fs.is }
        };

        let active = { ...prevState.active };
        let budgetDelta = wasCorrect ? 1000 : 0; // Shop budget
        let finalEffects = { ...effects };

        if (!wasCorrect) {
            if (active.insurance) {
                active.insurance = false; // Shield absorbs the hit
            } else {
                finalEffects.opEx = (finalEffects.opEx || 0) + 15000;
                finalEffects.cash = (finalEffects.cash || 0) - 15000;
                triggerPenaltyShake();
            }
        }

        let projectedCash = fs.assets.cash + (finalEffects.cash || 0);
        let emergencyTriggered = false;
        
        if (projectedCash < 0) {
            emergencyTriggered = true;
            let loanAmount = Math.abs(projectedCash) + 5000; 
            let loanFee = 2500; 
            finalEffects.cash = (finalEffects.cash || 0) + loanAmount;
            finalEffects.longTermDebt = (finalEffects.longTermDebt || 0) + loanAmount; 
            finalEffects.interestPayable = (finalEffects.interestPayable || 0) + loanFee;
            finalEffects.interestExpense = (finalEffects.interestExpense || 0) + loanFee;
            triggerPenaltyShake();
            setEmergencyInfo({ amount: loanAmount, fee: loanFee });
        }

        if (finalEffects.cash !== undefined) fs.assets.cash += finalEffects.cash;
        if (finalEffects.ar !== undefined) fs.assets.ar += finalEffects.ar;
        if (finalEffects.inventory !== undefined) fs.assets.inventory += finalEffects.inventory;
        if (finalEffects.ppe !== undefined) fs.assets.ppe += finalEffects.ppe;
        if (finalEffects.accumDepr !== undefined) fs.assets.accumDepr += finalEffects.accumDepr;
        if (finalEffects.ap !== undefined) fs.liabilities.ap += finalEffects.ap;
        if (finalEffects.longTermDebt !== undefined) fs.liabilities.longTermDebt += finalEffects.longTermDebt;
        if (finalEffects.interestPayable !== undefined) fs.liabilities.interestPayable += finalEffects.interestPayable;
        if (finalEffects.revenue !== undefined) fs.is.revenue += finalEffects.revenue;
        if (finalEffects.cogs !== undefined) fs.is.cogs += finalEffects.cogs;
        if (finalEffects.opEx !== undefined) fs.is.opEx += finalEffects.opEx;
        if (finalEffects.otherIncome !== undefined) fs.is.otherIncome += finalEffects.otherIncome;
        if (finalEffects.interestExpense !== undefined) fs.is.interestExpense += finalEffects.interestExpense;

        fs.equity.retainedEarnings = fs.is.revenue - fs.is.cogs - fs.is.opEx + fs.is.otherIncome - fs.is.interestExpense - fs.is.taxExpense;

        return { newFs: fs, newActive: active, budgetDelta, emergencyTriggered, penaltyApplied: !wasCorrect && !prevState.active.insurance };
      };

      const handleChoice = (choiceIdx) => {
        if (isReviewMode || historyData) return;
        const currentLevel = levels[state.viewingIndex];
        const choice = currentLevel.choices[choiceIdx];
        
        // Calculate Points & Combo
        let pointsEarned = 0;
        let newCombo = state.combo;
        let comboWas = state.combo;
        
        if (choice.correct) {
            pointsEarned = 1000 * state.combo;
            newCombo = Math.min(state.combo + 1, 5); // Max 5x combo
        } else {
            pointsEarned = -500; // Penalty points
            newCombo = 1; // Break combo
        }
        
        const { newFs, newActive, budgetDelta, emergencyTriggered, penaltyApplied } = applyEffectsAndSetState(choice.effects, choice.correct, state);

        setState(prev => ({ 
            ...prev, 
            fs: newFs, 
            active: newActive, 
            budget: prev.budget + budgetDelta,
            score: prev.score + pointsEarned,
            combo: newCombo
        }));

        setLevelData(prev => ({ 
            ...prev, 
            [state.viewingIndex]: { 
                choiceIdx, 
                correct: choice.correct, 
                points: pointsEarned,
                comboWas: comboWas,
                penaltyApplied,
                feedback: {
                    good: choice.correct,
                    title: choice.fb,
                    explanation: currentLevel.explanation
                } 
            } 
        }));
      };

      const nextLevel = () => {
        if (state.viewingIndex < state.currentIndex) {
            setState(prev => ({ ...prev, viewingIndex: prev.viewingIndex + 1 }));
            return;
        }
        if (state.currentIndex + 1 >= levels.length) setState(prev => ({ ...prev, finished: true }));
        else setState(prev => ({ ...prev, currentIndex: prev.currentIndex + 1, viewingIndex: prev.currentIndex + 1, timeLeft: 60, active: { ...prev.active, usedMemo: false } }));
      };

      useEffect(() => {
        if (!gameStarted || state.finished || historyData || emergencyInfo || state.viewingIndex < state.currentIndex) return;
        if (state.timeLeft <= 0) { 
            const { newFs, newActive } = applyEffectsAndSetState({ cash: -10000, opEx: 10000 }, false, state);
            setState(prev => ({ ...prev, fs: newFs, active: newActive, score: prev.score - 500, combo: 1 }));
            setLevelData(prev => ({ ...prev, [state.viewingIndex]: { choiceIdx: -1, correct: false, points: -500, comboWas: state.combo, penaltyApplied: true, feedback: { good: false, title: 'TIMEOUT PENALTY', explanation: 'The CFO got bored and fined you $10,000 for stalling. Combo shattered.' } } }));
            return; 
        }
        const timerId = setTimeout(() => setState(prev => ({ ...prev, timeLeft: prev.timeLeft - 1 })), 1000);
        return () => clearTimeout(timerId);
      }, [gameStarted, state.finished, historyData, state.timeLeft, state.viewingIndex, emergencyInfo, state]);

      const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(val);

      const submitToSheet = async () => {
        setIsSubmitting(true);
        const data = new URLSearchParams();
        data.append("teamName", teamData.teamName);
        data.append("role", "Arcade Mode"); 
        data.append("score", `Score: ${state.score} | NI: ${metrics.netIncome} | CCC: ${metrics.ccc}`); 
        
        try {
          await fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: data
          });
          setSubmitSuccess(true);
        } catch(e) {
          console.error(e);
          alert("Network error. Please try submitting again.");
        }
        setIsSubmitting(false);
      };

      const currentLevel = levels[state.viewingIndex];
      const isReviewMode = state.viewingIndex < state.currentIndex;
      const historyData = levelData[state.viewingIndex];
      const answeredState = isReviewMode || !!historyData;

      // --- LANDING PAGE ---
      if (!gameStarted) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-cyber-bg font-sans">
            <div className="bg-grid"></div>
            
            <div className="arcade-panel max-w-lg w-full p-8 rounded-2xl relative z-10 animate-fade-in text-center shadow-[0_0_50px_rgba(5,217,232,0.15)] border-t-4 border-cyber-cyan">
              <div className="inline-flex items-center justify-center w-20 h-20 rounded-xl bg-cyber-panel text-cyber-cyan mb-6 shadow-[0_0_30px_rgba(5,217,232,0.4)] border-2 border-cyber-cyan animate-pulse-glow">
                <Icons.Flame />
              </div>
              <h1 className="text-4xl md:text-5xl font-arcade font-black mb-2 tracking-widest neon-text text-white">CAPITAL</h1>
              <h1 className="text-4xl md:text-5xl font-arcade font-black mb-8 tracking-widest neon-text-pink text-cyber-pink">CARNAGE</h1>
              
              <div className="bg-black/60 p-5 rounded-xl border border-cyber-purple/50 mb-8 text-left space-y-4 shadow-inner">
                <h2 className="text-cyber-cyan font-arcade font-bold tracking-widest mb-3 flex items-center gap-2 border-b border-cyber-cyan/30 pb-2">
                    <Icons.FileText /> ANALYST RULES
                </h2>
                <div className="flex items-start gap-3">
                    <div className="text-cyber-green mt-0.5"><Icons.Check /></div>
                    <p className="text-sm text-slate-300"><strong>BUILD COMBOS:</strong> String together correct GAAP accounting entries to multiply your Analyst Score!</p>
                </div>
                <div className="flex items-start gap-3">
                    <div className="text-cyber-pink mt-0.5"><Icons.Skull /></div>
                    <p className="text-sm text-slate-300"><strong>SURVIVE THE SEC:</strong> Wrong answers shatter your combo and trigger massive $15,000 fines. If your Cash hits $0, you're dead.</p>
                </div>
                <div className="flex items-start gap-3">
                    <div className="text-cyber-orange mt-0.5"><Icons.Briefcase /></div>
                    <p className="text-sm text-slate-300"><strong>BLACK MARKET:</strong> Use budget to buy cheat codes and shredders to protect your streak.</p>
                </div>
              </div>

              <div className="space-y-4 mb-8">
                <input type="text" className="w-full bg-cyber-bg/50 border-2 border-cyber-purple focus:border-cyber-cyan rounded-xl p-4 text-white outline-none transition-all font-mono text-center uppercase tracking-widest placeholder-slate-600 shadow-[inset_0_0_10px_rgba(123,44,191,0.2)]" 
                       value={teamData.teamName} onChange={e => setTeamData({...teamData, teamName: e.target.value})} placeholder="ENTER PLAYER ALIAS" />
              </div>
              
              <button disabled={!teamData.teamName} onClick={() => setGameStarted(true)} 
                className="w-full bg-cyber-pink hover:bg-[#ff0055] text-white py-5 rounded-xl transition-all disabled:opacity-50 font-arcade font-black text-xl tracking-widest uppercase shadow-[0_0_20px_rgba(255,42,109,0.5)] active:scale-95 group">
                <span className="group-hover:animate-pulse">START SIMULATION</span>
              </button>
            </div>
          </div>
        );
      }

      // --- END SCREEN ---
      if (state.finished) {
        return (
          <div className="min-h-screen p-4 md:p-6 relative overflow-auto font-sans bg-cyber-bg text-slate-200">
             <div className="bg-grid"></div>
             
             <div className="max-w-4xl mx-auto arcade-panel p-6 md:p-10 rounded-2xl animate-fade-in shadow-[0_0_40px_rgba(5,217,232,0.15)] mt-4 md:mt-8 relative z-10 border-t-4 border-cyber-cyan">
                <div className="text-center mb-8">
                    <div className="inline-block bg-cyber-pink text-white px-6 py-2 rounded font-arcade font-black tracking-widest uppercase mb-4 shadow-[0_0_15px_rgba(255,42,109,0.5)]">ANALYSIS SURVIVED</div>
                    <h2 className="text-4xl md:text-5xl font-arcade font-black mb-2 text-white neon-text">FINAL SCORE</h2>
                    <div className="text-6xl md:text-8xl font-mono font-black text-cyber-green my-6 drop-shadow-[0_0_20px_rgba(1,255,195,0.6)] animate-bounce-fast">
                        {state.score} <span className="text-2xl text-slate-400">PTS</span>
                    </div>
                    <p className="text-slate-400 font-mono">PLAYER ALIAS: <strong className="text-cyber-cyan">{teamData.teamName}</strong></p>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                  <div className="bg-black/40 p-6 rounded-xl border border-cyber-cyan/50 text-center shadow-[inset_0_0_20px_rgba(5,217,232,0.05)]">
                    <div className="text-xs text-cyber-cyan uppercase font-bold tracking-widest mb-2">SURVIVING CASH</div>
                    <div className={`text-2xl md:text-3xl font-mono font-black ${state.fs.assets.cash < 0 ? 'text-cyber-pink' : 'text-white'}`}>{formatCurrency(state.fs.assets.cash)}</div>
                  </div>
                  <div className="bg-black/40 p-6 rounded-xl border border-cyber-purple/50 text-center shadow-[inset_0_0_20px_rgba(123,44,191,0.05)]">
                    <div className="text-xs text-cyber-purple uppercase font-bold tracking-widest mb-2">FINAL NET INCOME</div>
                    <div className="text-2xl md:text-3xl font-mono font-black text-white">{formatCurrency(metrics.netIncome)}</div>
                  </div>
                </div>

                <div className="space-y-4">
                    {!submitSuccess ? (
                      <button onClick={submitToSheet} disabled={isSubmitting} className="w-full bg-cyber-green hover:bg-[#00cc99] text-cyber-bg py-5 rounded-xl font-arcade font-black text-xl tracking-widest uppercase transition-all shadow-[0_0_20px_rgba(1,255,195,0.4)] disabled:opacity-50 flex justify-center gap-3">
                        {isSubmitting ? 'TRANSMITTING...' : 'UPLOAD SCORE TO LEADERBOARD'}
                      </button>
                    ) : (
                      <div className="bg-cyber-green/20 border border-cyber-green p-5 rounded-xl text-cyber-green font-arcade font-black text-xl uppercase tracking-widest text-center shadow-[0_0_15px_rgba(1,255,195,0.3)] animate-pulse">
                        SCORE TRANSMITTED SUCCESSFULLY
                      </div>
                    )}
                    
                    <button onClick={() => window.location.reload()} className="w-full bg-transparent border-2 border-slate-600 text-slate-300 py-4 rounded-xl font-arcade font-bold text-lg tracking-widest uppercase hover:bg-slate-800 hover:text-white transition-all">
                      PLAY AGAIN
                    </button>
                </div>
             </div>
          </div>
        )
      }

      // --- MAIN GAME UI ---
      return (
        <div className={`h-screen flex flex-col relative overflow-hidden font-sans text-sm md:text-base ${shake ? 'animate-shake' : ''}`}>
          <div className="bg-grid opacity-30"></div>
          
          {/* STICKY TOP DASHBOARD */}
          <header className="arcade-header flex flex-col md:flex-row justify-between items-center p-3 md:px-6 z-20 shrink-0 sticky top-0">
            <div className="flex justify-between items-center w-full md:w-auto mb-3 md:mb-0">
                <div className="font-arcade font-black text-xl tracking-widest neon-text text-white mr-4">LVL {state.viewingIndex + 1}</div>
                
                {/* COMBO METER */}
                <div className={`flex items-center gap-1.5 px-3 py-1 rounded-lg border-2 mr-3 ${state.combo > 1 ? 'bg-cyber-orange/20 border-cyber-orange shadow-[0_0_10px_rgba(255,170,0,0.4)] text-cyber-orange animate-pulse' : 'bg-cyber-bg border-slate-700 text-slate-500'}`}>
                    <Icons.Flame />
                    <span className="font-arcade font-black">x{state.combo}</span>
                </div>

                {/* SCORE */}
                <div className="bg-cyber-bg border-2 border-cyber-green px-4 py-1 rounded-lg flex items-center gap-2 mr-4 shadow-[0_0_10px_rgba(1,255,195,0.2)]">
                    <span className="text-[10px] text-cyber-green uppercase font-bold tracking-widest hidden sm:inline">SCORE</span>
                    <span className="font-mono font-black text-lg text-white">{state.score}</span>
                </div>
                
                <div className={`flex items-center gap-2 px-3 py-1 rounded-lg font-mono font-black text-lg border-2 ${state.timeLeft <= 15 && !answeredState ? 'bg-cyber-pink/20 text-cyber-pink border-cyber-pink animate-pulse' : 'bg-cyber-bg border-cyber-cyan text-cyber-cyan'}`}>
                  <Icons.Clock /> {isReviewMode ? '--:--' : `00:${state.timeLeft.toString().padStart(2, '0')}`}
                </div>
            </div>

            {/* LIVE METRICS - Focus on Health/Cash */}
            <div className="flex gap-2 w-full md:w-auto overflow-x-auto hide-scrollbar pb-1 md:pb-0 snap-x items-center">
              <div className="arcade-panel px-3 py-1.5 rounded-lg min-w-[140px] snap-start border-cyber-pink/50 flex-1 md:flex-none">
                <div className="flex justify-between items-end mb-1">
                    <div className="text-[10px] uppercase font-bold text-cyber-pink tracking-widest">CASH (HEALTH)</div>
                    <div className={`font-mono font-black text-xs ${state.fs.assets.cash < 20000 ? 'text-cyber-pink animate-pulse' : 'text-white'}`}>{formatCurrency(state.fs.assets.cash)}</div>
                </div>
                <div className="health-bar-container">
                    <div className="health-bar-fill" style={{ width: `${cashHealthPercent}%`, backgroundColor: cashHealthPercent < 20 ? '#ff2a6d' : '#01ffc3' }}></div>
                </div>
              </div>
              <div className="arcade-panel px-3 py-1.5 rounded-lg min-w-[90px] snap-start border-cyber-purple/50">
                <div className="text-[10px] uppercase font-bold text-cyber-purple tracking-widest">NET INC</div>
                <div className="font-mono font-black text-sm text-white">{formatCurrency(metrics.netIncome)}</div>
              </div>
               <button onClick={() => setShowFinancials(true)} className="arcade-panel px-3 py-1.5 rounded-lg min-w-[50px] snap-start flex items-center justify-center text-cyber-cyan hover:bg-cyber-cyan/20 transition-colors border-cyber-cyan">
                <Icons.FileText />
              </button>
            </div>
          </header>

          {/* MAIN PLAY AREA */}
          <main className="flex-1 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6 flex flex-col gap-4 z-10 relative">
            
            {/* SCENARIO CARD */}
            <div className="arcade-panel rounded-xl p-5 md:p-6 shrink-0 animate-slide-up relative">
                <div className="flex flex-col md:flex-row gap-6 items-start">
                    <div className="w-full md:w-1/3 h-48 md:h-full min-h-[180px] rounded-xl overflow-hidden relative border-2 border-cyber-cyan shadow-[0_0_15px_rgba(5,217,232,0.3)] shrink-0 group">
                        <img src={currentLevel.bgImage || 'data/1.png'} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="Scenario" />
                        <div className="absolute inset-0 bg-cyber-bg/30"></div>
                        <div className="absolute inset-0 ring-1 ring-inset ring-cyber-cyan/50 rounded-xl"></div>
                        <div className="absolute bottom-2 left-2 bg-black/60 px-2 py-1 rounded text-[10px] font-arcade text-cyber-cyan uppercase border border-cyber-cyan/30 backdrop-blur">
                            Target: {currentLevel.concept}
                        </div>
                    </div>
                    
                    <div className="flex-1">
                        <h2 className="text-2xl md:text-3xl font-arcade font-bold text-white mb-4 mt-2 md:mt-0 leading-tight">{currentLevel.title}</h2>
                        <div className="bg-cyber-bg/80 p-4 rounded-lg border border-white/10 text-slate-200 text-base leading-relaxed mb-4 font-medium shadow-inner">
                          {currentLevel.scene}
                        </div>
                        
                        {/* HINT SYSTEM */}
                        {!state.active.usedMemo && !answeredState ? (
                          <div className="flex items-center justify-between gap-4 bg-cyber-panel/50 p-3 rounded-lg border border-cyber-purple/30">
                            <div className="text-xs text-slate-400 font-bold uppercase tracking-widest"><Icons.Shield /> GAAP Cheat Code Locked</div>
                            <button onClick={() => {
                                if(state.inventory.memo > 0) {
                                    setState(prev => ({...prev, inventory: {...prev.inventory, memo: prev.inventory.memo - 1}, active: {...prev.active, usedMemo: true}}));
                                }
                            }} className={`text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded transition-all ${state.inventory.memo > 0 ? 'bg-cyber-purple text-white hover:bg-cyber-purple/80 shadow-[0_0_10px_rgba(123,44,191,0.5)]' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>
                              Use Phone (Own: {state.inventory.memo})
                            </button>
                          </div>
                        ) : (state.active.usedMemo || answeredState) ? (
                          <div className="bg-cyber-purple/20 border border-cyber-purple/50 p-4 rounded-lg animate-fade-in shadow-[inset_0_0_10px_rgba(123,44,191,0.2)]">
                            <div className="flex items-center gap-2 mb-1 font-black text-[10px] uppercase tracking-widest text-cyber-purple">
                              GAAP CHEAT CODE DECRYPTED
                            </div>
                            <p className="text-slate-300 text-sm font-bold">{currentLevel.explanation}</p>
                          </div>
                        ) : null}
                    </div>
                </div>
            </div>

            {/* CHOICES */}
            <div className="flex flex-col gap-3 shrink-0 mb-4">
              {currentLevel.choices.map((choice, idx) => {
                const isSelected = historyData?.choiceIdx === idx;
                let btnClass = "btn-arcade w-full text-left p-4 md:p-5 font-bold text-sm md:text-base rounded-xl flex gap-4 items-center ";
                
                if (!answeredState) btnClass += "cursor-pointer group hover:pl-6 transition-all";
                else if (isSelected) {
                    if (choice.correct) btnClass += " selected-correct scale-[1.02] border-l-8 border-l-cyber-green";
                    else btnClass += " selected-wrong scale-[1.02] border-l-8 border-l-cyber-pink";
                } else btnClass += " opacity-40 grayscale cursor-not-allowed";

                return (
                  <button key={idx} disabled={answeredState} onClick={() => handleChoice(idx)} className={btnClass}>
                    <div className="flex-shrink-0">
                      {isSelected && choice.correct ? <div className="text-cyber-bg bg-cyber-green p-1.5 rounded shadow-[0_0_10px_rgba(1,255,195,0.8)]"><Icons.Check /></div> :
                       isSelected && !choice.correct ? <div className="text-white bg-cyber-pink p-1.5 rounded shadow-[0_0_10px_rgba(255,42,109,0.8)]"><Icons.X /></div> :
                       <div className="w-6 h-6 rounded border-2 border-slate-600 group-hover:border-cyber-cyan transition-colors"></div>}
                    </div>
                    <span>{choice.text}</span>
                  </button>
                );
              })}
            </div>

            {/* FEEDBACK (Only shows after answering) */}
            {historyData && (
              <div className={`p-5 rounded-xl border-2 animate-pop-in flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl ${historyData.feedback.good ? 'bg-cyber-green/10 border-cyber-green' : 'bg-cyber-pink/10 border-cyber-pink'}`}>
                <div>
                    <h3 className={`text-xl font-arcade font-black mb-2 flex items-center gap-2 ${historyData.feedback.good ? 'text-cyber-green' : 'text-cyber-pink'}`}>
                      {historyData.feedback.title}
                    </h3>
                    {historyData.penaltyApplied && (
                        <div className="text-cyber-pink text-xs font-black uppercase tracking-widest bg-cyber-pink/20 inline-block px-2 py-1 rounded mb-2 border border-cyber-pink">
                           SEC FINE APPLIED: -$15,000 CASH
                        </div>
                    )}
                </div>
                
                <div className="shrink-0 flex flex-col items-end gap-1">
                    {historyData.points > 0 ? (
                        <>
                            <div className="text-cyber-orange font-arcade font-black text-sm uppercase">COMBO x{historyData.comboWas}</div>
                            <div className="bg-cyber-green/20 border border-cyber-green text-cyber-green px-4 py-2 rounded-lg font-arcade font-black text-2xl animate-pulse text-center shadow-[0_0_15px_rgba(1,255,195,0.4)]">
                                +{historyData.points} PTS
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="text-slate-500 font-arcade font-black text-sm uppercase">COMBO BROKEN</div>
                            <div className="bg-cyber-pink/20 border border-cyber-pink text-cyber-pink px-4 py-2 rounded-lg font-arcade font-black text-2xl animate-shake text-center shadow-[0_0_15px_rgba(255,42,109,0.4)]">
                                {historyData.points} PTS
                            </div>
                        </>
                    )}
                </div>
              </div>
            )}
          </main>

          {/* STICKY BOTTOM BAR FOR MOBILE ACTION */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-cyber-bg/95 backdrop-blur-md border-t border-white/10 z-30 flex gap-3 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
             {!answeredState ? (
                <button onClick={() => setShowShop(true)} className="flex-1 bg-cyber-panel border border-cyber-cyan text-cyber-cyan py-3.5 rounded-lg font-arcade font-black uppercase tracking-widest text-sm active:scale-95 transition-transform flex items-center justify-center gap-2 hover:bg-cyber-cyan/10">
                    <Icons.Briefcase /> BLACK MARKET
                </button>
             ) : (
                <button onClick={nextLevel} className="w-full bg-cyber-cyan text-cyber-bg py-4 rounded-lg font-arcade font-black text-lg tracking-widest uppercase active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(5,217,232,0.6)] hover:bg-[#00ffff]">
                  {isReviewMode ? 'RESUME ANALYSIS' : 'NEXT STAGE'} <Icons.ArrowRight />
                </button>
             )}
          </div>

          {/* EMERGENCY LOAN MODAL */}
          {emergencyInfo && (
            <div className="fixed inset-0 bg-cyber-bg/95 flex items-center justify-center p-4 z-[60] backdrop-blur animate-fade-in">
              <div className="arcade-panel border-cyber-pink p-6 md:p-8 rounded-2xl w-full max-w-sm text-center shadow-[0_0_50px_rgba(255,42,109,0.4)]">
                <div className="text-cyber-pink flex justify-center mb-4 animate-bounce-fast"><Icons.Skull /></div>
                <h2 className="text-2xl font-arcade font-black text-cyber-pink mb-4">BANKRUPTCY AVERTED</h2>
                <p className="text-slate-300 text-sm mb-4">The SEC kicked down your door! Your cash hit zero.</p>
                <p className="text-slate-400 text-xs mb-6 bg-black/50 p-3 rounded border border-cyber-pink/30">A loan shark named 'Vinnie' forced a <strong>{formatCurrency(emergencyInfo.amount)}</strong> bridge loan on you with a <strong>{formatCurrency(emergencyInfo.fee)}</strong> fee.</p>
                <button onClick={() => setEmergencyInfo(null)} className="w-full bg-cyber-pink text-white py-3 rounded-lg font-black uppercase tracking-widest hover:bg-[#ff0055] transition-colors shadow-[0_0_15px_rgba(255,42,109,0.5)]">
                  ACCEPT VINNIE'S TERMS
                </button>
              </div>
            </div>
          )}

          {/* FINANCIAL STATEMENTS MODAL */}
          {showFinancials && (
            <div className="fixed inset-0 bg-cyber-bg/95 flex flex-col p-4 z-50 backdrop-blur animate-fade-in">
                <div className="flex justify-between items-center mb-4 mt-2">
                    <h2 className="text-xl font-arcade font-black text-cyber-cyan flex items-center gap-2"><Icons.FileText /> DATA TERMINAL</h2>
                    <button onClick={() => setShowFinancials(false)} className="text-slate-400 hover:text-white p-2 border border-slate-700 rounded bg-cyber-panel"><Icons.X /></button>
                </div>
                <div className="flex-1 overflow-y-auto bg-cyber-panel border border-white/10 rounded-xl p-5 font-mono text-xs md:text-sm text-slate-300 shadow-inner">
                    <div className="mb-8">
                        <h3 className="text-cyber-green font-bold border-b-2 border-cyber-green/50 pb-1 mb-3 text-base">INCOME STATEMENT</h3>
                        <div className="flex justify-between mb-1"><span>Revenue</span><span>{formatCurrency(state.fs.is.revenue)}</span></div>
                        <div className="flex justify-between mb-1 text-slate-400"><span>COGS</span><span>({formatCurrency(state.fs.is.cogs)})</span></div>
                        <div className="flex justify-between text-cyber-cyan my-2 font-bold bg-cyber-cyan/10 p-1 rounded"><span>Gross Margin</span><span>{formatCurrency(metrics.gm)}</span></div>
                        <div className="flex justify-between mb-1 text-slate-400"><span>OpEx</span><span>({formatCurrency(state.fs.is.opEx)})</span></div>
                        <div className="flex justify-between mb-1 text-slate-400"><span>Other Income/Exp</span><span>{formatCurrency(state.fs.is.otherIncome - state.fs.is.interestExpense)}</span></div>
                        <div className="flex justify-between border-t-2 border-cyber-green/50 mt-2 pt-2 font-black text-white text-base"><span>NET INCOME</span><span>{formatCurrency(metrics.netIncome)}</span></div>
                    </div>
                    <div>
                        <h3 className="text-cyber-purple font-bold border-b-2 border-cyber-purple/50 pb-1 mb-3 text-base">BALANCE SHEET</h3>
                        <div className="flex justify-between mb-1"><span>Cash</span><span className={state.fs.assets.cash < 0 ? 'text-cyber-pink font-bold' : 'text-cyber-green font-bold'}>{formatCurrency(state.fs.assets.cash)}</span></div>
                        <div className="flex justify-between mb-1"><span>Accounts Receivable</span><span>{formatCurrency(state.fs.assets.ar)}</span></div>
                        <div className="flex justify-between mb-1"><span>Inventory</span><span>{formatCurrency(state.fs.assets.inventory)}</span></div>
                        <div className="flex justify-between mb-1 text-slate-400"><span>PP&E (Net)</span><span>{formatCurrency(state.fs.assets.ppe - state.fs.assets.accumDepr)}</span></div>
                        <div className="flex justify-between border-t border-white/20 mt-2 pt-1 font-bold"><span>TOTAL ASSETS</span><span>{formatCurrency(metrics.totalAssets)}</span></div>
                        
                        <div className="mt-4 flex justify-between mb-1"><span>Total Liabilities</span><span className="text-cyber-pink">{formatCurrency(metrics.totalLiab)}</span></div>
                        <div className="flex justify-between mb-1"><span>Total Equity</span><span>{formatCurrency(metrics.totalEq)}</span></div>
                        <div className="flex justify-between border-t border-white/20 mt-2 pt-1 font-bold"><span>LIAB + EQUITY</span><span>{formatCurrency(metrics.totalLiab + metrics.totalEq)}</span></div>
                    </div>
                </div>
            </div>
          )}

          {/* SHOP MODAL */}
          {showShop && (
            <div className="fixed inset-0 bg-cyber-bg/95 flex items-center justify-center p-4 z-50 backdrop-blur animate-fade-in">
              <div className="arcade-panel w-full max-w-md p-6 rounded-2xl relative shadow-[0_0_30px_rgba(123,44,191,0.3)] border-t-4 border-cyber-purple">
                <button onClick={() => setShowShop(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><Icons.X /></button>
                <h2 className="text-2xl font-arcade font-black text-cyber-purple mb-1">BLACK MARKET</h2>
                <p className="text-xs text-slate-400 mb-5 uppercase tracking-widest">Acquire unfair advantages.</p>
                
                <div className="bg-black/60 p-4 rounded-lg border border-cyber-green/30 mb-6 flex justify-between items-center shadow-inner">
                  <span className="text-xs text-slate-400 font-bold tracking-widest uppercase">Firm Budget</span>
                  <span className="font-mono text-cyber-green font-black text-xl">{formatCurrency(state.budget)}</span>
                </div>
                
                <div className="space-y-4">
                    {/* HINT ITEM */}
                    <div className="border border-white/10 bg-black/30 p-4 rounded-xl flex justify-between items-center hover:border-cyber-cyan/50 transition-colors">
                        <div>
                            <div className="font-bold text-white flex items-center gap-2"><Icons.FileText /> Burner Phone Hint</div>
                            <div className="text-[10px] text-slate-400 mt-1">Decrypts the hidden GAAP rule.</div>
                            <div className="text-xs mt-2 text-cyber-cyan font-mono bg-cyber-cyan/10 inline-block px-2 py-0.5 rounded">Cost: $1,000 | Own: {state.inventory.memo}</div>
                        </div>
                        <button onClick={() => setState(p => ({...p, budget: p.budget - 1000, inventory: {...p.inventory, memo: p.inventory.memo + 1}}))} disabled={state.budget < 1000} className="bg-cyber-panel border-2 border-cyber-cyan text-cyber-cyan px-4 py-2 rounded font-arcade text-xs font-bold uppercase disabled:opacity-30 disabled:cursor-not-allowed hover:bg-cyber-cyan hover:text-black transition-colors">Buy</button>
                    </div>

                    {/* SHIELD ITEM */}
                    <div className="border border-white/10 bg-black/30 p-4 rounded-xl flex justify-between items-center hover:border-cyber-purple/50 transition-colors">
                        <div>
                            <div className="font-bold text-white flex items-center gap-2"><Icons.Shield /> Doc Shredder (Hedge)</div>
                            <div className="text-[10px] text-slate-400 mt-1">Blocks 1 SEC Fine ($15k penalty).</div>
                            <div className="text-xs mt-2 text-cyber-purple font-mono bg-cyber-purple/10 inline-block px-2 py-0.5 rounded">Cost: $3,000 | Own: {state.inventory.insurance}</div>
                        </div>
                        <button onClick={() => setState(p => ({...p, budget: p.budget - 3000, inventory: {...p.inventory, insurance: p.inventory.insurance + 1}}))} disabled={state.budget < 3000} className="bg-cyber-panel border-2 border-cyber-purple text-cyber-purple px-4 py-2 rounded font-arcade text-xs font-bold uppercase disabled:opacity-30 disabled:cursor-not-allowed hover:bg-cyber-purple hover:text-white transition-colors">Buy</button>
                    </div>
                    
                    {/* ACTIVATE SHIELD */}
                    <button onClick={() => setState(p => ({...p, inventory: {...p.inventory, insurance: p.inventory.insurance - 1}, active: {...p.active, insurance: true}}))} disabled={state.inventory.insurance === 0 || state.active.insurance} className="w-full bg-cyber-purple/20 border-2 border-cyber-purple text-cyber-purple py-3 rounded-xl font-arcade text-sm font-bold uppercase disabled:opacity-30 disabled:cursor-not-allowed hover:bg-cyber-purple hover:text-white transition-colors mt-2 flex items-center justify-center gap-2">
                        {state.active.insurance ? 'SHREDDER ACTIVE' : 'ACTIVATE SHREDDER'}
                    </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
