            50% { transform: scale(1.3) rotate(15deg); opacity: 1; }

            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));

        // --- Data & Correct Answers ---
        const CORRECT_ANSWERS = {

            "8-2-b-noncash": { val: 0, eq: "0" },
            "8-2-b-liab": { val: 0, eq: "0" },
            "8-2-b-cc": { val: -2826, eq: "-2826" },
            "8-2-b-ec": { val: 0, eq: "0" },

            "8-2-c-cash": { val: 307, eq: "216 + 91" },
            "8-2-c-noncash": { val: 0, eq: "0" },
            "8-2-c-liab": { val: 0, eq: "0" },
            "8-2-c-cc": { val: 307, eq: "216 + 91" },
            "8-2-c-ec": { val: 0, eq: "0" },

            "8-2-d-cash": { val: 0, eq: "0" },
            "8-2-d-noncash": { val: 0, eq: "0" },
            "8-2-d-liab": { val: 0, eq: "0" },
            "8-2-d-cc": { val: 172, eq: "172" },
            "8-2-d-ec": { val: -172, eq: "-172" }, 

            "8-3-c-calc": { val: 172, eq: "172" },

            "8-4-a-calc": { val: 11.45, eq: "8223 / 718.3" },
            "8-4-b-calc": { val: 11.39, eq: "8223 / 721.9" },
            "8-4-d-calc": { val: 59.22, eq: "4870 / 8223 * 100", isPercent: true }, 
            "8-4-e-calc": { val: 2.29, eq: "6.78 / 296.50 * 100", isPercent: true },

            "8-5-a-calc": { val: -96, eq: "-196 + 125 - 25" },
            "8-5-c-calc": { val: -2553, eq: "-2456 - 97" },
        };

        const MCQ_ANSWERS = {
            "8-3-a-mcq": "A",
            "8-3-b-mcq": "B",
            "8-5-a-mcq": "A",
            "8-5-b-mcq": "B",
            "concepts-q1": "C",
            "concepts-q2": "B",
            "concepts-q3": "B"
        };

        const BURGER_REWARDS = {
            "8-3-a-mcq": IconBurgerDouble,   // Comp A
            "8-3-b-mcq": IconBurgerFish,     // Comp B
            "8-5-a-mcq": IconBurgerSpicy,    // OCI A
            "8-5-b-mcq": IconBurger,         // OCI B
            "concepts-q1": IconBurgerDouble, // Concept 1
            "concepts-q2": IconBurgerFish,   // Concept 2
            "concepts-q3": IconBurgerSpicy   // Concept 3
        };

        const HINTS = {
            "expense": "Search the 10-K notes for a table titled 'Share-based compensation expense'. Look for the 2024 total.",
            "fairvalue": "Look for the 'Weighted-average assumptions' table in the Share-based Compensation note.",
            "vesting": "Read the text under the 'STOCK OPTIONS' header in the notes. Look for '...equal installments...'",
            "eps": "Use Corrected Net Income: $8,223 million. Check 10-K for weighted shares.",
            "dividends": "Annual Dividend: $6.78/share. Stock Price (Dec 31, 2024): ~$296.50.",
            "oci": "Total the items: Currency (196) + Hedges 125 + Pension (25).",
            "deriv": "Look at 'Cash flow hedges'. A gain (positive number) means the instrument's value likely increased."
        };

        const MCQ_DATA_COMP = [
            {
                id: "8-3-a-mcq",
                question: "a. How did the recognized compensation expense affect Net Income?",
                options: [
                    { key: "A", text: "It reduced net income by the expense amount (before tax). The expense is recognized on the income statement as services are rendered." },
                    { key: "B", text: "It increased net income because the company received employee services without paying any actual cash." },
                    { key: "C", text: "It had no effect on net income as it is purely an equity-based transaction recorded directly in Additional Paid-In Capital." },
                    { key: "D", text: "It reduced net income only after the options were fully vested and subsequently exercised by employees for shares." }
                ]
            },
            {
                id: "8-3-b-mcq",
                question: "b. How did the compensation expense affect Cash from Operations?",
                options: [
                    { key: "A", text: "It caused a cash outflow equal to the fair value of the options granted during the year, decreasing total operating cash flow." },
                    { key: "B", text: "It is a non-cash expense, so it is added back to Net Income in the Cash Flow from Operations section. No immediate outflow occurs." },
                    { key: "C", text: "It decreased cash from operations because the company had to buy treasury stock on the open market to cover the new option grants." },
                    { key: "D", text: "It had no effect on cash from operations and is completely omitted from the statement of cash flows because it's a financing activity." }
                ]
            }
        ];

        const MCQ_DATA_OCI = [
            {
                id: "8-5-a-mcq",
                question: "a. Based on the data, did the US Dollar strengthen or weaken against foreign currencies in 2024?",
                options: [
                    { key: "A", text: "The US Dollar strengthened. A negative translation adjustment means foreign assets translated to fewer US Dollars, resulting in a loss." },
                    { key: "B", text: "The US Dollar weakened. A negative translation adjustment means foreign assets translated to more US Dollars, resulting in a loss." },
                    { key: "C", text: "The US Dollar remained stable. The negative translation adjustment is entirely due to the settlement of long-term foreign debt." },
                    { key: "D", text: "The US Dollar fluctuated randomly. A negative translation adjustment represents realized cash losses from currency exchanges." }
                ]
            },
            {
                id: "8-5-b-mcq",
                question: "b. Did the fair value of cash flow hedges increase or decrease during 2024?",
                options: [
                    { key: "A", text: "Fair value decreased. The positive $125 million adjustment reflects cash paid out to settle derivative liabilities during the year." },
                    { key: "B", text: "Fair value increased. The positive $125 million unrealized gain indicates the derivative instruments became more valuable this year." },
                    { key: "C", text: "Fair value remained flat. The $125 million represents the amortization of the initial premium paid for the derivatives over time." },
                    { key: "D", text: "Fair value fluctuated. The positive $125 million adjustment is a reclassification of prior period losses directly into net income." }

        const MCQ_DATA_CONCEPTS = [
            {
                id: "concepts-q1",
                question: "Stock options grant the holder the right to purchase shares at a preset price, whereas restricted stock represents actual shares. What is a key difference regarding their value?",
                options: [

            {

                question: "How are stock options and restricted stock similar in terms of their impact on employee behavior?",
                options: [
                    { key: "A", text: "Both guarantee a fixed cash bonus regardless of performance." },
                    { key: "B", text: "Both provide an incentive for employees to increase the share price." },
                    { key: "C", text: "Both allow employees to sell shares immediately upon grant." },

                ]

            {
                id: "concepts-q3",
                question: "What is the primary purpose of a vesting period in share-based compensation plans?",
                options: [
                    { key: "A", text: "To allow the company to sell the stock to the public first." },
                    { key: "B", text: "To retain the employee, aligning incentives with shareholders as they must stay to 'earn' the stock." },

                    { key: "D", text: "To prevent the stock price from rising too quickly." }
                ]
            }
        ];

        // --- Math Evaluator & Smart Tolerance ---
        const evaluateMath = (str) => {
            if (typeof str !== 'string') return null;
            try {
                const sanitized = str.replace(/[^0-9+\-*/().\s]/g, '');
                if (sanitized.trim() === '') return null;
                const result = new Function('return ' + sanitized)();
                return typeof result === 'number' && !isNaN(result) ? result : null;
            } catch (e) {
                return null;
            }
        };

        const checkTolerance = (userStr, correctObj) => {
            if (userStr === undefined || userStr === '') return null;
            
            const userVal = evaluateMath(userStr);
            if (userVal === null) return false; 

            const correctVal = correctObj.val;
            
            let possibleUserVals = [userVal];
            if (correctObj.isPercent) {
                possibleUserVals.push(userVal * 100);
                possibleUserVals.push(userVal / 100);
            }

            if (correctVal === 0) {
                return possibleUserVals.some(v => Math.abs(v) < 0.01);
            }

            return possibleUserVals.some(v => {
                const diff = Math.abs((v - correctVal) / correctVal);
                return diff <= 0.01;
            });
        };

        // --- Components ---

        const Header = () => (
            <header className="bg-red-700 text-white p-4 shadow-lg flex justify-between items-center z-10 relative border-b-4 border-yellow-400">

                    <div className="bg-yellow-400 p-1.5 rounded-xl shadow-inner border border-yellow-500">

                    </div>
                    <div>

                    </div>
                </div>
                <a

        const HintBox = ({ text }) => (

                    {text}
                    <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-red-900"></div>
                </div>
            </div>
        );

        const FinEffectRow = ({ label, idPrefix, answers, handleChange, instructorMode, correctAnswers, validationMode }) => {
            const fields = [
                { key: 'cash', placeholder: 'Cash' },
                { key: 'noncash', placeholder: 'Non-Cash' },
                { key: 'liab', placeholder: 'Liabil.' },
                { key: 'cc', placeholder: 'Contrib. Cap' },
                { key: 'ec', placeholder: 'Earned Cap' },

            return (
                <div className="mb-4 p-4 bg-white border-2 border-slate-100 rounded-xl shadow-sm hover:shadow-md transition-shadow">

                    <div className="grid grid-cols-6 gap-3 items-start text-sm">
                        <div className="col-span-1 text-right font-bold text-slate-400 pr-2 pt-2 uppercase text-xs">Effect ($M):</div>
                        {fields.map(field => {
                            const fieldId = `${idPrefix}-${field.key}`;
                            const correctObj = correctAnswers[fieldId];
                            
                            const displayValue = instructorMode 
                                ? (correctObj ? correctObj.val : '')
                                : (answers[fieldId] || '');
                            
                            let borderClass = 'border-slate-200';
                            if (validationMode && !instructorMode && correctObj) {
                                const isCorrect = checkTolerance(answers[fieldId], correctObj);
                                if (isCorrect === true) borderClass = 'border-green-500 bg-green-50 text-green-900 ring-1 ring-green-500';
                                if (isCorrect === false) borderClass = 'border-red-500 bg-red-50 text-red-900 ring-1 ring-red-500';
                            }

                            return (
                                <div key={fieldId} className="relative flex flex-col items-center">
                                    <div className="relative w-full group">
                                        <input 
                                            type="text" 
                                            placeholder={field.placeholder}
                                            value={displayValue}
                                            onChange={(e) => handleChange(fieldId, e.target.value)}
                                            className={`w-full p-2 border-2 rounded-lg focus:outline-none transition-all duration-300 ${borderClass}
                                                ${instructorMode ? 'bg-green-100 border-green-500 text-green-900 font-bold' : ''}
                                                ${!instructorMode && !validationMode ? 'focus:border-yellow-400 focus:ring-4 focus:ring-yellow-100' : ''}
                                            `}
                                            disabled={instructorMode}
                                        />
                                        <span className="absolute -top-2.5 left-2 bg-white px-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider rounded">{field.placeholder}</span>
                                    </div>
                                    {instructorMode && correctObj && (
                                        <div className="mt-1.5 text-[11px] text-green-700 font-mono font-bold tracking-tighter whitespace-nowrap overflow-hidden text-ellipsis w-full text-center bg-green-50 rounded px-1">

                                    )}

        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('equity');
            const [answers, setAnswers] = useState({});
            const [instructorMode, setInstructorMode] = useState(false);
            const [showAuth, setShowAuth] = useState(false);
            const [password, setPassword] = useState('');
            const [validationMode, setValidationMode] = useState(false);

            const handleInputChange = (id, value) => {
                setAnswers(prev => ({ ...prev, [id]: value }));
                if (validationMode) setValidationMode(false); 
            };

            useEffect(() => {
                if (password.toLowerCase() === 'teacher') {
                    setInstructorMode(true);
                    setShowAuth(false);
                    setPassword('');
                    setValidationMode(false);
                }
            }, [password]);

            const getInputProps = (id) => {
                const correctObj = CORRECT_ANSWERS[id];
                let borderClass = 'border-slate-200';
                
                if (validationMode && !instructorMode && correctObj) {
                    const isCorrect = checkTolerance(answers[id], correctObj);
                    if (isCorrect === true) borderClass = 'border-green-500 bg-green-50 text-green-900 ring-1 ring-green-500';
                    if (isCorrect === false) borderClass = 'border-red-500 bg-red-50 text-red-900 ring-1 ring-red-500';
                }

                return {
                    value: instructorMode 
                        ? (correctObj ? correctObj.val : '')
                        : (answers[id] || ''),
                    disabled: instructorMode,
                    className: `w-full p-2.5 border-2 rounded-lg transition-all duration-300 font-medium ${borderClass} ${
                        instructorMode 
                        ? 'bg-green-100 border-green-500 text-green-900 font-bold' 
                        : (!validationMode ? 'bg-white focus:border-yellow-400 focus:ring-4 focus:ring-yellow-100 outline-none' : 'outline-none')
                    }`

                            <div className="flex space-x-3">
                                <button onClick={downloadReport} disabled={Object.keys(answers).length === 0 && !instructorMode} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold transition-colors ${(Object.keys(answers).length > 0 || instructorMode) ? 'bg-red-600 text-white hover:bg-red-700 shadow-md' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}><span className="mr-2"><IconDownload /></span>Download Report</button>
                                <button onClick={() => setValidationMode(!validationMode)} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold transition-colors ${validationMode ? 'bg-yellow-400 text-red-900 hover:bg-yellow-500 shadow-md ring-2 ring-yellow-500 ring-offset-1' : 'bg-white border-2 border-slate-200 text-slate-600 hover:border-yellow-400 hover:text-red-700'}`}><span className="mr-2"><IconCheck /></span>Check Work</button>
                            </div>
                            
                            <div className="relative group">
                                <button 
                                    onClick={() => {
                                        if (instructorMode) {
                                            setInstructorMode(false);
                                            setAnswers({}); // Clear answers when turning off
                                            setValidationMode(false);
                                        } else {
                                            setShowAuth(!showAuth);
                                        }
                                    }} 
                                    className={`flex items-center space-x-2 p-2.5 rounded-xl transition-colors font-bold ${instructorMode ? 'text-red-700 bg-red-100 border border-red-200 shadow-inner hover:bg-red-200' : 'text-slate-400 hover:bg-red-50 hover:text-red-600'}`}
                                >
                                    <IconKey />
                                    <span className="text-xs uppercase tracking-wider">{instructorMode ? 'Turn Off & Clear' : 'Instructor'}</span>
                                </button>
                                {showAuth && !instructorMode && (
                                    <div className="absolute bottom-full right-0 mb-3 w-64 bg-white p-4 rounded-xl shadow-2xl border-2 border-red-100 z-50 animate-slideUp">
                                        <div className="text-xs font-black text-red-800 mb-3 uppercase tracking-wider">Instructor Access</div>
                                        <input 
                                            type="password" 
                                            placeholder="Enter Password" 
                                            className="w-full text-sm p-2.5 border-2 border-slate-200 rounded-lg mb-2 focus:border-yellow-400 focus:ring-4 focus:ring-yellow-100 outline-none font-medium transition-all" 
                                            value={password} 
                                            onChange={(e) => setPassword(e.target.value)} 
                                            autoFocus 
                                        />
                                        <div className="text-[10px] text-slate-400 font-medium">Unlocks automatically upon correct password.</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
