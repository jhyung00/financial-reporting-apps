                        { id: "x_bs_common", label: "Common stock, $10 par value, 200,000 shares authorized; 78,000 shares issued, ( 3,000 shares in treasury)", type: "currency", fullWidth: true },
                        { id: "x_bs_total_paid_in", label: "Total paid-in capital", type: "currency", fullWidth: true }
                    ]},
                    { subtitle: "Additional Paid-in Capital", fields: [
                        { id: "x_bs_apic_pref", label: "Paid-in capital in excess of par value—preferred stock", type: "currency", fullWidth: true },
                        { id: "x_bs_apic_common", label: "Paid-in capital in excess of par value—common stock", type: "currency", fullWidth: true },
                        { id: "x_bs_apic_treasury", label: "Paid-in capital from treasury stock", type: "currency", fullWidth: true },
                        { id: "x_bs_total_apic", label: "Total additional paid-in capital", type: "currency", fullWidth: true }
                    ]},
                    { subtitle: "Retained Earnings", fields: [
                        { id: "x_bs_re", label: "Retained earnings", type: "currency", fullWidth: true }
                    ]},
                    { subtitle: "Treasury Stock", fields: [
                        { id: "x_bs_treasury", label: "Treasury stock (3,000 common shares) at cost", type: "currency", fullWidth: true, hint: "Enter as negative number" }
                    ]},
                    { subtitle: "Total", fields: [
                        { id: "x_bs_total_se", label: "Total stockholders’ equity", type: "currency", fullWidth: true }
                    ]}
                ]
            }
        ];

        // --- COMPONENTS ---

        const Icon = ({ name, size = 18, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    ref.current.appendChild(i);
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, "stroke-width": 2 }
                    });
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center align-middle ${className}`} style={{ width: size, height: size }}></span>;
        };

        const ConfirmationModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/40 z-[100] flex items-center justify-center backdrop-blur-md animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 m-4 transform transition-all border border-slate-100">
                        <div className="flex items-center gap-4 text-rose-500 mb-4 bg-rose-50 p-4 rounded-xl">
                            <Icon name="alert-triangle" size={28} />
                            <h3 className="text-xl font-bold font-display text-rose-700">{title}</h3>
                        </div>
                        <p className="text-slate-600 mb-8 leading-relaxed">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-5 py-2.5 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl transition-colors">Cancel</button>
                            <button onClick={onConfirm} className="px-5 py-2.5 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 shadow-lg shadow-rose-500/30 transition-all transform hover:-translate-y-0.5">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Sparkline = ({ data, color = "#6366f1" }) => {
            const height = 40;
            const width = 100;
            const padding = 5;
            const min = Math.min(...data, 0);
            const max = Math.max(...data);
            const range = max - min || 1;
            const points = data.map((d, i) => {
                const x = (i / (data.length - 1)) * (width - 2 * padding) + padding;
                const y = height - ((d - min) / range) * (height - 2 * padding) - padding;
                return `${x},${y}`;
            }).join(" ");

            return (
                <div className="flex flex-col items-center">
                    <svg width={width} height={height} className="overflow-visible">
                        <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                        {data.map((d, i) => {
                            const x = (i / (data.length - 1)) * (width - 2 * padding) + padding;
                            const y = height - ((d - min) / range) * (height - 2 * padding) - padding;
                            return <circle key={i} cx={x} cy={y} r="3" fill={color} className="shadow-sm" />;
                        })}
                    </svg>
                    <div className="flex justify-between w-full text-[10px] font-semibold text-slate-400 mt-2 px-1 uppercase tracking-wider">
                        <span>2YR</span><span>PRI</span><span>CUR</span>
                    </div>
                </div>
            );
        };

        const SmartInput = ({ id, value, onChange, correctValue, label, type, hint, instructorMode, activeInput, setActiveInput, isTable, options, acctValue, onAcctChange, correctAcct, fullWidth, explanation, optionsList }) => {
            const [localError, setLocalError] = useState(null);
            const isActive = activeInput === id;
            
            const evaluateMath = (expr) => {
                if (!expr) return { valid: true, val: "" };
                try {
                    const sanitized = expr.toString().replace(/,/g, '').replace(/(\d+(\.\d+)?)%/g, '($1/100)');
                    if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(sanitized)) return { valid: false, msg: "Invalid chars" };
                    const res = new Function('return ' + sanitized)();
                    if (!isFinite(res) || isNaN(res)) return { valid: false, msg: "Math Error" };
                    return { valid: true, val: res };
                } catch (e) {
                    return { valid: false, msg: "Syntax Error" };
                }
            };

            const isAmountCorrect = useMemo(() => {
                if (!value || !correctValue) return false;
                
                // Text matching logic (including exact select string matching)
                if (type === 'text' || type === 'select') {
                    const cleanVal = value.toString().trim().toLowerCase().replace(/[.,]$/, ""); 
                    const keys = correctValue.toString().toLowerCase().split('|').map(k => k.trim().replace(/[.,]$/, ""));
                    
                    // Exact match checking for robust OCI evaluation
                    return keys.some(cleanKey => cleanVal === cleanKey);
                }

                const { valid, val } = evaluateMath(value);
                if (!valid) return false;
                
                const target = parseFloat(correctValue.replace(/,/g, ''));
                let inputNum = parseFloat(val);
                
                if (type === 'percent' || type === 'decimal') {
                   const diffExact = Math.abs(inputNum - target);
                   const diffPercent = Math.abs((inputNum / 100) - target);
                   const diffPercentReverse = Math.abs((inputNum * 100) - target);
                   return (diffExact <= Math.max(Math.abs(target * 0.02), 0.01)) || 
                          (diffPercent <= Math.max(Math.abs(target * 0.02), 0.001)) ||
                          (diffPercentReverse <= Math.max(Math.abs(target * 0.02), 0.1));
                } else {
                    const tolerance = Math.max(Math.abs(target * 0.02), 0.1); 
                    return Math.abs(inputNum - target) <= tolerance;
                }
            }, [value, correctValue, type]);

            const isAcctCorrect = useMemo(() => {
                if (!options) return true;
                if (!acctValue || !correctAcct) return false;
                return acctValue === correctAcct;
            }, [acctValue, correctAcct, options]);

            const isFullyCorrect = options ? (isAmountCorrect && isAcctCorrect) : isAmountCorrect;

            const handleBlurOrEnter = (e) => {
                if (type === 'text' || type === 'select') return;
                if (!value) return;

                const { valid, val } = evaluateMath(value);
                if (!valid) { setLocalError("Invalid Math"); return; }
                setLocalError(null);
                
                if (valid && val !== undefined && val !== null) {
                     const numVal = Number(val);
                     let displayVal = numVal;
                     if (type === 'percent') {
                        const target = parseFloat(correctValue || "0");
                        if (Math.abs(numVal) <= 1 && target > 1) { displayVal = (numVal * 100).toFixed(1); }
                        else { displayVal = numVal.toFixed(1); }
                     } else {
                        displayVal = Number.isInteger(numVal) ? numVal.toString() : numVal.toFixed(2);
                     }
                     onChange(id, displayVal.toString()); 
                }
            };

            // Custom Select Rendering
            if (type === 'select' && optionsList) {
                return (
                    <div className={`${isTable ? "w-full min-w-[140px]" : "mb-4 w-full"}`}>
                        {!isTable && <label className="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-widest">{label}</label>}
                        <div className="relative">
                            <select
                                id={id}
                                value={value || ""}
                                onChange={(e) => { setLocalError(null); onChange(id, e.target.value); }}
                                className={`w-full p-3.5 text-sm rounded-xl font-medium shadow-sm transition-all appearance-none pr-10 focus:ring-4 focus:ring-indigo-500/20 outline-none ${
                                    isFullyCorrect ? "bg-emerald-50 border border-emerald-300 text-emerald-800 font-semibold" : 
                                    (value && !isActive && !isFullyCorrect) ? "bg-rose-50 border border-rose-300 text-rose-800" : 
                                    "bg-white border border-slate-200 text-slate-700"
                                }`}
                            >
                                <option value="">Select your answer...</option>
                                {optionsList.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                            <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                                {isFullyCorrect ? <span className="text-emerald-500"><Icon name="check-circle" size={18} /></span> : 
                                 <Icon name="chevron-down" size={16} className="text-slate-400" />}
                            </div>
                        </div>
                        {/* Instructor Feedback Block */}
                        {(isFullyCorrect || instructorMode) && explanation && (
                            <div className={`mt-2 p-2 text-[11px] leading-relaxed rounded-lg border-l-4 shadow-sm animate-fade-in ${isFullyCorrect ? "bg-emerald-50/50 border-emerald-400 text-emerald-900" : "bg-purple-50/50 border-purple-400 text-purple-900"}`}>
                               {instructorMode && !isTable && <div className="font-bold mb-1 uppercase tracking-widest text-[9px] flex items-center gap-1"><Icon name="graduation-cap" size={12}/> Instructor Solution</div>}
                               <div className="whitespace-pre-line font-mono">{explanation}</div>
                            </div>
                        )}
                        {instructorMode && correctValue && !explanation && (
                            <div className="mt-2 bg-purple-50 border border-purple-100 text-purple-800 text-[10px] p-2 rounded-lg font-mono font-semibold animate-fade-in flex items-center gap-2">
                                <Icon name="key" size={12} /> Key: {correctValue}
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className={`${isTable ? "w-full min-w-[140px]" : "mb-4 w-full"}`}>
                    {!isTable && <label className="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-widest">{label}</label>}
                    <div className="flex flex-col gap-1.5 relative group">
                        {options && (
                            <select
                                value={acctValue || ""}
                                onChange={(e) => onAcctChange(id + "_acct", e.target.value)}
                                className={`w-full text-[11px] p-1.5 border rounded-lg bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500/20 font-medium ${
                                    acctValue && !isAcctCorrect ? "border-rose-300 text-rose-600 bg-rose-50" : "border-slate-200 text-slate-700 hover:bg-slate-100"
                                }`}
                            >
                                <option value="">Select Account...</option>
                                {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                        )}
                        <div className="relative flex-grow">
                            <input 
                                type="text" 
                                id={id}
                                value={value || ""}
                                onChange={(e) => { setLocalError(null); onChange(id, e.target.value); }}
                                onFocus={() => setActiveInput(id)}
                                onBlur={handleBlurOrEnter}
                                onKeyDown={(e) => {
                                    if (e.key === 'Enter') {
                                        e.preventDefault();
                                        handleBlurOrEnter(e);
                                        e.target.blur();
                                    }
                                }}
                                className={`w-full ${isTable ? "p-2 text-xs" : "p-3.5 pr-10 text-sm"} border rounded-xl font-mono shadow-sm transition-all focus:ring-4 outline-none ${
                                    isFullyCorrect ? "bg-emerald-50 border-emerald-400 text-emerald-800 font-semibold focus:ring-emerald-500/20" : 
                                    (value && !isActive && !isFullyCorrect) ? "bg-rose-50 border-rose-300 text-rose-800 focus:ring-rose-500/20" : 
                                    "bg-white border-slate-200 focus:border-indigo-400 focus:ring-indigo-500/20"
                                }`}
                                placeholder={isTable ? (type === 'percent' ? "%" : "0") : (type === 'text' ? "Type answer..." : "Calculate...")}
                            />
                            {!isTable && !options && type !== 'text' && (
                                <div className="absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none transition-colors">
                                    {isFullyCorrect ? <span className="text-emerald-500"><Icon name="check-circle" size={18} /></span> : 
                                    localError ? <span className="text-rose-500 font-bold font-sans text-lg">!</span> :
                                    <Icon name="calculator" size={16} className="text-slate-300 group-hover:text-indigo-400" />}
                                </div>
                            )}
                        </div>
                        {hint && !isTable && (
                            <div className="w-1/3 shrink-0 bg-indigo-50 border border-indigo-100/50 rounded-xl p-2.5 flex flex-col justify-center min-h-[48px]">
                                <span className="text-[9px] text-indigo-500 font-bold uppercase tracking-widest block mb-0.5 flex items-center gap-1"><Icon name="info" size={10} /> Hint</span>
                                <span className="text-xs text-indigo-900 font-medium leading-tight">{hint}</span>
                            </div>
                        )}
                    </div>
                    {localError && !isTable && <p className="text-[11px] text-rose-500 mt-1.5 font-medium flex items-center gap-1"><Icon name="alert-circle" size={12}/> {localError}</p>}
                    
                    {/* FEEDBACK SECTION */}
                    {(isFullyCorrect || instructorMode) && explanation && (
                        <div className={`mt-2 p-2.5 text-[11px] leading-relaxed rounded-xl border-l-4 shadow-sm animate-fade-in ${isFullyCorrect ? "bg-emerald-50/50 border-emerald-400 text-emerald-900" : "bg-purple-50/50 border-purple-400 text-purple-900"}`}>
                           {instructorMode && !isTable && <div className="font-bold mb-1 uppercase tracking-widest text-[9px] flex items-center gap-1"><Icon name="graduation-cap" size={12}/> Instructor Solution</div>}
                           <div className="whitespace-pre-line font-mono">{explanation}</div>
                        </div>
                    )}
                    
                    {instructorMode && (correctValue || correctAcct) && !explanation && (
                        <div className="mt-2 bg-purple-50 border border-purple-100 text-purple-800 text-[10px] p-2 rounded-lg font-mono font-semibold animate-fade-in truncate flex items-center gap-2">
                            <Icon name="key" size={12} /> {options && correctAcct ? `[${correctAcct}] ` : ""}Key: {correctValue}
                        </div>
                    )}
                </div>
            );
        };

        const RatioTable = ({ tables, inputs, handleInputChange, activeKey, instructorMode, activeInput, setActiveInput, explanationMap }) => {
            const [showChart, setShowChart] = useState(false);
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {tables.map((table, tIdx) => (
                        <div key={tIdx} className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white flex flex-col hover:border-indigo-200 transition-colors">
                            <div className="bg-gradient-to-r from-slate-50 to-white p-4 border-b border-slate-100 flex justify-between items-center">
                                <h3 className="font-bold font-display text-slate-800 text-sm flex items-center gap-2">
                                    <Icon name="pie-chart" size={16} className="text-indigo-500" />
                                    {table.title}
                                    <button onClick={() => setShowChart(!showChart)} className={`p-1.5 rounded-lg transition-all ${showChart ? 'text-indigo-600 bg-indigo-100 shadow-sm' : 'text-slate-400 hover:bg-slate-100'}`} title="Toggle Trend Chart">
                                        <Icon name="line-chart" size={14} />
                                    </button>
                                </h3>
                                <div className="text-[10px] text-indigo-600 bg-indigo-50/80 px-2.5 py-1 rounded-md border border-indigo-100 font-mono font-bold uppercase tracking-widest">
                                    {table.hint}
                                </div>
                            </div>
                            <div className="flex flex-1 overflow-x-auto custom-scrollbar">
                                <div className="flex-1 p-5 min-w-[300px]">
                                    <table className="w-full text-sm">
                                        <thead className="text-slate-400 text-[10px] uppercase tracking-widest border-b-2 border-slate-100">
                                            <tr>
                                                <th className="pb-3 text-left font-bold">{table.headers[0]}</th>
                                                <th className="pb-3 text-right font-bold">{table.headers[1]}</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {table.rows.map((row, rIdx) => (
                                                <tr key={rIdx} className="group">
                                                    <td className="py-3 font-semibold text-slate-600 text-xs align-middle group-hover:text-indigo-600 transition-colors">{row.label}</td>
                                                    <td className="py-2 pl-4 align-top">
                                                        <SmartInput
                                                            id={row.id}
                                                            value={inputs[row.id]}
                                                            onChange={handleInputChange}
                                                            correctValue={activeKey[row.id]}
                                                            instructorMode={instructorMode}
                                                            activeInput={activeInput}
                                                            setActiveInput={setActiveInput}
                                                            isTable={true}
                                                            type="percent"
                                                            explanation={explanationMap ? explanationMap[row.id] : null}
                                                        />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                {showChart && (
                                    <div className="w-36 bg-slate-50/50 border-l border-slate-100 flex flex-col items-center justify-center p-5 animate-fade-in">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Trend</span>
                                        <Sparkline data={CHART_DATA[table.chartKey]} color="#6366f1" />
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const ReferenceTable = ({ title, headers, rows, onValueClick, isMain }) => {
            const [isOpen, setIsOpen] = useState(true);
            const renderInteractiveCell = (text) => {
                if (typeof text !== 'string') return text;
                const parts = text.split(/([$]?\d[\d,\.]*%?)/g);
                return parts.map((part, i) => {
                    if (/[\d]/.test(part) && onValueClick) {
                        return (
                            <span key={i} onClick={(e) => { e.stopPropagation(); onValueClick(part); }} 
                                className="cursor-pointer text-indigo-600 font-bold hover:bg-indigo-100 hover:text-indigo-800 rounded px-1 py-0.5 transition-all"
                                title="Click to insert value">
                                {part}
                            </span>
                        );
                    }
                    return <span key={i}>{part}</span>;
                });
            };

            return (
                <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-5 ${isMain ? 'w-full ring-1 ring-slate-900/5' : ''}`}>
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 bg-gradient-to-r from-slate-50 to-white border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <h4 className="font-bold font-display text-slate-700 text-sm flex items-center gap-2.5">
                            <div className="bg-white shadow-sm p-1.5 rounded-lg border border-slate-100 text-indigo-500">
                                <Icon name="table" size={16} />
                            </div>
                            {title}
                        </h4>
                        <div className={`p-1 rounded-md transition-transform duration-200 ${isOpen ? 'rotate-180 bg-slate-100 text-slate-600' : 'bg-white text-slate-400 border border-slate-200'}`}>
                            <Icon name="chevron-down" size={16} />
                        </div>
                    </button>
                    {isOpen && (
                        <div className={`overflow-x-auto custom-scrollbar ${isMain ? '' : 'max-h-80'}`}>
                            <table className="w-full text-xs text-left">
                                <thead className="bg-slate-50/80 text-slate-500 uppercase tracking-widest sticky top-0 shadow-sm z-10 backdrop-blur-md">
                                    <tr>{headers.map((h, i) => <th key={i} className={`p-3 border-b border-slate-200 font-semibold ${i > 0 ? "text-right" : ""}`}>{h}</th>)}</tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {rows.map((row, rI) => (
                                        <tr key={rI} className="hover:bg-indigo-50/40 transition-colors group">
                                            <td className="p-3 font-semibold text-slate-700 border-r border-slate-50 min-w-[150px] group-hover:text-indigo-900">{row[0]}</td>
                                            {row.slice(1).map((cell, cI) => (
                                                <td key={cI} className="p-3 text-right font-mono text-slate-600 whitespace-nowrap">
                                                    {renderInteractiveCell(cell)}
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        };

        const FSETable = ({ config, inputs, handleInputChange, activeKey, instructorMode, activeInput, setActiveInput }) => {
            return (
                <div className="overflow-x-auto border border-slate-200 rounded-2xl shadow-sm custom-scrollbar ring-1 ring-slate-900/5">
                    <table className="w-full text-sm">
                        <thead className="bg-gradient-to-b from-slate-50 to-slate-100 text-slate-700 font-bold border-b border-slate-200">
                            <tr>
                                <th className="p-4 text-left sticky left-0 bg-slate-50 min-w-[200px] border-r border-slate-200 shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)] z-20 font-display">Transaction</th>
                                {config.columns.map(col => (
                                    <th key={col.key} className="p-4 text-center min-w-[130px] whitespace-normal leading-tight font-display">
                                        {col.label}
                                        <div className="text-[9px] font-bold text-indigo-500 uppercase mt-1.5 tracking-widest">{col.type}</div>
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {config.transactions.map((txn, idx) => (
                                <tr key={txn.id} className={idx % 2 === 0 ? "bg-white hover:bg-slate-50/50" : "bg-slate-50/30 hover:bg-slate-50/80"}>
                                    <td className="p-4 font-semibold text-slate-700 border-r border-slate-100 sticky left-0 bg-inherit shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)] z-10 transition-colors">
                                        {txn.label}
                                    </td>
                                    {config.columns.map(col => {
                                        const inputId = `${txn.id}_${col.key}`;
                                        return (
                                            <td key={col.key} className="p-2.5 align-top">
                                                <SmartInput
                                                    id={inputId}
                                                    value={inputs[inputId]}
                                                    onChange={handleInputChange}
                                                    correctValue={activeKey[inputId]}
                                                    options={col.options}
                                                    acctValue={inputs[inputId + "_acct"]}
                                                    onAcctChange={handleInputChange}
                                                    correctAcct={activeKey[inputId + "_acct"]}
                                                    instructorMode={instructorMode}
                                                    activeInput={activeInput}
                                                    setActiveInput={setActiveInput}
                                                    isTable={true}
                                                    type="currency"
                                                />
                                            </td>
                                        );
                                    })}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('sysco'); // Start on sysco to show off the multiple choice
            const [inputs, setInputs] = useState({});
            const [activeInput, setActiveInput] = useState(null);
            const [sidebarWidth, setSidebarWidth] = useState(320); 
            const [isResizing, setIsResizing] = useState(false);
            
            // Instructor State
            const [instructorMode, setInstructorMode] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState("");

            const [verifiedResult, setVerifiedResult] = useState(null);
            const [studentName, setStudentName] = useState("");
            const [showDownload, setShowDownload] = useState(false);

            const stopResizing = useCallback(() => setIsResizing(false), []);
            const resize = useCallback((mouseMoveEvent) => {
                if (isResizing) {

                    if (newWidth > 200 && newWidth < 800) {

                    }
                }

            useEffect(() => {

                window.addEventListener('mouseup', stopResizing);

                    window.removeEventListener('mousemove', resize);
                    window.removeEventListener('mouseup', stopResizing);
                };

            // Data getters
            const getActiveData = () => {
                switch(activeTab) {
                    case 'campbell': return CAMPBELL_DATA;
                    case 'sysco': return SYSCO_DATA;
                    case 'xpress': return XPRESS_DATA;
                    default: return CAMPBELL_DATA;
                }

            const activeData = getActiveData();
            
            const sidebarTables = activeData.tables.filter(tbl => tbl.placement !== 'main');
            const mainTables = activeData.tables.filter(tbl => tbl.placement === 'main');

            const getActiveQuestions = () => {
                switch(activeTab) {
                    case 'campbell': return CAMPBELL_QUESTIONS;
                    case 'sysco': return SYSCO_QUESTIONS;
                    case 'xpress': return XPRESS_QUESTIONS;
                    default: return [];
                }
            };
            const activeQuestions = getActiveQuestions();

            const getActiveKey = () => {
                switch(activeTab) {
                    case 'campbell': return CAMPBELL_ANSWER_KEY;
                    case 'sysco': return SYSCO_ANSWER_KEY;
                    case 'xpress': return XPRESS_ANSWER_KEY;
                    default: return {};
                }
            };
            const activeKey = getActiveKey();

            const getExplanations = () => {
                switch(activeTab) {
                    case 'campbell': return CAMPBELL_EXPLANATIONS;
                    case 'sysco': return SYSCO_EXPLANATIONS;
                    case 'xpress': return XPRESS_EXPLANATIONS;
                    default: return {};
                }
            }
            const activeExplanations = getExplanations();

            const handleInputChange = (id, val) => setInputs(prev => ({ ...prev, [id]: val }));

            // Smart Number Replacement Logic
            const handleValueClick = (val) => {
                if (!activeInput) return;
                const cleanVal = val.replace(/,/g, '').replace(/[()]/g, (m) => m === '(' ? '-' : '').replace(/\$/g, '');
                
                setInputs(prev => {
                    const cur = (prev[activeInput] || "").toString();
                    const endsWithOperator = /[+\-*/(]\s*$/;
                    const endsWithNumber = /(-?\d*\.?\d+)$/;
                    let newVal = cur;
                    if (cur === "") {
                        newVal = cleanVal;
                    } else if (endsWithOperator.test(cur)) {
                        newVal = cur + cleanVal;
                    } else {
                        newVal = cur.replace(endsWithNumber, cleanVal);
                    }
                    return { ...prev, [activeInput]: newVal };
                });
                
                setTimeout(() => {
                    const el = document.getElementById(activeInput);
                    if (el) {
                        el.focus();
                        const len = el.value.length;
                        el.setSelectionRange(len, len);
                    }
                }, 50);
            };

            const unlockInstructor = () => {
                if (password.toLowerCase() === "teacher") {
                    setInstructorMode(true);
                    setShowLogin(false);
                    setPassword("");
                } else {
                    alert("Incorrect Password");
                }
            };

            const handleAutoFill = () => {
                setInputs(prev => ({ ...prev, ...activeKey }));
            };

            const handleClearConfirm = () => {
                setInputs({});
                setClearModalOpen(false);
                setInstructorMode(false); 
            };

            const verifyHash = () => {
                try {
                    const decoded = atob(hashInput);
                    const data = JSON.parse(decoded);
                    setVerifiedResult(data);
                } catch (e) {
                    setVerifiedResult({ error: "Invalid Hash" });
                }
            };

            const handleDownload = () => {
                const timestamp = new Date().toLocaleString();
                let correctCount = 0;
                let totalCount = 0;
                
                Object.keys(activeKey).forEach(key => {
                    totalCount++;
                    const userVal = (inputs[key] || "").toString().trim().toLowerCase();
                    const keyVal = (activeKey[key] || "").toString().trim().toLowerCase();
                    let isCorrect = false;
                    
                    if(!isNaN(parseFloat(keyVal)) && !isNaN(parseFloat(userVal.replace(/,/g,'')))) {
                         const u = parseFloat(userVal.replace(/,/g,''));
                         const k = parseFloat(keyVal);
                         if (Math.abs(u-k) < Math.max(k*0.02, 0.5)) isCorrect = true;
                    } else {
                        // Support string matching specifically (e.g. OCI)
                        const keys = keyVal.split('|').map(x => x.trim().replace(/[.,]$/,""));
                        if (keys.some(cleanKey => userVal === cleanKey || userVal.includes(cleanKey))) {
                            isCorrect = true;
                        }
                    }
                    if (isCorrect) correctCount++;
                });
                
                const verificationHash = btoa(JSON.stringify({ name: studentName, score: `${correctCount}/${totalCount}`, date: new Date().toISOString(), module: activeTab }));

                const content = `
FINANCIAL SIMULATION REPORT: ${activeTab.toUpperCase()}
-------------------------------------
Student: ${studentName}
Date: ${timestamp}
Score: ${correctCount} / ${totalCount}
Verification Hash: ${verificationHash}

ANSWERS SUBMITTED (${activeTab}):
-------------------------------------
${Object.keys(activeKey).map(k => `${k}: ${inputs[k] || "[Empty]"}`).join('\n')}
                `.trim();

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${studentName.replace(/\s+/g, '_')}_${activeTab}_Submission.txt`;
                a.click();
                setShowDownload(false);

            return (

                                {activeQuestions.map((q, qIndex) => (

                                        {q.type === 'fse_table' ? (

                                                <div className="flex items-center flex-wrap gap-2">
                                                    The company reports other comprehensive losses in the current year and two years prior and a gain in the prior year. These losses and gain are relatively
                                                    <select

                                                        className={`border rounded-lg px-3 py-1.5 text-sm font-bold shadow-sm transition-colors outline-none focus:ring-2 focus:ring-indigo-500/20 ${inputs["s_interp_mag"] === activeKey["s_interp_mag"] ? "text-emerald-700 border-emerald-300 bg-emerald-50" : inputs["s_interp_mag"] ? "text-rose-700 border-rose-300 bg-rose-50" : "border-slate-300 bg-white"}`}

                                                        className={`border rounded-lg px-3 py-1.5 text-sm font-bold shadow-sm transition-colors outline-none focus:ring-2 focus:ring-indigo-500/20 ${inputs["s_interp_impact"] === activeKey["s_interp_impact"] ? "text-emerald-700 border-emerald-300 bg-emerald-50" : inputs["s_interp_impact"] ? "text-rose-700 border-rose-300 bg-rose-50" : "border-slate-300 bg-white"}`}
                                                    >
                                                        <option value="">Select...</option>
                                                        <option value="are">are</option>
                                                        <option value="are not">are not</option>
                                                    </select>
                                                    impactful.
                                                </div>
                                                
                                                {(instructorMode || (inputs["s_interp_mag"] === activeKey["s_interp_mag"] && inputs["s_interp_impact"] === activeKey["s_interp_impact"])) && (
                                                    <div className="mt-4 p-4 text-xs bg-purple-50 border-l-4 border-purple-500 text-purple-900 rounded-r-xl shadow-sm animate-fade-in leading-relaxed">
                                                        <div className="font-bold mb-2 opacity-75 uppercase tracking-widest text-[10px] flex items-center gap-1.5"><Icon name="graduation-cap" size={14}/> Instructor Solution</div>
                                                        {activeExplanations["s_interp_mag"]}
                                                    </div>

                                            </div>
                                        ) : (

                                                {q.sections && q.sections.map((sec, idx) => (

                                <input 
                                    type="password" 
                                    className="w-full border border-slate-200 p-4 rounded-xl mb-6 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 font-medium transition-all" 
                                    placeholder="Enter password"
                                    value={password} 
                                    onChange={(e) => setPassword(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && unlockInstructor()}
                                    autoFocus
                                />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowLogin(false)} className="px-5 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold transition-colors">Cancel</button>
                                    <button onClick={unlockInstructor} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5">Unlock</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Download Modal */}
                    {showDownload && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center animate-fade-in">
                            <div className="bg-white p-10 rounded-3xl shadow-2xl w-[400px] border border-slate-100">
                                <div className="text-center mb-8">
                                    <div className="bg-gradient-to-br from-indigo-100 to-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 text-indigo-600 shadow-inner">
                                        <Icon name="download-cloud" size={32} />
                                    </div>
                                    <h3 className="text-2xl font-bold font-display text-slate-800 tracking-tight">Export Assignment</h3>
                                    <p className="text-slate-500 text-sm mt-2 font-medium">Enter your name to generate and sign your submission file.</p>
                                </div>
                                <input 
                                    type="text" 
                                    value={studentName} 
                                    onChange={(e) => setStudentName(e.target.value)} 
                                    placeholder="Your Full Name" 
                                    className="w-full p-4 border-2 border-slate-100 rounded-xl mb-6 text-center focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none font-bold text-slate-700 text-lg transition-all"
                                    autoFocus 
                                />
                                <div className="flex flex-col gap-3">
                                    <button 
                                        onClick={() => studentName.trim() ? handleDownload() : alert("Name required")} 
                                        className="w-full py-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl font-bold hover:from-indigo-700 hover:to-blue-700 shadow-lg shadow-indigo-500/30 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2 text-lg"
                                    >
                                        <Icon name="file-down" size={20} /> Save to Device
                                    </button>
                                    <button onClick={() => setShowDownload(false)} className="w-full py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold transition-colors">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Clear Confirmation Modal */}
                    <ConfirmationModal 
                        isOpen={clearModalOpen}
                        title="Clear All & Exit?"
                        message="This will remove all student answers and lock Instructor Mode. This action cannot be undone."
                        onConfirm={handleClearConfirm}
                        onCancel={() => setClearModalOpen(false)}
                    />

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
