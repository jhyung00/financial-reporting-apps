<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Debt & Valuation Analysis Suite</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Gamified Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#1e293b', 900: '#0f172a' },
                        blue: { 950: '#172554' },
                        emerald: { 450: '#10b981' }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        game: ['Fredoka', 'sans-serif'],
                    },
                    cursor: {
                        'col-resize': 'col-resize',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc; /* Very light subtle slate */
            color: #334155;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .game-font {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Soft Light Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Chunky Playful Buttons - Light Theme */
        .btn-game {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
        }
        .btn-primary {
            background-color: #3b82f6; color: white;
            box-shadow: 0 4px 0 0 #2563eb;
            border: 2px solid #2563eb;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 0px 0 0 #2563eb; margin-bottom: 4px; }
        
        .btn-success {
            background-color: #10b981; color: white;
            box-shadow: 0 4px 0 0 #059669;
            border: 2px solid #059669;
        }
        .btn-success:active { transform: translateY(4px); box-shadow: 0 0px 0 0 #059669; margin-bottom: 4px; }

        .btn-danger {
            background-color: #f43f5e; color: white;
            box-shadow: 0 4px 0 0 #e11d48;
            border: 2px solid #e11d48;
        }
        .btn-danger:active { transform: translateY(4px); box-shadow: 0 0px 0 0 #e11d48; margin-bottom: 4px; }

        .btn-ghost {
            background-color: #f1f5f9; color: #64748b;
            box-shadow: 0 4px 0 0 #e2e8f0;
            border: 2px solid #e2e8f0;
        }
        .btn-ghost:hover { background-color: #e2e8f0; color: #475569; }
        .btn-ghost:active { transform: translateY(4px); box-shadow: 0 0px 0 0 #e2e8f0; margin-bottom: 4px; }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Calculator Styles - Soft Toy Look */
        .calc-btn {
            background-color: #ffffff;
            color: #475569;
            font-weight: 800;
            border-radius: 12px;
            padding: 10px 0;
            text-align: center;
            font-size: 1rem;
            transition: all 0.1s;
            border: 2px solid #e2e8f0;
            border-bottom: 4px solid #cbd5e1;
            font-family: 'Nunito', sans-serif;
        }
        .calc-btn:hover { background-color: #f8fafc; transform: translateY(-1px); border-bottom-width: 5px; }
        .calc-btn:active { transform: translateY(3px); border-bottom-width: 1px; margin-bottom: 3px; }
        .calc-btn.op { background-color: #f0f9ff; color: #0284c7; border-color: #bae6fd; border-bottom-color: #7dd3fc; }
        .calc-btn.eq { background-color: #ecfdf5; color: #059669; border-color: #a7f3d0; border-bottom-color: #34d399; }
        .calc-btn.clear { background-color: #fff1f2; color: #e11d48; border-color: #fecdd3; border-bottom-color: #fb7185; }

        /* Inputs */
        .input-correct {
            border-color: #34d399 !important;
            color: #065f46 !important;
            background-color: #ecfdf5 !important;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Drag Handle */
        .resizer {
            width: 6px;
            cursor: col-resize;
            background-color: #f1f5f9;
            transition: background-color 0.2s;
            z-index: 50;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
        }
        .resizer:hover, .resizer.active {
            background-color: #bfdbfe;
            border-color: #93c5fd;
        }

        /* Anti-Tamper Styles */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden no-select font-sans" oncontextmenu="return false;">

    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- SECURITY & OBFUSCATION ---
        const d = (str) => {
            try { return atob(str); } catch (e) { return str; }
        };

        const _DATA_MATRIX = {
            A: {
                "a_cv1": "MTI4NDQ=", "a_cv2": "MTI4NTc=",
                "a_fv1": "MTI0MDA=", "a_fv2": "OTkwMA==",
                "a_trend": "aW5jcmVhc2U="
            },
            B: {
                "b_step1": "NQ==",
                "b_n": "OA==", "b_pmt": "LTU=", "b_pv": "NDk3LjY3", "b_fv": "LTUwMA==",
                "b_rate": "MS4wNjE=", "b_intexp": "My41Mg==",
                "b_c_proceeds": "NDk3LjY3", "b_c_rate": "MS4wNjEwNw==", "b_c_months": "OA==", "b_c_calc": "My41Mg=="
            },
            Q: {
                "q1": "YQ==", "q2": "Yw==", "q3": "YQ==", "q4": "Yg==", "q5": "Yw==", "q6": "Yg=="
            }
        };

        const _D_ALPHA = {
            metadata: { name: "Alphabet Inc. (E7-34)", year: "Debt Disclosures" },
            tables: [
                {
                    title: "Debt Disclosure ($ Millions)",
                    headers: ["Debt Item", "Maturity", "FY1", "FY2"],
                    rows: [
                        ["Notes issuances", "FY4-FY40", "13,000", "13,000"],
                        ["Lease payments & other", "-", "2,086", "2,142"],
                        ["Total Debt", "", "15,086", "15,142"],
                        ["Unamortized discount", "-", "(156)", "(143)"],
                        ["Less: Current portion", "-", "(113)", "(298)"],
                        ["Total Long-Term Debt", "", "14,817", "14,701"]
                    ]
                },
                {
                    title: "Fair Value Note",
                    headers: ["Metric", "FY1", "FY2"],
                    rows: [
                        ["Est. Fair Value", "$12.4B", "$9.9B"]
                    ]
                }
            ]
        };

        const _D_CARR = {
            metadata: { name: "Carrefour SA (E7-37)", year: "Bond Valuation" },
            tables: [
                {
                    title: "Bond Details",
                    headers: ["Item", "Value"],
                    rows: [
                        ["Face Value", "€500 Million"],
                        ["Coupon Rate", "1.0% (Annual)"],
                        ["Issue Date", "May 1, FY1"],
                        ["Maturity", "May 1, FY9 (8 Years)"],
                        ["Proceeds", "€497.67 Million (Discount)"],
                        ["Effective Rate", "1.06107%"]
                    ]
                }
            ]
        };

        // --- COMPONENTS ---

        const Icon = ({ name, size = 16, className = "", color = "currentColor" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    iconElement.style.color = color;
                    if (className) className.split(' ').forEach(cls => iconElement.classList.add(cls));
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons({ root: iconRef.current, attrs: { width: size, height: size } });
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const ConfirmationModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/40 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in no-select p-4">
                    <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 m-4 border-4 border-rose-100 pop-in text-center">
                        <div className="mx-auto w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-4">
                            <Icon name="alert-triangle" size={32} />
                        </div>
                        <h3 className="text-xl font-black text-slate-800 mb-2 game-font">{title}</h3>
                        <p className="text-slate-500 font-medium mb-8 leading-relaxed">{message}</p>
                        <div className="flex flex-col gap-3">
                            <button onClick={onConfirm} className="btn-game btn-danger w-full py-3 font-bold text-lg">Confirm & Reset</button>
                            <button onClick={onCancel} className="btn-game btn-ghost w-full py-3 font-bold text-lg">Cancel</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SMART INPUT SYSTEM ---

        const SmartInput = ({ id, value, onChange, correctValue, label, hint, instructorMode, activeInput, setActiveInput, tolerance = 0.5, className="", allowPercent = false }) => {
            const [localError, setLocalError] = useState(null);
            const [justCorrect, setJustCorrect] = useState(false);
            
            const evaluateMath = (expr) => {
                if (!expr) return { valid: true, val: "" };
                try {
                    let sanitized = expr.toString().replace(/,/g, '');
                    sanitized = sanitized.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)'); 
                    sanitized = sanitized.replace(/[^\d\.\+\-\*\/\(\)]/g, '');
                    if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(sanitized)) return { valid: false, msg: "Invalid" };
                    const res = eval(sanitized);
                    if (!isFinite(res) || isNaN(res)) return { valid: false, msg: "Error" };
                    return { valid: true, val: res };
                } catch (e) { return { valid: false, msg: "Error" }; }
            };

            const isCorrect = useMemo(() => {
                if (!value || !correctValue) return false;
                const { valid, val } = evaluateMath(value);
                if (!valid) return false;
                const target = parseFloat(correctValue.toString().replace(/,/g, ''));
                const margin = Math.abs(target * 0.02);
                const appliedTolerance = Math.max(tolerance, margin);

                if (Math.abs(val - target) <= appliedTolerance) return true;
                if (Math.abs(target) < 1.0) {
                     if (Math.abs((val / 100) - target) <= appliedTolerance) return true;
                }
                return false;
            }, [value, correctValue, tolerance]);

            const prevCorrect = useRef(isCorrect);
            useEffect(() => {
                if (isCorrect && !prevCorrect.current) {
                    setJustCorrect(true);
                    setTimeout(() => setJustCorrect(false), 600);
                }
                prevCorrect.current = isCorrect;
            }, [isCorrect]);

            const handleBlur = (e) => {
                const { valid, val } = evaluateMath(value);
                if (!valid) { setLocalError("Invalid"); return; }
                setLocalError(null);
                
                if (valid && value !== "") {
                     const numVal = Number(val);
                     const displayVal = Number.isInteger(numVal) ? numVal.toString() : numVal.toFixed(4).replace(/\.?0+$/, '');
                     onChange(id, displayVal.toString()); 
                }
            };

            const isActive = activeInput === id;

            let baseClass = "w-full p-3.5 text-right text-base font-bold rounded-2xl border-2 outline-none transition-all shadow-sm font-mono tracking-wide ";
            let stateClass = "bg-white border-slate-200 text-slate-700 focus:border-blue-400 focus:ring-4 focus:ring-blue-100 ";
            
            if (isCorrect) {
                stateClass = "input-correct border-emerald-400 text-emerald-800 shadow-[0_0_0_4px_rgba(16,185,129,0.1)] ";
            } else if (localError) {
                stateClass = "bg-rose-50 border-rose-300 text-rose-800 focus:ring-rose-100 ";
            } else if (!isActive && value && !isCorrect) {
                stateClass = "bg-slate-50 border-slate-300 text-slate-600 focus:border-blue-400 ";
            }

            return (
                <div className="w-full relative group">
                    {label && <label className="block text-[11px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">{label}</label>}
                    <div className="relative">
                        <input 
                            type="text" 
                            id={id}
                            value={value || ""}
                            onChange={(e) => { setLocalError(null); onChange(id, e.target.value); }}
                            onFocus={() => setActiveInput(id)}
                            onBlur={handleBlur}
                            onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                            className={`${baseClass} ${stateClass} ${justCorrect ? 'pop-in' : ''} ${className}`}
                            placeholder={hint ? "Type or click..." : "-"}
                        />
                        <div className={`absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none transition-all ${isCorrect ? 'opacity-100 scale-100 pop-in' : 'opacity-0 scale-0'}`}>
                            <div className="text-white bg-emerald-500 rounded-full p-1 shadow-sm">
                                <Icon name="check" size={14} strokeWidth={3} />
                            </div>
                        </div>
                        {localError && <div className="absolute right-4 top-1/2 -translate-y-1/2 text-rose-500 font-black pop-in text-lg">!</div>}
                    </div>
                    {instructorMode && (
                        <div className="absolute z-10 top-full mt-2 left-1/2 -translate-x-1/2 w-max text-[11px] font-black tracking-wider text-center bg-purple-600 text-white rounded-lg py-1 px-3 shadow-lg opacity-0 group-hover:opacity-100 transition-opacity">
                            KEY: {correctValue}
                            <div className="absolute -top-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-purple-600 rotate-45"></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- SPECIAL: TVM Helper ---
        const solveRate = (nper, pmt, pv, fv) => {
            const maxIter = 50;
            let r = 0.1; 
            for (let i = 0; i < maxIter; i++) {
                if (Math.abs(r) < 1e-8) r = 1e-8;
                let t1 = Math.pow(1 + r, nper);
                let f_r = pv + (pmt * (1 - 1/t1) / r) + (fv / t1);
                let r_plus = r + 1e-5;
                let t1_plus = Math.pow(1 + r_plus, nper);
                let f_r_plus = pv + (pmt * (1 - 1/t1_plus) / r_plus) + (fv / t1_plus);
                let df_r = (f_r_plus - f_r) / 1e-5;
                let r_new = r - f_r / df_r;
                if (Math.abs(r_new - r) < 1e-6) return r_new;
                r = r_new;
            }
            return r;
        };

        const TVMTool = () => {
            const [inputs, setInputs] = useState({ n: '', pmt: '', pv: '', fv: '' });
            const [rate, setRate] = useState(null);

            const calculate = () => {
                const n = parseFloat(inputs.n);
                const pmt = parseFloat(inputs.pmt);
                const pv = parseFloat(inputs.pv);
                const fv = parseFloat(inputs.fv);
                if (!isNaN(n) && !isNaN(pmt) && !isNaN(pv) && !isNaN(fv)) {
                    const r = solveRate(n, pmt, pv, fv);
                    setRate((r * 100).toFixed(4));
                }
            };

            return (
                <div className="bg-white border-2 border-slate-100 rounded-3xl p-6 shadow-sm mb-6">
                    <div className="flex justify-between items-center mb-5">
                        <h4 className="font-bold text-slate-700 text-lg flex items-center gap-2 game-font">
                            <div className="bg-blue-100 text-blue-600 p-2 rounded-xl"><Icon name="calculator" size={18}/></div>
                            TVM Solver
                        </h4>
                        <span className="text-[10px] font-black uppercase tracking-widest bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-full">Target: RATE</span>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        {['n','pmt','pv','fv'].map(k => (
                            <div key={k}>
                                <label className="block text-[11px] font-black uppercase text-slate-400 mb-1.5">{k}</label>
                                <input className="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-2.5 text-sm font-bold text-right text-slate-700 focus:border-blue-400 focus:ring-4 focus:ring-blue-100 outline-none transition-all font-mono" 
                                    value={inputs[k]} onChange={(e)=>setInputs({...inputs, [k]:e.target.value})} placeholder="0" />
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 border-dashed">
                        <button onClick={calculate} className="btn-game btn-primary px-6 py-2.5 text-sm font-bold flex items-center gap-2">
                            <Icon name="play" size={16} /> Calculate
                        </button>
                        <div className="text-right flex items-center gap-3">
                            <span className="text-[11px] font-black uppercase text-slate-400 tracking-wider">Result:</span>
                            <span className="font-mono text-2xl font-black text-blue-600 bg-white px-4 py-1 rounded-xl border-2 border-blue-100 shadow-sm">
                                {rate !== null ? rate + '%' : '---'}
                            </span>
                        </div>
                    </div>
                </div>
            );
        };

        const ReferenceTable = ({ title, headers, rows, onValueClick }) => {
            const [isOpen, setIsOpen] = useState(true);
            return (
                <div className="bg-white rounded-3xl shadow-sm border-2 border-slate-100 overflow-hidden mb-5">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 bg-slate-50 border-b-2 border-slate-100 hover:bg-slate-100/80 transition-colors group">
                        <h4 className="font-bold text-slate-700 text-sm flex items-center gap-2 game-font tracking-wide">
                            <div className="text-blue-500"><Icon name="table" size={18} /></div> {title}
                        </h4>
                        <div className="bg-white p-1.5 rounded-lg border-2 border-slate-200 text-slate-400 shadow-sm">
                            <Icon name={isOpen ? "chevron-up" : "chevron-down"} size={14} strokeWidth={3} />
                        </div>
                    </button>
                    {isOpen && (
                        <div className="overflow-x-auto max-h-72 custom-scrollbar">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-white text-slate-400 uppercase tracking-widest text-[10px] font-black sticky top-0 shadow-sm z-10">
                                    <tr>{headers.map((h, i) => <th key={i} className={`p-3 border-b-2 border-slate-100 ${i > 0 ? "text-right" : ""}`}>{h}</th>)}</tr>
                                </thead>
                                <tbody className="divide-y-2 divide-slate-50">
                                    {rows.map((row, rI) => (
                                        <tr key={rI} className="hover:bg-blue-50/50 transition-colors group">
                                            <td className="p-3 font-bold text-slate-600 text-xs border-r border-slate-100/50">{row[0]}</td>
                                            {row.slice(1).map((cell, cI) => (
                                                <td key={cI} 
                                                    onClick={(e) => { e.preventDefault(); onValueClick(cell); }} 
                                                    className="p-3 text-right font-mono font-bold text-blue-600 cursor-pointer hover:bg-blue-100 hover:text-blue-800 transition-colors relative text-xs" 
                                                    title="Click to insert value">
                                                    {cell}
                                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-100 flex items-center justify-start pl-2 pointer-events-none">
                                                        <Icon name="mouse-pointer-click" size={12} className="text-blue-400" />
                                                    </div>
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODULES ---

        const ModuleA = ({ teacherMode, isAutoFilled, handleInputChange, inputs, activeInput, setActiveInput }) => {
            const [trend, setTrend] = useState("");
            
            useEffect(() => {
                if(isAutoFilled) setTrend("increase");
                else if(!isAutoFilled && teacherMode) setTrend("");
            }, [isAutoFilled, teacherMode]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-white p-8 rounded-3xl border-2 border-slate-100 shadow-sm relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -z-10"></div>
                        <h4 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3 game-font tracking-wide border-b-2 border-slate-100 pb-4">
                            <div className="bg-blue-100 text-blue-600 p-2.5 rounded-2xl"><Icon name="search" size={20}/></div>
                            Analysis: Carrying vs. Fair Value
                        </h4>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 space-y-4">
                                <h5 className="text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icon name="calendar" size={14}/> FY1 Calculations</h5>
                                <div className="flex flex-col gap-1.5">
                                    <SmartInput id="a_cv1" label="Net Carrying Value" value={inputs.A.a_cv1} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={d(_DATA_MATRIX.A.a_cv1)} instructorMode={teacherMode} hint="Face - Unam. Disc." />
                                </div>
                                <div className="flex flex-col gap-1.5">
                                    <SmartInput id="a_fv1" label="Fair Value" value={inputs.A.a_fv1} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={d(_DATA_MATRIX.A.a_fv1)} instructorMode={teacherMode} hint="Given" />
                                </div>
                            </div>
                            
                            <div className="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 space-y-4">
                                <h5 className="text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icon name="calendar" size={14}/> FY2 Calculations</h5>
                                <div className="flex flex-col gap-1.5">
                                    <SmartInput id="a_cv2" label="Net Carrying Value" value={inputs.A.a_cv2} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={d(_DATA_MATRIX.A.a_cv2)} instructorMode={teacherMode} hint="Face - Unam. Disc." />
                                </div>
                                <div className="flex flex-col gap-1.5">

                        <main className="flex-1 overflow-y-auto custom-scrollbar p-8 pt-4">
                            <div className="max-w-4xl mx-auto space-y-8">
                                <div className={activeTab === 'Q' ? "col-span-2" : "space-y-6 col-span-2 lg:col-span-1"}>
                                    {activeTab === 'A' && (
                                        <ModuleA teacherMode={instructorMode} isAutoFilled={isAutoFilled} handleInputChange={handleInputChange} inputs={inputs} activeInput={activeInput} setActiveInput={setActiveInput} />
                                    )}
                                    {activeTab === 'B' && (
                                        <ModuleB teacherMode={instructorMode} isAutoFilled={isAutoFilled} handleInputChange={handleInputChange} inputs={inputs} activeInput={activeInput} setActiveInput={setActiveInput} />
                                    )}
                                    {activeTab === 'Q' && (
                                        <QuizModule teacherMode={instructorMode} isAutoFilled={isAutoFilled} handleInputChange={handleInputChange} inputs={inputs} activeInput={activeInput} setActiveInput={setActiveInput} />
                                    )}
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* MODALS */}
                    
                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center animate-fade-in p-4">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm transform transition-all border-4 border-slate-100 pop-in text-center">
                                <div className="mx-auto w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mb-4">
                                    <Icon name="lock" size={32} />
                                </div>
                                <h3 className="font-black text-xl mb-2 text-slate-800 game-font">Instructor Access</h3>
                                <p className="text-sm font-bold text-slate-500 mb-6">Enter password to unlock tools.</p>
                                <input type="password" className="w-full border-2 border-slate-200 p-4 rounded-2xl mb-6 outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-100 text-center text-lg font-black tracking-widest shadow-sm" placeholder="••••••" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && unlockInstructor()} autoFocus />
                                <div className="flex flex-col gap-3">
                                    <button onClick={unlockInstructor} className="btn-game bg-amber-500 text-white w-full py-3 font-bold text-lg border-2 border-amber-600 shadow-[0_4px_0_0_#d97706] active:shadow-none active:translate-y-1">Unlock</button>
                                    <button onClick={() => setShowLogin(false)} className="btn-game btn-ghost w-full py-3 font-bold text-lg">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Download Modal */}
                    {showDownload && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center animate-fade-in p-4">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-emerald-100 pop-in text-center">
                                <div className="mx-auto w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mb-4">
                                    <Icon name="check-circle" size={32} />
                                </div>
                                <h3 className="font-black text-2xl text-slate-800 mb-2 game-font">Mission Complete</h3>
                                <p className="text-slate-500 text-sm font-bold mb-6">Enter your name to generate your submission record.</p>
                                
                                <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="Your Full Name" className="w-full p-4 border-2 border-slate-200 rounded-2xl mb-6 text-center focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100 outline-none font-bold text-slate-700 shadow-sm text-lg" autoFocus />
                                
                                <div className="flex flex-col gap-3">
                                    <button onClick={() => studentName.trim() ? handleDownload() : alert("Name required")} className="btn-game btn-success w-full py-3 font-bold text-lg flex items-center justify-center gap-2">
                                        <Icon name="download" size={20} /> Save File
                                    </button>
                                    <button onClick={() => setShowDownload(false)} className="btn-game btn-ghost w-full py-3 font-bold text-lg">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmationModal isOpen={clearModalOpen} title="Clear All & Exit?" message="This will wipe the current board and lock Instructor Mode. Ready?" onConfirm={performClear} onCancel={() => setClearModalOpen(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
