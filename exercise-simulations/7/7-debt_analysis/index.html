<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Tycoon: Analyst Simulator</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Gamified Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#1e293b', 900: '#0f172a' },
                        blue: { 950: '#172554' },
                        emerald: { 450: '#10b981' }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        game: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a; /* Deep Slate Game Background */
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .game-font {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Custom Game Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 8px; border: 2px solid #0f172a; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Chunky Game Buttons */
        .btn-game {
            position: relative;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.3);
            transform: translateY(0);
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.3);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .float-anim { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* Anti-Tamper Styles */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Calculator Styles Gamified */
        .calc-btn {
            background-color: #1e293b;
            color: white;
            font-weight: 800;
            border-radius: 8px;
            padding: 10px 0;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.1s;
            border-bottom: 3px solid #0f172a;
        }
        .calc-btn:hover { background-color: #334155; transform: translateY(-1px); border-bottom: 4px solid #0f172a; }
        .calc-btn:active { transform: translateY(2px); border-bottom: 1px solid #0f172a; }
        .calc-btn.op { background-color: #0f172a; color: #38bdf8; border-bottom: 3px solid #020617; }
        .calc-btn.eq { background-color: #059669; border-bottom: 3px solid #064e3b; color: #ecfdf5;}
        .calc-btn.clear { background-color: #e11d48; border-bottom: 3px solid #881337; color: #fff1f2;}
        
        .pts-bar-container {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden no-select font-sans" oncontextmenu="return false;">

    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- DATA & ANSWER KEYS (OBFUSCATED) ---
        const _K_ANS = {
            P: { "p_st": "4026", "p_lt": "28295", "p_total": "32321", "p_change": "15", "p_retired": "1328", "p_loss": "272" },
            B: { "b_fy3Due": "2248", "b_totalLt": "7051", "b_avgRate": "3.805" }
        };

        const _K_MC = {

        const _M_META = {

                "mc_b2": { label: "Q: Premium Bond (109.35)", text: "Premium; rates decreased" },
                "mc_b3": { label: "Q: Yield Curve", text: "Maturity premium (Yield Curve)" }
            }
        };

        const _X_EXPL = {
            P: {
                "p_st": "Other borrowings (73) + Current maturities (3,953)", 
                "p_lt": "Total LT obligations (32,248) - Current maturities (3,953)", 
                "p_total": "Short-term (4,026) + Long-term (28,295)",
                "p_change": "FY2 Balance (3,948) - FY1 Balance (3,933)",
                "p_retired": "Sum: 11 + 4 + 357 + 138 + 410 + 408", 
                "p_loss": "Cash Paid (1,600) - Carrying Value (1,328)"
            },
            B: {
                "b_fy3Due": "Directly from Principal Repayments table (FY3)", 
                "b_totalLt": "Long-term debt (4,803) + Current portion (2,248)", 
                "b_avgRate": "Interest Expense (241) / Average Debt (6,334)"
            }
        };

        const _D_PEP = {
            metadata: { name: "PepsiCo Inc.", code: "P7-44", year: "Debt Schedule" },
            tables: [
                {
                    title: "Short-term Debt ($M)",
                    headers: ["Item", "FY2", "FY1"],
                    rows: [
                        ["Current maturities of LT debt", "3,953", "4,020"],
                        ["Commercial paper (1.3%)", "—", "1,385"],
                        ["Other borrowings", "73", "80"]
                    ]
                },
                {
                    title: "Long-term Debt ($M)",
                    headers: ["Item", "FY2", "FY1"],
                    rows: [
                        ["Notes due FY2 (2.4%)", "—", "4,016"],
                        ["Notes due FY3 (3.1% & 2.1%)", "3,948", "3,933"],
                        ["Notes due FY4 - FY31...", "28,274", "29,836"],
                        ["Total LT Debt Obligations", "32,248", "37,816"],
                        ["Less: Current Maturities", "(3,953)", "(4,020)"]
                    ]
                },
                {
                    title: "Tender Offer Data",
                    headers: ["Bond Retired", "Carrying Value"],
                    rows: [
                        ["7.290% Sep FY9", "$11"],
                        ["7.440% Sep FY9", "$4"],
                        ["7.000% Mar FY12", "$357"],
                        ["5.500% May FY18", "$138"],
                        ["4.875% Nov FY23", "$410"],
                        ["5.500% Jan FY23", "$408"]
                    ]
                },
                {
                    title: "Market Data Excerpt",
                    headers: ["Bond", "Price", "Yield", "Coupon"],
                    rows: [
                        ["Notes due FY6", "102.27", "1.87%", "2.75%"]
                    ]
                }
            ]
        };

        const _D_BOS = {
            metadata: { name: "Boston Scientific", code: "P7-45", year: "Debt Note" },
            tables: [
                {
                    title: "Long-term Debt ($M)",
                    headers: ["Instrument", "Coupon", "FY2", "FY1"],
                    rows: [
                        ["FY4 Notes (Jan)", "6.00%", "850", "850"],
                        ["FY4 Notes (May)", "2.85%", "600", "600"],
                        ["FY6 Notes", "3.375%", "500", "500"],
                        ["FY7 Notes", "4.125%", "450", "450"],
                        ["FY9 Notes", "3.85%", "750", "750"],
                        ["FY12 Notes", "4.00%", "1,000", "1,000"],
                        ["FY19 - FY24 Notes", "Var", "650", "650"],
                        ["Discounts/Hedges", "-", "3", "14"],
                        ["Total LT Debt", "", "4,803", "3,815"]
                    ]
                },
                {
                    title: "Principal Repayments ($M)",
                    headers: ["Year", "Amount"],
                    rows: [
                        ["FY3", "2,248"],
                        ["FY4", "1,540"],
                        ["FY5", "0"],
                        ["FY6", "500"]
                    ]
                },
                {
                    title: "Interest & Market Data",
                    headers: ["Item", "Value"],
                    rows: [
                        ["Interest Expense (FY2)", "$241"],
                        ["Cash Interest Paid (FY2)", "$262"],
                        ["FY12 Note Price", "109.35"],
                        ["FY7 Note Price", "101.57"]
                    ]
                },
                {
                    title: "Balance Sheet Summary",
                    headers: ["Item", "FY2", "FY1"],
                    rows: [
                        ["Short-term Debt", "2,248", "1,801"],
                        ["Long-term Debt", "4,803", "3,815"]
                    ]
                }
            ]
        };

        // --- COMPONENTS ---

        const Icon = ({ name, size = 16, className = "", color = "currentColor" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    iconElement.style.color = color;
                    if (className) className.split(' ').forEach(cls => iconElement.classList.add(cls));
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons({ root: iconRef.current, attrs: { width: size, height: size } });
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const ConfirmationModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in no-select p-4">
                    <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-rose-500 pop-in">
                        <div className="w-20 h-20 bg-rose-900 border-4 border-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(244,63,94,0.6)] text-rose-300">
                            <Icon name="bomb" size={40} />
                        </div>
                        <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">{title}</h3>
                        <p className="text-slate-300 mb-8 text-center font-bold">{message}</p>
                        <div className="flex justify-center gap-4">
                            <button onClick={onCancel} className="btn-game px-6 py-3 bg-slate-700 text-slate-300 hover:text-white rounded-xl font-black border-2 border-slate-600">Cancel</button>
                            <button onClick={onConfirm} className="btn-game px-6 py-3 bg-gradient-to-b from-rose-500 to-red-700 border-2 border-red-300 text-white rounded-xl font-black shadow-lg">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };

        const StandardCalculator = () => {
            const [display, setDisplay] = useState("0");
            const [prevVal, setPrevVal] = useState(null);
            const [op, setOp] = useState(null);
            const [newNum, setNewNum] = useState(true);

            const handleNum = (num) => {
                if (newNum) { setDisplay(String(num)); setNewNum(false); } 
                else { setDisplay(display === "0" ? String(num) : display + num); }
            };

            const handleOp = (operator) => {
                setOp(operator);
                setPrevVal(parseFloat(display));
                setNewNum(true);
            };

            const handleEq = () => {
                if (!op || prevVal === null) return;
                const curr = parseFloat(display);
                let res = 0;
                switch(op) {
                    case '+': res = prevVal + curr; break;
                    case '-': res = prevVal - curr; break;
                    case '×': res = prevVal * curr; break;
                    case '÷': res = prevVal / curr; break;
                }
                setDisplay(String(parseFloat(res.toFixed(4))));
                setOp(null); setPrevVal(null); setNewNum(true);
            };

            const handleClear = () => {
                setDisplay("0"); setPrevVal(null); setOp(null); setNewNum(true);
            };

            return (
                <div className="mx-4 mt-6 bg-slate-900/80 rounded-2xl p-4 border-4 border-slate-700 shadow-xl">
                    <div className="bg-slate-800 border-2 border-slate-600 shadow-inner rounded-xl mb-4 px-3 py-3 text-right text-xl font-mono text-sky-400 font-black overflow-hidden h-14 flex items-center justify-end">
                        {display}
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                        <button onClick={handleClear} className="calc-btn clear col-span-1 text-sm flex items-center justify-center"><Icon name="trash-2" size={16} /></button>
                        <button onClick={() => handleOp('÷')} className="calc-btn op"><Icon name="divide" size={16} className="mx-auto" /></button>
                        <button onClick={() => handleOp('×')} className="calc-btn op"><Icon name="x" size={16} className="mx-auto" /></button>
                        <button onClick={() => handleOp('-')} className="calc-btn op"><Icon name="minus" size={16} className="mx-auto" /></button>
                        <button onClick={() => handleNum(7)} className="calc-btn">7</button>
                        <button onClick={() => handleNum(8)} className="calc-btn">8</button>
                        <button onClick={() => handleNum(9)} className="calc-btn">9</button>
                        <button onClick={() => handleOp('+')} className="calc-btn op row-span-2 flex flex-col items-center justify-center pt-5"><Icon name="plus" size={16} /></button>
                        <button onClick={() => handleNum(4)} className="calc-btn">4</button>
                        <button onClick={() => handleNum(5)} className="calc-btn">5</button>
                        <button onClick={() => handleNum(6)} className="calc-btn">6</button>
                        <button onClick={() => handleNum(1)} className="calc-btn">1</button>
                        <button onClick={() => handleNum(2)} className="calc-btn">2</button>
                        <button onClick={() => handleNum(3)} className="calc-btn">3</button>
                        <button onClick={handleEq} className="calc-btn eq row-span-2 flex flex-col items-center justify-center pt-5"><Icon name="equal" size={16} /></button>
                        <button onClick={() => handleNum(0)} className="calc-btn col-span-2">0</button>
                        <button onClick={() => handleNum('.')} className="calc-btn">.</button>
                    </div>
                </div>
            );
        };

        const SmartInput = ({ id, value, onChange, correctValue, label, hint, instructorMode, activeInput, setActiveInput, type = "number" }) => {
            const [localError, setLocalError] = useState(null);
            const [justCorrect, setJustCorrect] = useState(false);
            
            const evaluateMath = (expr) => {
                if (!expr) return { valid: true, val: "" };
                try {
                    const sanitized = expr.toString().replace(/,/g, '').replace(/%/g, '').replace(/[^\d\.\+\-\*\/\(\)]/g, '');
                    if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(sanitized)) return { valid: false, msg: "Invalid" };
                    const res = eval(sanitized);
                    if (!isFinite(res) || isNaN(res)) return { valid: false, msg: "Error" };
                    return { valid: true, val: res };
                } catch (e) { return { valid: false, msg: "Error" }; }
            };

            const isCorrect = useMemo(() => {
                if (!value || !correctValue) return false;
                const { valid, val } = evaluateMath(value);
                if (!valid) return false;
                
                let numVal = parseFloat(val);
                const target = parseFloat(correctValue.toString().replace(/,/g, ''));
                
                // Special handling for percentages
                if (type === "percent") {
                    if (numVal < 1.0 && target > 1.0 && numVal !== 0) {
                        numVal = numVal * 100;
                    }
                }

                // 2% Relative Tolerance
                let validCheck = false;
                if (target === 0) validCheck = Math.abs(numVal) < 0.01;
                else validCheck = Math.abs((numVal - target) / target) <= 0.02;

                return validCheck;
            }, [value, correctValue, type]);

            // Track state transitions for animation
            const prevCorrect = useRef(isCorrect);
            useEffect(() => {
                if (isCorrect && !prevCorrect.current) {
                    setJustCorrect(true);
                    setTimeout(() => setJustCorrect(false), 600);
                }
                prevCorrect.current = isCorrect;
            }, [isCorrect]);

            const handleBlur = (e) => {
                const { valid, val } = evaluateMath(value);
                if (!valid) { setLocalError("Invalid"); return; }
                setLocalError(null);
                if (valid && value !== "") {
                     const numVal = Number(val);
                     let displayVal = Number.isInteger(numVal) ? numVal.toString() : numVal.toFixed(3);
                     if (Math.abs(numVal) < 1 && numVal !== 0) displayVal = numVal.toString();
                     onChange(id, displayVal); 
                }
            };

            const isActive = activeInput === id;

            // Gamified styling based on state
            let baseClass = "w-full p-3 text-right text-sm font-black rounded-xl border-4 outline-none transition-all focus:scale-[1.02] shadow-sm font-mono";
            let stateClass = "border-slate-600 bg-slate-800 text-white focus:border-sky-400 focus:bg-slate-700 focus:shadow-[0_0_15px_rgba(56,189,248,0.3)]";
            
            if (isCorrect) {
                stateClass = "border-emerald-500 bg-emerald-900/40 text-emerald-300 shadow-[0_0_10px_rgba(16,185,129,0.3)]";
            } else if (localError) {
                stateClass = "border-rose-500 bg-rose-900/40 text-rose-300";
            } else if (!isActive && value && !isCorrect) {
                stateClass = "border-slate-500 bg-slate-700/60 text-slate-300";
            }

            return (
                <div className="w-full relative group">
                    {label && <label className="block text-[11px] font-black text-slate-400 mb-1 uppercase tracking-widest">{label}</label>}
                    <div className="flex gap-3 items-stretch">
                        <div className="relative flex-grow">
                            <input 
                                type="text" 
                                id={id}
                                value={value || ""}
                                onChange={(e) => { setLocalError(null); onChange(id, e.target.value); }}
                                onFocus={() => setActiveInput(id)}
                                onBlur={handleBlur}
                                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                                className={`${baseClass} ${stateClass} ${justCorrect ? 'pop-in' : ''}`}
                                placeholder={hint ? "Input / Calc..." : "-"}
                            />
                            <div className={`absolute -left-3 -top-3 pointer-events-none transition-all ${isCorrect ? 'opacity-100 scale-100 pop-in' : 'opacity-0 scale-0'}`}>
                                <div className="text-emerald-400 bg-emerald-900 rounded-full p-1 border-2 border-emerald-500 shadow-lg">
                                    <Icon name="star" size={16} className="fill-emerald-400" />
                                </div>
                            </div>
                            {localError && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-rose-500 font-black pop-in">!</div>}
                        </div>
                        {hint && (
                            <div className="w-1/3 shrink-0 bg-slate-900 border-2 border-slate-700 rounded-xl p-2 flex flex-col justify-center shadow-inner">
                                <span className="text-[9px] text-sky-400 font-black uppercase tracking-widest block mb-0.5 flex items-center gap-1"><Icon name="help-circle" size={10}/> Hint</span>
                                <span className="text-xs text-slate-300 font-bold leading-tight">{hint}</span>
                            </div>
                        )}
                    </div>
                    {/* Per-Input Key Display (Instructor Mode) */}
                    {instructorMode && (
                        <div className="absolute z-10 -bottom-6 left-1/2 -translate-x-1/2 w-max text-[11px] font-black tracking-wider text-center bg-amber-600 text-white border-2 border-amber-300 rounded-md py-0.5 px-2 fade-in shadow-xl opacity-0 group-hover:opacity-100 transition-opacity">
                            KEY: {correctValue}
                        </div>
                    )}
                </div>
            );
        };

        const MultipleChoiceQuestion = ({ id, question, options, selected, onSelect, correctId, feedback, instructorMode }) => {
            const isAnswered = selected !== undefined;
            const isCorrect = selected === correctId;

            return (
                <div className="bg-slate-800/80 border-4 border-slate-700 rounded-2xl p-6 shadow-xl mb-6 relative">
                    {/* Correct/Wrong Stamp */}
                    {isAnswered && (
                        <div className={`absolute -right-4 -top-4 w-14 h-14 rounded-full flex items-center justify-center font-black text-xl border-4 shadow-lg pop-in z-20 ${isCorrect ? 'bg-emerald-500 border-white text-white' : 'bg-rose-500 border-white text-white'}`}>
                            <Icon name={isCorrect ? 'check' : 'x'} size={28} strokeWidth="4" />
                        </div>
                    )}

                    <div className="flex items-start gap-4 mb-5 relative z-10">
                        <div className="bg-gradient-to-br from-blue-500 to-sky-600 text-white w-8 h-8 rounded-xl flex items-center justify-center font-black border-2 border-sky-300 flex-shrink-0 shadow-md">
                            <Icon name="help-circle" size={16} />
                        </div>
                        <h4 className="font-black text-slate-100 text-[15px] leading-snug pt-1">{question}</h4>
                    </div>

                    <div className="space-y-3 pl-0 md:pl-12 mb-4">
                        {options.map((opt) => {
                            const isSelected = selected === opt.id;
                            
                            let btnClass = "btn-game w-full text-left p-3.5 rounded-xl border-4 font-bold text-sm transition-all flex items-center justify-between ";
                            
                            if (isAnswered) {
                                if (opt.id === correctId) {
                                    btnClass += "bg-emerald-900/60 border-emerald-500 text-emerald-100 shadow-[0_0_15px_rgba(16,185,129,0.3)] opacity-100 ";
                                } else if (isSelected) {
                                    btnClass += "bg-rose-900/60 border-rose-500 text-rose-100 opacity-100 ";
                                } else {
                                    btnClass += "bg-slate-900/40 border-slate-700/50 text-slate-500 opacity-50 ";
                                }
                            } else {
                                btnClass += "bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border-slate-600 hover:border-slate-500 cursor-pointer ";
                            }

                            if (instructorMode && opt.id === correctId && !isAnswered) {
                                btnClass += " ring-4 ring-amber-500 ring-offset-4 ring-offset-slate-900";
                            }

                            return (
                                <button 
                                    key={opt.id}
                                    onClick={() => !isAnswered && onSelect(id, opt.id)}
                                    disabled={isAnswered}
                                    className={btnClass}
                                >
                                    <span className="flex-1 pr-4">{opt.text}</span>
                                    <div className={`w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center ${isSelected ? (isCorrect ? 'bg-emerald-500 border-emerald-300' : 'bg-rose-500 border-rose-300') : (isAnswered && opt.id === correctId) ? 'bg-emerald-500 border-emerald-300' : 'border-slate-600 bg-slate-900'}`}>
                                        {(isSelected || (isAnswered && opt.id === correctId)) && <div className="w-2 h-2 rounded-full bg-white"></div>}
                                    </div>
                                    {instructorMode && opt.id === correctId && !isAnswered && (
                                        <span className="absolute right-12 text-[10px] text-white font-black px-2 py-0.5 bg-amber-600 rounded shadow-md border border-amber-300 transform rotate-6">KEY</span>
                                    )}
                                </button>
                            );
                        })}

                                    {activeTab === 'B' && (
                                        <div className="space-y-6 animate-fade-in relative z-10">
                                            <div className="bg-slate-800/80 border-4 border-slate-700 rounded-2xl p-6 shadow-xl">
                                                <div className="absolute -right-10 -top-10 text-slate-700/30 rotate-12 pointer-events-none"><Icon name="pie-chart" size={120} /></div>
                                                <h4 className="text-lg font-black text-slate-100 mb-6 flex items-center gap-3 no-select game-font uppercase tracking-wide border-b-2 border-slate-700/50 pb-3 relative z-10">
                                                    <div className="bg-emerald-500 text-slate-900 p-2 rounded-xl"><Icon name="bar-chart-2" size={20}/></div>
                                                    Debt Overview & Rates
                                                </h4>
                                                <div className="space-y-5 relative z-10">
                                                    <SmartInput id="b_fy3Due" label="a. LT Debt due in FY3 ($M)" value={inputs.B.b_fy3Due} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={_K_ANS.B.b_fy3Due} instructorMode={instructorMode} />
                                                    <SmartInput id="b_totalLt" label="b. Total LT Debt (incl. current) at FY2 ($M)" value={inputs.B.b_totalLt} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={_K_ANS.B.b_totalLt} instructorMode={instructorMode} hint="Reported LT + Current Mat." />
                                                    <SmartInput id="b_avgRate" label="c. Effective Interest Rate (%)" value={inputs.B.b_avgRate} onChange={handleInputChange} activeInput={activeInput} setActiveInput={setActiveInput} correctValue={_K_ANS.B.b_avgRate} instructorMode={instructorMode} hint="Int Exp / Avg Debt" type="percent" />
                                                </div>
                                                {instructorMode && (
                                                    <div className="mt-5 p-4 bg-amber-900/40 text-sm font-semibold text-amber-200 rounded-xl border-2 border-amber-500/50 relative z-10 shadow-inner flex items-start gap-3">
                                                        <Icon name="zap" className="text-amber-400 shrink-0 mt-0.5" size={18} />
                                                        <span><strong>Instructor Note (c):</strong> Interest expense ($241) divided by Average Debt ($6,334) = 3.805%. Interest paid ($262) differs due to amortization and accrual timing.</span>
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <MultipleChoiceQuestion 
                                                id="mc_b1" 
                                                selected={mcAnswers['mc_b1']} 
                                                onSelect={handleMcSelect}
                                                correctId="b"
                                                question="d. Why does cash interest paid ($262M) differ from interest expense ($241M)?"
                                                options={[
                                                    {id: 'a', text: 'Accounting error in the cash flow statement.'},
                                                    {id: 'b', text: 'Interest expense uses effective rate; cash is coupon.'},
                                                    {id: 'c', text: 'The company defaulted on some payments.'}
                                                ]}
                                                feedback="Correct. Interest expense reflects the effective yield (including amortization of premiums/discounts), while cash paid is strictly based on the coupon rate."
                                                instructorMode={instructorMode}
                                            />

                                            <MultipleChoiceQuestion 
                                                id="mc_b2" 
                                                selected={mcAnswers['mc_b2']} 
                                                onSelect={handleMcSelect}
                                                correctId="c"
                                                question="e. The FY12 note is priced at 109.35 (Yield 2.80% vs Coupon 4.0%). Interpretation?"
                                                options={[
                                                    {id: 'a', text: 'The bond is selling at a discount.'},
                                                    {id: 'b', text: 'Market interest rates have increased since issuance.'},
                                                    {id: 'c', text: 'Bond is premium; market rates decreased since issuance.'}
                                                ]}
                                                feedback="Correct. A price > 100 (Premium) means Coupon > Yield. This implies market interest rates have fallen since the bond was originally issued."
                                                instructorMode={instructorMode}
                                            />

                                            <MultipleChoiceQuestion 
                                                id="mc_b3" 
                                                selected={mcAnswers['mc_b3']} 
                                                onSelect={handleMcSelect}
                                                correctId="b"
                                                question="f. Why does the FY12 bond (4.0%) have a higher yield (2.80%) than the FY7 bond (2.41%)?"
                                                options={[
                                                    {id: 'a', text: 'The FY12 bond has a higher coupon rate.'},
                                                    {id: 'b', text: 'Yields typically increase with maturity (Time/Risk).'},
                                                    {id: 'c', text: 'The FY7 bond is more risky.'}
                                                ]}
                                                feedback="Correct. Investors demand higher yields for longer maturities to compensate for increased credit, liquidity, and inflation risk over time (Normal Yield Curve)."
                                                instructorMode={instructorMode}
                                            />
                                        </div>
                                    )}
                                    
                                    {/* Padding at bottom for floating button */}
                                    <div className="h-16"></div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Floating Submit/Report Complete Button */}
                    <div className="fixed bottom-6 right-6 z-50">
                        <button 
                            onClick={() => setShowDownloadModal(true)}
                            className="btn-game flex items-center gap-3 bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-white font-black py-4 px-8 rounded-full shadow-[0_10px_20px_rgba(16,185,129,0.4)] border-4 border-emerald-200 text-lg uppercase tracking-wider"
                        >
                            <Icon name="file-check" size={24} /> Submit Report
                        </button>
                    </div>

                    {/* MODALS */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in no-select p-4">
                            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-amber-500 pop-in relative">
                                <button onClick={() => setShowLogin(false)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-slate-700 rounded-full text-slate-400 hover:text-white hover:bg-rose-500 transition-colors">&times;</button>
                                
                                <div className="w-20 h-20 bg-amber-900 border-4 border-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(245,158,11,0.6)] text-amber-300">
                                    <Icon name="key" size={40} />
                                </div>
                                <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">Instructor Access</h3>
                                <p className="text-slate-300 text-center text-sm font-bold mb-6">Enter admin password to enable instructor mode.</p>
                                
                                <input 
                                    type="password" 
                                    className="w-full bg-slate-900 border-4 border-slate-700 p-4 rounded-xl text-white outline-none focus:border-amber-500 font-black text-center text-xl shadow-inner mb-4 tracking-widest placeholder-slate-700"
                                    placeholder="••••••"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && unlockInstructor()}
                                    autoFocus
                                />
                                
                                <button 
                                    onClick={unlockInstructor}
                                    className="btn-game w-full bg-gradient-to-b from-amber-500 to-orange-600 border-2 border-amber-300 text-white py-4 rounded-xl font-black shadow-lg uppercase tracking-wider text-lg mt-2"
                                >
                                    Unlock Options
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {showDownload && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in no-select p-4">
                            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full border-4 border-emerald-500 pop-in">
                                <div className="w-20 h-20 bg-emerald-900 border-4 border-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4 -mt-16 shadow-[0_0_30px_rgba(16,185,129,0.6)] text-emerald-300">
                                    <Icon name="award" size={40} />
                                </div>
                                <h3 className="font-black text-2xl mb-2 text-white text-center game-font uppercase">Save Progress</h3>
                                <p className="text-slate-300 text-center text-sm font-bold mb-6">Enter your Analyst Name to save your high score.</p>
                                
                                <div className="mb-6">
                                    <input 
                                        type="text" 
                                        value={studentName}
                                        onChange={(e) => setStudentName(e.target.value)}
                                        className="w-full bg-slate-900 border-4 border-slate-700 p-4 rounded-xl text-white outline-none focus:border-cyan-500 font-black text-center text-xl shadow-inner placeholder-slate-700"
                                        placeholder="Player One"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setShowDownload(false)} className="btn-game px-6 py-3 bg-slate-700 text-slate-300 hover:text-white rounded-xl font-black border-2 border-slate-600">Cancel</button>
                                    <button onClick={() => {
                                        if(!studentName) { alert("Name Required"); return;}
                                        handleDownload();
                                    }} className="btn-game px-6 py-3 bg-gradient-to-b from-emerald-400 to-emerald-600 border-2 border-emerald-300 text-white rounded-xl font-black shadow-lg">Save Data</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Answer Key Table Modal */}
                    {showAnswerKey && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center backdrop-blur-sm animate-fade-in no-select p-4 lg:p-8">
                            <div className="bg-slate-800 p-6 lg:p-8 rounded-3xl shadow-2xl w-full max-w-4xl max-h-full flex flex-col border-4 border-amber-500 pop-in relative">
                                <button onClick={() => setShowAnswerKey(false)} className="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-slate-700 rounded-full text-slate-300 hover:text-white hover:bg-rose-500 transition-colors border-2 border-slate-600 z-10"><Icon name="x" size={20}/></button>
                                
                                <div className="flex items-center gap-4 mb-6 border-b-4 border-slate-700/50 pb-4">
                                    <div className="bg-amber-600 p-3 rounded-2xl border-2 border-amber-300 shadow-lg">
                                        <Icon name="key" size={32} className="text-white" />
                                    </div>
                                    <h3 className="font-black text-3xl text-white uppercase game-font tracking-wider">Classified Solutions</h3>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        {/* PepsiCo Column */}
                                        <div className="bg-slate-900/50 p-6 rounded-2xl border-2 border-slate-700">
                                            <h4 className="font-black text-xl text-blue-300 mb-4 uppercase flex items-center gap-2 border-b-2 border-blue-900/50 pb-2"><Icon name="droplet"/> PepsiCo (P7-44)</h4>
                                            
                                            <div className="mb-6">
                                                <h5 className="font-black text-slate-400 mb-3 text-xs uppercase tracking-widest bg-slate-800 inline-block px-3 py-1 rounded-full">Calculations</h5>
                                                <div className="space-y-3">
                                                    {Object.entries(_K_ANS.P).map(([k, v]) => (
                                                        <div key={k} className="bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-slate-200 font-bold text-sm">{k}:</span>
                                                                <span className="font-mono font-black text-lg text-emerald-400 bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-800">{v}</span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400 font-semibold">{_X_EXPL.P[k]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <h5 className="font-black text-slate-400 mb-3 text-xs uppercase tracking-widest bg-slate-800 inline-block px-3 py-1 rounded-full">Multiple Choice</h5>
                                                <div className="space-y-3">
                                                    {Object.entries(_K_MC.P).map(([k, v]) => (
                                                        <div key={k} className="bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-slate-200 font-bold text-sm truncate mr-2" title={_M_META.P[k].label}>{_M_META.P[k].label}</span>
                                                                <span className="font-black text-blue-400 bg-blue-900/50 px-2 py-0.5 rounded border border-blue-800">{v.toUpperCase()}</span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400 font-semibold leading-tight block">{_M_META.P[k].text}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        
                                        {/* Boston Sci Column */}
                                        <div className="bg-slate-900/50 p-6 rounded-2xl border-2 border-slate-700">
                                            <h4 className="font-black text-xl text-emerald-300 mb-4 uppercase flex items-center gap-2 border-b-2 border-emerald-900/50 pb-2"><Icon name="heart-pulse"/> Boston Scientific (P7-45)</h4>
                                            
                                            <div className="mb-6">
                                                <h5 className="font-black text-slate-400 mb-3 text-xs uppercase tracking-widest bg-slate-800 inline-block px-3 py-1 rounded-full">Calculations</h5>
                                                <div className="space-y-3">
                                                    {Object.entries(_K_ANS.B).map(([k, v]) => (
                                                        <div key={k} className="bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-slate-200 font-bold text-sm">{k}:</span>
                                                                <span className="font-mono font-black text-lg text-emerald-400 bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-800">{v}</span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400 font-semibold">{_X_EXPL.B[k]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <h5 className="font-black text-slate-400 mb-3 text-xs uppercase tracking-widest bg-slate-800 inline-block px-3 py-1 rounded-full">Multiple Choice</h5>
                                                <div className="space-y-3">
                                                    {Object.entries(_K_MC.B).map(([k, v]) => (
                                                        <div key={k} className="bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-slate-200 font-bold text-sm truncate mr-2" title={_M_META.B[k].label}>{_M_META.B[k].label}</span>
                                                                <span className="font-black text-blue-400 bg-blue-900/50 px-2 py-0.5 rounded border border-blue-800">{v.toUpperCase()}</span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400 font-semibold leading-tight block">{_M_META.B[k].text}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
