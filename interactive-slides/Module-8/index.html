<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equity Analysis & Shareholder Returns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0c10; 
            color: #f8fafc;
            overflow: hidden;
            font-size: 16px;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbars */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        /* Smooth Transitions */
        .smooth-tx { transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        
        /* Glassmorphism for content cards */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Flip Card Effect */
        .perspective-1000 { perspective: 1000px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .flip-card-front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .flip-card-front:hover { border-color: #3b82f6; }
        .flip-card-back {
            color: white;
            transform: rotateY(180deg);
            overflow-y: auto;
        }
        
        .flip-card-back.accent-blue { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .flip-card-back.accent-emerald { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
        .flip-card-back.accent-purple { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); }
        .flip-card-back.accent-amber { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
        .flip-card-back.accent-rose { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); }

        /* Interactive Elements */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px; width: 24px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
        }

        /* Animations */
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-full bg-[#0b0c10] text-gray-100 font-sans overflow-hidden">

    <canvas id="confetti-canvas"></canvas>

    <!-- Gamified Header -->
    <header class="flex border-b border-gray-800 bg-[#12141a] px-4 lg:px-6 py-3 shadow-md z-50 shrink-0 items-center justify-between">
        <div class="flex items-center gap-2 lg:gap-4 flex-1 overflow-x-auto custom-scroll pb-1" id="nav-container">
            <div class="flex items-center gap-2 mr-2 lg:mr-4 shrink-0">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-magnifying-glass-chart text-sm"></i>
                </div>
                <span class="font-bold text-white tracking-tight hidden md:block whitespace-nowrap">EquityMastery</span>
            </div>
            <!-- Tabs injected by JS -->
        </div>
        
        <div class="flex items-center gap-4 lg:gap-6 pl-4 border-l border-gray-800 ml-2 lg:ml-4 shrink-0">
            <div class="flex items-center bg-gray-900 px-3 lg:px-4 py-1.5 rounded-full border border-gray-700 shadow-inner">
                <i class="fa-solid fa-star text-amber-400 mr-2 drop-shadow-[0_0_5px_rgba(251,191,36,0.5)] text-sm"></i>
                <span id="xp-display" class="font-mono font-bold text-emerald-400 transition-transform duration-300 inline-block text-base lg:text-lg">0</span>
                <span class="text-gray-500 text-xs ml-1 font-bold">XP</span>
            </div>
            <div id="progress-container" class="w-16 lg:w-24 h-2 bg-gray-800 rounded-full overflow-hidden hidden sm:block border border-gray-700">
                <div id="chapter-progress" class="h-full bg-gradient-to-r from-blue-500 to-emerald-400 w-0 transition-all duration-300"></div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Area -->
    <main class="flex-1 flex overflow-hidden relative" id="main-content">
        <!-- Split view or full-screen quiz injected here -->
    </main>

<script>
// --- CONTENT ARCHITECTURE ---

function createFlipCard(front, back, iconClass, backColorClass = "accent-blue") {
    return `
        <div class="flip-card w-full min-h-[160px] lg:min-h-[180px] perspective-1000 group my-2 pointer-events-auto" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-inner">
                <div class="flip-card-front p-3 lg:p-4">
                    <i class="${iconClass} text-2xl lg:text-3xl mb-2 lg:mb-3 text-gray-400 group-hover:text-blue-400 transition-colors"></i>
                    <div class="font-black text-sm lg:text-base text-white leading-tight">${front}</div>
                    <div class="text-[10px] text-gray-500 mt-2 uppercase tracking-widest font-bold"><i class="fa-solid fa-rotate mr-1"></i> Tap to flip</div>
                </div>
                <div class="flip-card-back ${backColorClass} p-3 lg:p-4 text-xs text-left custom-scroll">
                    <div class="font-black mb-1 lg:mb-2 text-white/90 border-b border-white/20 pb-1 text-center">${front}</div>
                    <div class="text-white/90 leading-snug text-[11px] lg:text-xs">${back}</div>
                </div>
            </div>
        </div>
    `;
}

const TABS = [
    "1. Equation", "2. Lifecycle", "3. Priority", 
    "4. Actions", "5. Earned Cap", "6. EPS", "7. Dual Class", "8. Musk Pay", "9. Final Exam"
];

const CHAPTERS = [
    // --- CH 1: Equation & Balance Sheet ---
    {
        title: "The Anatomy of Equity",
        prefix: "Demystifying ",
        sections: [
            { 
                title: "The Fundamental Equation", icon: "fa-scale-balanced", 
                content: `<p>Before we understand Equity, we must start with the bedrock of accounting. Think of this as the law of conservation of mass for finance.<br/><br/>Everything a company has (Assets) was funded by either borrowing (Liabilities) or owners' capital (Equity).</p>
                <div class="my-6 text-xl lg:text-4xl font-mono glass-panel p-4 lg:p-6 rounded-2xl shadow-xl border border-gray-700 text-center tracking-widest">
                    <span class="text-emerald-400 font-black">A</span> <span class="text-gray-500">=</span> <span class="text-rose-500 font-black">L</span> <span class="text-gray-500">+</span> <span class="text-blue-500 font-black">E</span>
                </div>` 
            },
            { 
                title: "Case Study: Target Corp.", icon: "fa-bullseye", 
                content: `<p>Let's look at retail giant <strong>Target Corp.</strong><br/><br/>Their Assets include ~2,000 physical stores, distribution centers, cash, and inventory. Target also utilizes leverage. Creditors have the first claim on assets.</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div class="bg-gray-800 p-4 rounded-xl border-t-4 border-emerald-500">
                        <h4 class="font-bold text-emerald-400 mb-2 text-sm"><i class="fa-solid fa-cart-shopping mr-2"></i> Assets</h4>
                        <ul class="font-mono text-[11px] lg:text-xs text-gray-300 space-y-1">
                            <li>Cash: ~$3.8B</li>
                            <li>Inventory: ~$11.9B</li>
                            <li>Property: ~$32.5B</li>
                            <li class="pt-1 font-bold text-emerald-300 border-t border-gray-700 mt-1">Total: $53.2B</li>
                        </ul>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border-t-4 border-rose-500">
                        <h4 class="font-bold text-rose-400 mb-2 text-sm"><i class="fa-solid fa-landmark mr-2"></i> Liabilities</h4>
                        <ul class="font-mono text-[11px] lg:text-xs text-gray-300 space-y-1">
                            <li>A/P: ~$14.1B</li>
                            <li>Debt: ~$14.3B</li>
                            <li>Other: ~$9.2B</li>
                            <li class="pt-1 font-bold text-rose-300 border-t border-gray-700 mt-1">Total: $37.6B</li>
                        </ul>
                    </div>
                </div>
                <div class="mt-4 bg-blue-900/20 border-l-4 border-blue-500 p-4 rounded-r-xl">
                    <p class="text-sm">Rearranging the equation: <strong class="text-blue-400">E = A - L</strong>. If Target sold all assets and paid all debt, <strong>$15.6B</strong> remains for shareholders.</p>
                </div>` 
            },
            { 
                title: "Pillar 1: Paid-in Capital", icon: "fa-hand-holding-dollar", 
                content: `<p>Equity is divided into two pillars. The first is <strong>Paid-in Capital</strong> (Contributed Capital). This is the actual cash investors handed to Target during IPOs or secondary offerings.</p>
                <div class="mt-4 grid gap-2">
                    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 font-mono text-xs font-bold text-gray-300"><i class="fa-solid fa-caret-right text-amber-500 mr-2"></i> Common Stock (Par)</div>
                    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 font-mono text-xs font-bold text-gray-300"><i class="fa-solid fa-caret-right text-amber-500 mr-2"></i> Additional Paid-In Capital (APIC)</div>
                </div>` 
            },
            { 
                title: "Pillar 2: Earned Capital", icon: "fa-gears", 
                content: `<p>The second pillar is dynamically generated by the company through operations.<br/><br/><strong>Retained Earnings</strong> is the cumulative snowball of every dollar of net profit ever made, minus every dividend ever paid.</p>
                <div class="mt-4 bg-gray-900 p-4 rounded-xl border border-gray-800 text-sm">
                    The other part of Earned Capital is <strong>AOCI (Accumulated Other Comprehensive Income)</strong>. It is a parking lot for market noise (unrealized gains/losses) that bypasses the income statement.
                </div>` 
            },
            { 
                title: "Treasury Stock", icon: "fa-rotate-left", 
                content: `<p>Target's historical gross Retained Earnings is <strong>$15.8B</strong>, but we report a net of $8.6B. Where did the $7.2B go?</p>
                <p class="mt-4"><strong>Treasury Stock</strong>. When a company buys back its own shares, it creates a significant negative weight (contra-equity account) that pulls total equity down.</p>` 
            },
            {
                title: "Book vs. Market", icon: "fa-arrows-split-up-and-left",
                content: `<p class="mb-4">The Balance Sheet reports historical <strong>Book Value</strong> based on accounting rules. The public markets trade on <strong>Market Value</strong>, which prices in future expectations and growth.</p>
                <div class="bg-blue-900/20 border-l-4 border-blue-500 p-4 rounded-r-xl">
                    <strong>Interact with the Predictor Panel in the visualization area</strong> to test your intuition on how the market currently values J&J versus Pfizer compared to their strict accounting book value.
                </div>`
            },
            {

                    <button onclick="window.revealStep('negeq', 'negeq-btn', 4)" id="negeq-btn" class="w-full py-2 lg:py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all shadow-md text-sm">Reveal Reasons <i class="fa-solid fa-play ml-2"></i></button>
                    <div id="negeq-s1" class="hidden bg-gray-800 p-3 lg:p-4 rounded-xl border-l-4 border-emerald-500 shadow-md fade-in-up text-sm">
                        <strong class="text-emerald-400 block mb-1">1. Aggressive Buybacks (Healthy)</strong>
                        <span class="text-gray-300">Companies like McDonald's or Home Depot borrow at low rates to buy back stock. Treasury stock directly subtracts from total equity.</span>
                    </div>
                    <div id="negeq-s2" class="hidden bg-gray-800 p-3 lg:p-4 rounded-xl border-l-4 border-rose-500 shadow-md fade-in-up text-sm">
                        <strong class="text-rose-400 block mb-1">2. Accumulated Deficits (Struggling)</strong>
                        <span class="text-gray-300">Consistent net losses stack up in Retained Earnings year after year, wiping out invested capital (e.g., Boeing).</span>
                    </div>
                    <div id="negeq-s3" class="hidden bg-gray-800 p-3 lg:p-4 rounded-xl border-l-4 border-amber-500 shadow-md fade-in-up text-sm">
                        <strong class="text-amber-400 block mb-1">3. Debt-Funded Dividends (Cash-Out)</strong>
                        <span class="text-gray-300">Private equity firms issue bonds specifically to pay a large one-time cash dividend, draining Retained Earnings.</span>
                    </div>
                    <div id="negeq-s4" class="hidden bg-gray-800 p-3 lg:p-4 rounded-xl border-l-4 border-purple-500 shadow-md fade-in-up text-sm">
                        <strong class="text-purple-400 block mb-1">4. Sudden Asset Write-Downs (Shock)</strong>
                        <span class="text-gray-300">An impairment charge (like Kraft Heinz's brand write-down) creates a severe one-time loss flowing directly into Retained Earnings.</span>
                    </div>
                </div>`
            }
        ]
    },
    // --- CH 2: Share Lifecycle ---
    {
        title: "The Share Lifecycle",
        prefix: "",
        sections: [
            { 
                title: "Common Stock Hierarchy", icon: "fa-layer-group", 
                content: `<p>A single line item on the balance sheet hides a complex hierarchy. Every share goes through a strict lifecycle from creation to potential retirement.</p>` 
            },
            { 
                title: "Authorized & Issued", icon: "fa-gavel", 
                content: `<p><strong>Authorized Shares:</strong> The absolute maximum legal limit of shares a company is permitted to issue, as outlined in its corporate charter. The size of the "cookie jar."</p>
                <p class="mt-4"><strong>Issued Shares:</strong> The shares that have actually been created and sold to the public, insiders, or employees at some point. Once pulled from the Authorized pool, they are permanently "Issued."</p>` 
            },
            {
                title: "Case Study: The APE Story", icon: "fa-film",
                content: `<div class="flex items-center gap-4 mb-4 bg-gray-800 p-3 rounded-xl border border-gray-700">

                </div>
                <div class="bg-gray-900 p-4 lg:p-5 rounded-xl border border-gray-800 text-sm space-y-4">
                    <p><strong class="text-blue-400 font-bold">The Loophole:</strong> In 2022, AMC needed cash but lacked authorized common shares. They issued APE (AMC Preferred Equity) units as a dividend to bypass this limit and raise fresh capital.</p>
                    <p><strong class="text-blue-400 font-bold">The Divergence:</strong> Though economically identical to common stock, APE traded at a steep discount due to retail loyalty to the original AMC ticker and institutional arbitrage.</p>
                    <p><strong class="text-blue-400 font-bold">The Resolution:</strong> In 2023, AMC settled lawsuits, executed a 1-for-10 reverse split, and converted all APE back into standard common stock, securing their capital needs.</p>
                </div>`
            },
            { 
                title: "Treasury & Outstanding", icon: "fa-users", 
                content: `<p><strong>Treasury Shares:</strong> Repurchased stock that sits dead in the vault. No dividends, no voting power.</p>
                <p class="mt-4"><strong>Outstanding Shares:</strong> The most important metric. These are the active shares held by the public used to calculate Market Cap and EPS.</p>
                <div class="mt-6 bg-emerald-900/30 border border-emerald-500/50 p-3 lg:p-4 rounded-xl text-center font-mono text-xs lg:text-sm text-emerald-100 break-words">
                    <span class="text-blue-300">ISSUED</span> = <span class="text-emerald-400 font-bold">OUTSTANDING</span> + <span class="text-rose-400">TREASURY</span>
                </div>` 
            },
            { 
                title: "The Dilution Offset", icon: "fa-arrows-spin", 
                content: `<p>To stop their stock price from bleeding out due to endless SBC dilution, mature companies (like Apple or Meta) use <strong>real cash</strong> to buy shares back on the open market.</p>
                <div class="mt-4 bg-gray-800 p-4 rounded-xl border border-gray-700 text-sm text-gray-300">
                    They move shares from Outstanding back to Treasury, keeping the total pool flat. This proves SBC is ultimately a significant real-cash cost!
                </div>` 
            }
        ]
    },
    // --- CH 3: Priority & Preferred ---
    {
        title: "Capital Priority",
        prefix: "",
        sections: [
            { 
                title: "The Priority Waterfall", icon: "fa-water", 
                content: `<p>Not all capital providers are treated equally. In the event of bankruptcy (liquidation) or when distributing cash, there is a strict legal hierarchy.</p>` 
            },
            { 
                title: "1. Creditors (Liabilities)", icon: "fa-file-invoice-dollar", 
                content: `<p>Imagine a waterfall of cash. Creditors catch the water first. They must be made entirely whole before equity holders receive a penny.</p>` 
            },
            { 
                title: "2. Preferred Stock", icon: "fa-medal", 
                content: `<p>A hybrid security sitting between debt and common equity. They usually have no voting rights, but receive a fixed dividend and have a priority claim over common stock in liquidation.</p>

                    <ul class="list-disc pl-5 space-y-1 mb-3 text-gray-400 text-xs lg:text-sm">
                        <li>The annual dividend is <strong class="text-gray-200">$8 per share</strong> (8% of $100).</li>

    // --- CH 4: Actions & Yields ---
    {
        title: "Corporate Actions",
        prefix: "",
        sections: [
            { 
                title: "Rewarding Shareholders", icon: "fa-gift",

            },
            { 
                title: "Cash Dividends", icon: "fa-money-bill-wave", 
                content: `<p>When a company declares a Cash Dividend, wealth physically leaves the company.</p>
                <div class="mt-4 bg-gray-800 p-4 rounded-xl border-l-4 border-rose-500 shadow-lg">

                title: "Stock Splits", icon: "fa-scissors",

                <div class="mt-4 bg-gray-800 p-4 rounded-xl border-l-4 border-blue-500 shadow-lg">
                    <h4 class="font-bold text-blue-400 mb-1"><i class="fa-solid fa-equals mr-2"></i>No Accounting Change:</h4>
                    <p class="text-sm">The total accounting balances do not change. 1 share at $100 simply becomes 2 shares at $50. Total Assets and Total Equity remain exactly the same.</p>
                </div>` 
            },

const setStyles = (id, styles) => { const el = document.getElementById(id); if (el) Object.assign(el.style, styles); };
const setAttr = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
const toggleOverlay = (id, isActive) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (isActive) {
        el.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
        el.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto', 'z-50');
    } else {
        el.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
        el.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto', 'z-50');
    }
};

// --- INIT & NAV ---
function init() {
    renderNav();
    switchTab(0);
}

function renderNav() {
    const navContainer = document.getElementById('nav-container');
    TABS.forEach((tab, idx) => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${idx}`;
        btn.className = `px-3 lg:px-4 py-1.5 lg:py-2 rounded-full text-xs lg:text-sm font-bold transition-all whitespace-nowrap border border-transparent shrink-0`;
        btn.textContent = tab;
        btn.onclick = () => switchTab(idx);
        navContainer.appendChild(btn);
    });
}

function switchTab(idx) {
    activeTab = idx;
    sequenceStates = { wacs: 0, tsm: 0, calc: 0, negeq: 0, dilcycle: 0 }; 
    
    TABS.forEach((_, i) => {
        const btn = document.getElementById(`nav-btn-${i}`);
        if (i === idx) {
            btn.className = `px-3 lg:px-4 py-1.5 lg:py-2 rounded-full text-xs lg:text-sm font-bold transition-all whitespace-nowrap bg-blue-600/20 text-blue-400 border-blue-500/50 shrink-0`;
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
            btn.className = `px-3 lg:px-4 py-1.5 lg:py-2 rounded-full text-xs lg:text-sm font-bold transition-all whitespace-nowrap text-gray-400 hover:text-gray-200 hover:bg-gray-800 border-transparent shrink-0`;
        }
    });

    const mainContent = document.getElementById('main-content');
    const progress = (idx / (TABS.length - 1)) * 100;
    document.getElementById('chapter-progress').style.width = `${progress}%`;

    if (idx < 8) {
        mainContent.innerHTML = generateSplitViewHTML(idx);
        setupObserver(idx);
    } else {
        const container = document.getElementById('scroll-container');
        if (container && container._scrollListener) {
            container.removeEventListener('scroll', container._scrollListener);
        }
        renderFinalExam();
    }
}

window.checkRoeAnswer = function(opt) {
    const fb = document.getElementById('roe-feedback');
    fb.classList.remove('hidden', 'bg-rose-900/30', 'border-rose-500/50', 'text-rose-300', 'bg-emerald-900/30', 'border-emerald-500/50', 'text-emerald-300');
    fb.classList.add('border');

    // Reset buttons
    ['A','B','C','D'].forEach(l => {
        const b = document.getElementById('roe-btn-'+l);
        if(b) b.className = "w-full text-left bg-gray-800 p-3 lg:p-4 rounded-xl border border-gray-700 hover:bg-gray-700 transition-colors text-sm shadow-md";
    });

    const btn = document.getElementById('roe-btn-'+opt);

    if(opt === 'D') {
        btn.className = "w-full text-left bg-emerald-900/30 p-3 lg:p-4 rounded-xl border border-emerald-500 text-sm shadow-md";
        fb.classList.add('bg-emerald-900/30', 'border-emerald-500/50', 'text-emerald-300');
        fb.innerHTML = `<strong><i class="fa-solid fa-check mr-2"></i> Correct!</strong> When the denominator is very small due to significant buybacks, modest net income produces an artificially high ROE.`;
        if(!answeredInteractions.has('roe')) { addXP(50); fireConfetti(30); }
    } else {
        btn.className = "w-full text-left bg-rose-900/30 p-3 lg:p-4 rounded-xl border border-rose-500 text-sm shadow-md shake";
        setTimeout(() => btn.classList.remove('shake'), 500);
        fb.classList.add('bg-rose-900/30', 'border-rose-500/50', 'text-rose-300');
        let explanation = "";
        if(opt === 'A') explanation = "Adding back treasury stock increases the denominator, which actually lowers the overall ROE calculation.";
        if(opt === 'B') explanation = "GAAP requires treasury stock to be a reduction of equity; this is an analyst-driven choice, not a standard rule.";
        if(opt === 'C') explanation = "Treasury stock is legally not an asset and does not provide future economic benefits like other standard productive assets do.";
        fb.innerHTML = `<strong><i class="fa-solid fa-xmark mr-2"></i> Incorrect.</strong> ${explanation}`;
    }
    answeredInteractions.add('roe');
};

window.advanceSequence = function(prefix, btnId, maxSteps) {
    const currentState = sequenceStates[prefix];
    if (currentState < maxSteps) {
        const nextEl = document.getElementById(`${prefix}-s${currentState + 2}`);
        if (nextEl) {
            nextEl.classList.remove('hidden');

                if (finalEl) finalEl.classList.remove('hidden');
            }
        }
    }
};

function setupObserver(tabIdx) {
    const container = document.getElementById('scroll-container');
    const sections = Array.from(document.querySelectorAll('.ch-section'));

    if (container._scrollListener) {
        container.removeEventListener('scroll', container._scrollListener);
    }

    let ticking = false;
    let currentActive = -1;

    container._scrollListener = () => {
        if (!ticking) {
            window.requestAnimationFrame(() => {
                const containerRect = container.getBoundingClientRect();
                const focusY = containerRect.top + (containerRect.height * 0.4);

                let minDistance = Infinity;
                let closestIdx = 0;

                sections.forEach(sec => {
                    const rect = sec.getBoundingClientRect();
                    const secCenter = rect.top + (rect.height / 2);
                    const distance = Math.abs(focusY - secCenter);

                    if (distance < minDistance) {
                        minDistance = distance;
                        closestIdx = parseInt(sec.getAttribute('data-index'));
                    }
                });

                if (container.scrollHeight - container.scrollTop <= container.clientHeight + 5) {
                    closestIdx = sections.length - 1;
                }

                if (closestIdx !== currentActive) {
                    currentActive = closestIdx;
                    updateViz(tabIdx, currentActive);
                }
                
                ticking = false;
            });
            ticking = true;
        }
    };

    container.addEventListener('scroll', container._scrollListener);
    setTimeout(() => container._scrollListener(), 50);
}

function updateViz(tabIdx, idx) {
    CHAPTERS[tabIdx].sections.forEach((_, i) => {
        const sec = document.getElementById(`sec-${tabIdx}-${i}`);
        const iconBg = document.getElementById(`icon-bg-${tabIdx}-${i}`);

        if (sec && iconBg && icon) {
            if (i === idx) {

                icon.classList.remove('text-gray-500'); icon.classList.add('text-blue-400');
            } else {
                sec.className = "ch-section min-h-[40vh] lg:min-h-[50vh] flex flex-col justify-center transition-all duration-700 ease-in-out opacity-20 transform translate-y-8 py-6 lg:py-10";

}

function renderFinalExam() {
    const mainContent = document.getElementById('main-content');
    if(quizSubmitted) {
        showResults(mainContent, Object.keys(quizAnswers).reduce((acc, curr) => acc + (quizAnswers[curr] === QUIZ_QUESTIONS[curr].answer ? 1 : 0), 0));
        return;
    }

    let questionsHTML = '';
    QUIZ_QUESTIONS.forEach((q, qIndex) => {
        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `<button onclick="handleQuizSelect(${qIndex}, ${optIndex})" id="btn-${qIndex}-${optIndex}" class="w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-gray-700 bg-gray-800 hover:bg-gray-700 hover:border-blue-500 transition-all font-medium text-gray-200 text-sm lg:text-base">${opt}</button>`;
        });
        questionsHTML += `<div class="glass-panel p-6 lg:p-8 rounded-2xl lg:rounded-3xl border border-gray-700 shadow-xl mb-6 lg:mb-8"><h3 class="text-xl lg:text-2xl font-black text-white mb-4 lg:mb-6">${qIndex + 1}. ${q.q}</h3><div class="grid grid-cols-1 gap-3" id="opts-${qIndex}">${optionsHTML}</div><div id="fb-${qIndex}" class="hidden mt-4 lg:mt-6 p-4 rounded-xl border"></div></div>`;
    });

    mainContent.innerHTML = `<div class="w-full h-full overflow-y-auto custom-scroll bg-[#0b0c10] p-4 lg:p-12 relative z-10"><div class="max-w-4xl mx-auto"><div class="text-center mb-8 lg:mb-12"><div class="inline-block p-4 rounded-full bg-blue-900/30 border border-blue-500/50 mb-4 shadow-lg shadow-blue-500/20"><i class="fa-solid fa-flag-checkered text-3xl lg:text-4xl text-blue-400"></i></div><h2 class="text-3xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2 lg:mb-4">Final Evaluation</h2><p class="text-gray-400 text-base lg:text-lg">Prove your mastery of Stockholders' Equity.</p></div>${questionsHTML}<div class="mt-8 lg:mt-12 text-center pb-20 lg:pb-24"><button onclick="submitExam()" class="w-full sm:w-auto px-8 lg:px-12 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-full text-lg lg:text-xl shadow-lg shadow-emerald-600/30 transition-transform hover:scale-105 pulse-glow">Submit Analyst Report <i class="fa-solid fa-paper-plane ml-2"></i></button></div></div></div>`;
}

window.handleQuizSelect = function(qIndex, optIndex) {
    quizAnswers[qIndex] = optIndex;
    const container = document.getElementById(`opts-${qIndex}`);
    const btns = container.querySelectorAll('button');
    btns.forEach((btn, i) => {
        if (i === optIndex) btn.className = "w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-blue-500 bg-blue-900/30 text-blue-200 font-bold transition-all text-sm lg:text-base";
        else btn.className = "w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-gray-700 bg-gray-800 hover:bg-gray-700 hover:border-blue-500 transition-all font-medium text-gray-200 text-sm lg:text-base";
    });
};

window.submitExam = function() {
    if (Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length) {
        alert("Please complete all questions before submitting.");
        return;
    }
    let score = 0;
    QUIZ_QUESTIONS.forEach((q, idx) => {
        const selected = quizAnswers[idx];
        const fb = document.getElementById(`fb-${idx}`);
        const selectedBtn = document.getElementById(`btn-${idx}-${selected}`);
        const correctBtn = document.getElementById(`btn-${idx}-${q.answer}`);
        fb.classList.remove('hidden');
        if (selected === q.answer) {
            score++;
            selectedBtn.className = "w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-900/30 text-emerald-300 font-bold text-sm lg:text-base";
            fb.className = "mt-4 lg:mt-6 p-4 rounded-xl border border-emerald-500/50 bg-emerald-900/20 text-emerald-300 text-xs lg:text-sm fade-in-up";
            fb.innerHTML = `<strong><i class="fa-solid fa-check mr-2"></i> Correct!</strong> ${q.explanation}`;
        } else {
            selectedBtn.className = "w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-rose-500 bg-rose-900/30 text-rose-300 font-bold text-sm lg:text-base";
            correctBtn.className = "w-full text-left p-4 lg:p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-900/30 text-emerald-300 font-bold text-sm lg:text-base";
            fb.className = "mt-4 lg:mt-6 p-4 rounded-xl border border-rose-500/50 bg-rose-900/20 text-rose-300 text-xs lg:text-sm fade-in-up";
            fb.innerHTML = `<strong><i class="fa-solid fa-xmark mr-2"></i> Incorrect.</strong> ${q.explanation}`;
        }
        const container = document.getElementById(`opts-${idx}`);
        container.querySelectorAll('button').forEach(b => b.disabled = true);
    });
    quizSubmitted = true;
    setTimeout(() => { const mc = document.getElementById('main-content'); showResults(mc, score); }, 1500);
};

function showResults(container, score) {
    const passed = score >= 7;
    const percentage = Math.round((score / QUIZ_QUESTIONS.length) * 100);
    if (passed && score > 0) { addXP(500); fireConfetti(300); }
    container.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center p-4 lg:p-8 text-center fade-in bg-[#0b0c10] absolute inset-0 z-50"><div class="glass-panel p-8 lg:p-12 rounded-3xl border border-gray-700 shadow-2xl bg-gray-900 max-w-2xl w-full mx-4"><div class="w-20 h-20 lg:w-28 lg:h-28 rounded-full ${passed ? 'bg-emerald-900/50 text-emerald-400 border-emerald-500' : 'bg-rose-900/50 text-rose-400 border-rose-500'} flex items-center justify-center mb-6 lg:mb-8 text-4xl lg:text-6xl mx-auto border-4 shadow-[0_0_25px_currentColor]"><i class="fa-solid ${passed ? 'fa-medal' : 'fa-skull-crossbones'}"></i></div><h2 class="text-3xl lg:text-4xl font-black mb-3 lg:mb-4 text-white">Evaluation ${passed ? 'Passed' : 'Failed'}</h2><div class="text-5xl lg:text-7xl font-mono font-black mb-4 lg:mb-6 ${passed ? 'text-emerald-400' : 'text-rose-400'}">${percentage}%</div><div class="bg-gray-800 p-4 lg:p-6 rounded-2xl border border-gray-700 mb-6 lg:mb-8"><p class="text-gray-300 text-base lg:text-lg">Final Score: <strong class="text-white">${score} / ${QUIZ_QUESTIONS.length}</strong><br>Total XP Earned: <strong class="text-emerald-400 font-mono text-xl lg:text-2xl ml-2">${xpScore} XP</strong><br><br><span class="text-xs lg:text-sm font-medium leading-relaxed block">${passed ? 'BOO-YAH! Outstanding analysis.' : 'Review earlier chapters then restart.'}</span></p></div><button onclick="location.reload()" class="w-full sm:w-auto px-6 py-3 lg:px-10 lg:py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold text-base lg:text-lg transition-transform hover:scale-105 shadow-lg">Restart Analysis <i class="fa-solid fa-rotate-right ml-2 lg:ml-3"></i></button></div></div>`;
}

const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let isAnimating = false;
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f43f5e', '#f59e0b'];
function fireConfetti(amount) {
    for (let i = 0; i < amount; i++) { particles.push({ x: canvas.width / 2, y: canvas.height / 2, vy: (Math.random() * -15) - 5, vx: (Math.random() * 20) - 10, size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], rotation: Math.random() * 360, rotationSpeed: (Math.random() * 10) - 5, shape: Math.random() > 0.5 ? 'circle' : 'square', opacity: 1 }); }
    if (!isAnimating) animateConfetti();
}
function animateConfetti() {
    if (particles.length === 0) { isAnimating = false; ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    isAnimating = true; ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i]; p.vy += 0.4; p.y += p.vy; p.x += p.vx; p.rotation += p.rotationSpeed; p.opacity -= 0.005;
        ctx.save(); ctx.globalAlpha = p.opacity; ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color; if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); } else { ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); } ctx.restore();
        if (p.y > canvas.height || p.opacity <= 0) { particles.splice(i, 1); i--; }
    }
    requestAnimationFrame(animateConfetti);
}

init();
</script>
</body>
</html>
