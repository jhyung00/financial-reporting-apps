<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Analysis & Shareholder Returns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow: hidden;
            font-size: 18px;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Slide Transition Effects */
        .slide-container {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Progress Bar */
        #progress-bar {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* Flip Card Effect - REBUILT FOR MOBILE STABILITY */
        .perspective-1000 { perspective: 1000px; }
        
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            /* Use CSS Grid so the container automatically sizes to the tallest face without needing overflow: auto */
            display: grid; 
            will-change: transform; /* Hardware acceleration hint */
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            grid-area: 1 / 1; /* Both occupy the exact same grid cell */
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Critical prefix for iOS Safari */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transform: translateZ(0); /* Prevents rendering crashes on mobile GPUs */
            -webkit-transform: translateZ(0);
        }
        .flip-card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            color: #0f172a;
            z-index: 2; /* Ensure front is painted on top initially */
        }
        .flip-card-front:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15);
        }
        .flip-card-back {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            /* Combine transforms to maintain hardware acceleration */
            transform: rotateY(180deg) translateZ(0); 
            -webkit-transform: rotateY(180deg) translateZ(0);
            border: 1px solid #334155;
            /* overflow-y: auto; <-- Removed to prevent nested scrolling crashes on iOS */
        }
        
        .flip-card-back.accent-blue { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); border-color: #3b82f6; }
        .flip-card-back.accent-emerald { background: linear-gradient(135deg, #059669 0%, #047857 100%); border-color: #10b981; }
        .flip-card-back.accent-purple { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); border-color: #8b5cf6; }
        .flip-card-back.accent-amber { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); border-color: #f59e0b; }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* Custom Scrollbar for TOC & Content */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }

        /* Quiz Buttons */
        .quiz-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        .quiz-btn:hover:not(:disabled) {
            transform: scale(1.01);
            border-color: #3b82f6;
            background-color: #f0f9ff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1);
        }
        .quiz-btn.correct {
            background-color: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }
        .quiz-btn.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
            opacity: 0.8;
        }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px; width: 28px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border: 3px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Gamification Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Header / Nav -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-40 relative shadow-sm shrink-0">
        <!-- Progress Bar -->
        <div id="progress-bar" class="absolute bottom-0 left-0 h-1 bg-blue-500 transition-all duration-300" style="width: 0%"></div>
        
        <div class="flex items-center space-x-4">
            <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold shadow-md">
                <i class="fa-solid fa-magnifying-glass-chart text-sm"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800 tracking-tight hidden md:block">
                Stockholders' Equity Mastery
            </h1>
        </div>
        
        <div class="flex items-center space-x-6">
            <!-- XP Tracker -->
            <div class="hidden sm:flex items-center bg-slate-50 px-4 py-1.5 rounded-full border border-slate-200 shadow-sm">
                <i class="fa-solid fa-star text-amber-400 mr-2"></i>
                <span id="xp-display" class="font-mono font-bold text-emerald-600 transition-transform duration-300 inline-block">0</span>
                <span class="text-slate-500 text-xs ml-1 font-bold">XP</span>
            </div>

            <div class="text-sm text-slate-500 font-medium">Slide <span id="current-slide-num" class="text-slate-900 font-bold">1</span> <span class="text-slate-300 mx-1">/</span> <span id="total-slides" class="font-bold">?</span></div>
            <button onclick="toggleTOC()" class="p-2 hover:bg-slate-100 rounded-full transition-colors group">
                <i class="fa-solid fa-bars-staggered text-slate-500 group-hover:text-blue-600 text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Table of Contents Overlay -->
    <div id="toc-overlay" class="fixed inset-y-0 right-0 w-96 bg-white/95 backdrop-blur-xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h2 class="font-bold text-xl text-blue-600"><i class="fa-solid fa-map text-blue-500 mr-2"></i> Mission Manifest</h2>
            <button onclick="toggleTOC()" class="text-slate-400 hover:text-slate-800 transition-transform hover:rotate-90"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 custom-scroll space-y-1" id="toc-list">
            <!-- Injected by JS -->
        </div>
    </div>

    <!-- Main Viewport -->
    <main class="flex-1 relative overflow-hidden bg-slate-50">
        <!-- Ambient Background -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
            <div class="absolute -top-[30%] -left-[10%] w-[800px] h-[800px] bg-blue-300/10 rounded-full blur-[120px]"></div>
            <div class="absolute -bottom-[30%] -right-[10%] w-[800px] h-[800px] bg-indigo-300/10 rounded-full blur-[120px]"></div>
        </div>

        <!-- Slides Wrapper -->
        <div id="slides-wrapper" class="w-full h-full flex slide-container">
            <!-- Injected by JS -->
        </div>
        
        <!-- Global Navigation -->
        <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-white/90 border border-slate-200 hover:bg-slate-100 text-slate-600 hover:text-blue-600 flex items-center justify-center backdrop-blur shadow-lg transition-all z-30 group">
            <i class="fa-solid fa-chevron-left text-xl group-hover:-translate-x-1 transition-transform"></i>
        </button>
        <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-500/30 transition-all z-30 group pulse-glow">
            <i class="fa-solid fa-chevron-right text-xl group-hover:translate-x-1 transition-transform"></i>
        </button>
    </main>

    <!-- App Logic -->
    <script>
        // Gamification State
        let currentSlide = 0;
        let xpScore = 0;
        let answeredQuizzes = new Set();

        function addXP(amount) {
            xpScore += amount;
            const xpEl = document.getElementById('xp-display');
            xpEl.innerText = xpScore;
            xpEl.classList.add('scale-150', 'text-emerald-500');
            setTimeout(() => {
                xpEl.classList.remove('scale-150', 'text-emerald-500');
            }, 300);
        }

        // Helpers
        function revealElement(id, btnId = null) {
            const el = document.getElementById(id);
            if(el) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            }
            if(btnId) document.getElementById(btnId).style.display = 'none';
        }

        // Sequential Step Revealer
        function advanceSequence(sequenceId, btnId) {
            const container = document.getElementById(sequenceId);
            if (!container) return;
            
            const steps = container.querySelectorAll('.sequence-step.hidden');
            
            if (steps.length > 0) {
                steps[0].classList.remove('hidden');
                steps[0].classList.add('fade-in');
            }
            
            if (steps.length <= 1) {
                const btn = document.getElementById(btnId);
                if (btn) btn.style.display = 'none';
                
                const finalReveal = document.getElementById(sequenceId + '-final');
                if (finalReveal) {
                    finalReveal.classList.remove('hidden');
                    finalReveal.classList.add('fade-in');
                }
            }
        }

        // Interactive Premium Guesser
        function updatePremiumGuess(val, isJJ = true) {
            if (isJJ) {
                document.getElementById('guess-val-jj').innerText = parseFloat(val).toFixed(1) + 'x';
            } else {
                document.getElementById('guess-val-pfizer').innerText = parseFloat(val).toFixed(1) + 'x';
            }
        }
        function checkPremiumGuess() {
            const valJJ = parseFloat(document.getElementById('premium-slider-jj').value);
            const feedbackJJ = document.getElementById('premium-feedback-jj');
            document.getElementById('premium-slider-jj').disabled = true;
            
            feedbackJJ.classList.remove('hidden');
            feedbackJJ.classList.add('fade-in');
            
            let correctJJ = false;
            if(Math.abs(valJJ - 4.8) <= 0.2) {
                feedbackJJ.innerHTML = `<div class="text-emerald-600 font-bold text-xl"><i class="fa-solid fa-bullseye mr-2"></i> BOO-YAH! Spot on! J&J's multiple is ~4.8x.</div>`;
                correctJJ = true;
                fireConfetti(50);
            } else {
                feedbackJJ.innerHTML = `<div class="text-blue-600 font-bold text-xl"><i class="fa-solid fa-arrow-right-arrow-left mr-2"></i> Close, but J&J's multiple is ~4.8x!</div>`;
            }
            
            const valPfizer = parseFloat(document.getElementById('premium-slider-pfizer').value);
            const feedbackPfizer = document.getElementById('premium-feedback-pfizer');
            document.getElementById('premium-slider-pfizer').disabled = true;
            
            feedbackPfizer.classList.remove('hidden');
            feedbackPfizer.classList.add('fade-in');
            
            let correctPfizer = false;
            if(Math.abs(valPfizer - 1.8) <= 0.2) {
                feedbackPfizer.innerHTML = `<div class="text-emerald-600 font-bold text-xl"><i class="fa-solid fa-bullseye mr-2"></i> BOO-YAH! Spot on! Pfizer's multiple is ~1.8x.</div>`;
                correctPfizer = true;
                fireConfetti(50);
            } else {
                feedbackPfizer.innerHTML = `<div class="text-blue-600 font-bold text-xl"><i class="fa-solid fa-arrow-right-arrow-left mr-2"></i> Close, but Pfizer's multiple is ~1.8x!</div>`;
            }
            
            if (correctJJ && correctPfizer && !answeredQuizzes.has('premium')) {
                addXP(100); answeredQuizzes.add('premium');
            } else if ((correctJJ || correctPfizer) && !answeredQuizzes.has('premium')) {
                addXP(50); answeredQuizzes.add('premium');
            }
            
            revealElement('actual-divergence', 'guess-btn');
        }

        // Spot the Trap Interaction
        function selectTrap(isTrap, elId) {
            const el = document.getElementById(elId);
            const feedback = document.getElementById('trap-feedback');
            
            ['trap-1', 'trap-2', 'trap-3'].forEach(id => {
                if(document.getElementById(id)) {
                    document.getElementById(id).classList.remove('border-emerald-400', 'bg-emerald-50', 'border-rose-400');
                }
            });

            if(isTrap) {
                el.classList.add('border-emerald-400', 'bg-emerald-50');
                feedback.innerHTML = `<span class="text-emerald-600 font-bold text-lg"><i class="fa-solid fa-shield-halved mr-2"></i> BOO-YAH! Correct! That is the mathematically inflated, distorted metric.</span>`;
                fireConfetti(50);
                if(!answeredQuizzes.has('trap-roe')) { addXP(100); answeredQuizzes.add('trap-roe'); }
                revealElement('trap-explanation');
            } else {
                el.classList.add('shake', 'border-rose-400');
                setTimeout(() => el.classList.remove('shake', 'border-rose-400'), 500);
                feedback.innerHTML = `<span class="text-rose-600 font-bold text-lg"><i class="fa-solid fa-triangle-exclamation mr-2"></i> That metric has been adjusted for reality. Find the distorted one!</span>`;
            }
            feedback.classList.remove('hidden');
        }

        function executeCalcStep(stepId, btnId) {
            revealElement(stepId);
            const btn = document.getElementById(btnId);
            if(!btn) return;
            
            const nextStepNum = parseInt(btn.getAttribute('data-next'));
            if (nextStepNum <= 3) {
                btn.innerHTML = `Execute Step ${nextStepNum} <i class="fa-solid fa-arrow-down ml-2"></i>`;
                btn.setAttribute('onclick', `executeCalcStep('calc-step-${nextStepNum}', '${btnId}')`);
                btn.setAttribute('data-next', nextStepNum + 1);
            } else {
                btn.style.display = 'none';
                revealElement('calc-final');
            }
        }

        function executeTsmChartStep(stepId, btnId) {
            const stepToReveal = document.getElementById(stepId);
            const arrowToReveal = document.getElementById(stepId + '-arrow');
            
            if (stepToReveal) {
                stepToReveal.classList.remove('hidden');
                stepToReveal.classList.add('fade-in');
            }
            if (arrowToReveal) {
                arrowToReveal.classList.remove('hidden');
                arrowToReveal.classList.add('fade-in');
            }
            
            const btn = document.getElementById(btnId);
            if(!btn) return;
            const nextStepNum = parseInt(btn.getAttribute('data-next'));
            if (nextStepNum <= 3) {
                btn.innerHTML = `Reveal Step ${nextStepNum} <i class="fa-solid fa-arrow-down ml-2"></i>`;
                btn.setAttribute('onclick', `executeTsmChartStep('tsm-chart-step-${nextStepNum}', '${btnId}')`);
                btn.setAttribute('data-next', nextStepNum + 1);
            } else {
                btn.style.display = 'none';
                revealElement('tsm-chart-sequence-final');
            }
        }

        // --- SLIDE DATA INTEGRATION ---
        const slidesData = [
            // --- PART 1: THE ANATOMY OF EQUITY ---
            {
                title: "Mission Briefing",
                type: "intro",
                content: `
                    <div class="text-center max-w-4xl mx-auto pt-4">
                        <div class="mb-6 inline-flex p-6 rounded-3xl bg-white border border-slate-100 shadow-2xl shadow-blue-500/10">
                            <i class="fa-solid fa-book-journal-whills text-6xl text-blue-600"></i>
                        </div>
                        <h1 class="text-5xl md:text-6xl font-black mb-6 text-slate-900 tracking-tight leading-tight">Stockholders' Equity Mastery</h1>
                        <p class="text-xl text-slate-600 mb-10 font-light leading-relaxed max-w-2xl mx-auto">
                            Stockholders' Equity is more than an accounting plug. It is the financial autobiography of a business. Your mission: demystify the balance sheet and uncover the hidden realities of share lifecycles, dilution, and true profitability.
                        </p>
                        <button onclick="nextSlide()" class="px-8 py-4 bg-slate-900 hover:bg-black text-white rounded-full font-bold text-lg shadow-xl shadow-slate-900/20 transition-all transform hover:scale-105 flex items-center mx-auto">
                            Begin Investigation <i class="fa-solid fa-arrow-right ml-3"></i>
                        </button>
                    </div>
                `
            },
            {
                title: "The Fundamental Equation",
                type: "content",
                content: `
                    <h2 class="text-3xl font-bold mb-6 text-center text-slate-900"><i class="fa-solid fa-scale-balanced text-blue-600 mr-3"></i> The Fundamental Equation</h2>
                    <p class="text-center text-slate-600 mb-8 max-w-3xl mx-auto">Before we understand Equity, we must start with the bedrock of accounting. Think of this as the law of conservation of mass for finance. Everything a company has (Assets) was funded by either borrowing (Liabilities) or owners' capital (Equity).</p>
                    
                    <div class="flex flex-col items-center justify-center space-y-12 w-full max-w-5xl mx-auto">
                        <div class="text-4xl md:text-6xl font-mono glass-panel p-8 md:p-12 rounded-3xl shadow-xl border border-slate-200 w-full text-center tracking-widest">
                            <span class="text-emerald-600 font-black">A</span> <span class="text-slate-300">=</span> <span class="text-rose-500 font-black">L</span> <span class="text-slate-300">+</span> <span class="text-blue-600 font-black">E</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full">
                            ${createFlipCard("Assets", "What the company owns<br>(Cash, Inventory, Property)", "fa-solid fa-boxes-stacked", true, "accent-emerald")}
                            ${createFlipCard("Liabilities", "What the company owes<br>(Debt, Payables)", "fa-solid fa-file-invoice-dollar", true, "accent-rose")}
                            ${createFlipCard("Equity", "What is left for the owners<br>(Residual Interest)", "fa-solid fa-building-columns", true, "accent-blue")}
                        </div>
                    </div>
                `
            },
            {
                title: "Case Study: Target Corporation",
                type: "content",
                content: `
                    <h2 class="text-3xl font-bold mb-6 text-center text-slate-900"><i class="fa-solid fa-bullseye text-rose-600 mr-3"></i> Case Study: Target Corp.</h2>
                    <p class="text-center text-slate-600 mb-8 max-w-3xl mx-auto">Let's look at how the fundamental equation plays out in the real world for retail giant Target.</p>
                    
                    <div class="flex flex-col md:flex-row gap-6 max-w-6xl mx-auto w-full items-stretch">
                        <div class="glass-panel p-8 rounded-3xl border-t-8 border-emerald-500 shadow-xl bg-white flex-1 relative">
                            <h3 class="font-black text-xl mb-6 text-slate-900"><i class="fa-solid fa-cart-shopping text-emerald-500 mr-2"></i> Assets: What You Own</h3>
                            <p class="text-sm text-slate-600 mb-4">~2,000 physical stores, distribution centers, cash, and massive inventory.</p>
                            <ul class="font-mono text-sm text-slate-700 space-y-2 border-l-4 border-emerald-200 pl-4">
                                <li>Cash: ~$3.8B</li>
                                <li>Inventory: ~$11.9B</li>
                                <li>Property: ~$32.5B</li>
                                <li>Other: ~$5.0B</li>
                                <li class="pt-2 font-bold text-emerald-600 border-t border-slate-100 mt-2">Total Assets: ~$53.2 Billion</li>
                            </ul>
                        </div>
                        
                        <div class="glass-panel p-8 rounded-3xl border-t-8 border-rose-500 shadow-xl bg-white flex-1 relative">
                            <h3 class="font-black text-xl mb-6 text-slate-900"><i class="fa-solid fa-landmark text-rose-500 mr-2"></i> Liabilities: What You Owe</h3>
                            <p class="text-sm text-slate-600 mb-4">Target utilizes leverage. Creditors have the first claim on assets.</p>
                            <ul class="font-mono text-sm text-slate-700 space-y-2 border-l-4 border-rose-200 pl-4">
                                <li>Accounts Payable: ~$14.1B</li>
                                <li>Long-term Debt: ~$14.3B</li>
                                <li>Other Liab: ~$9.2B</li>
                                <li class="pt-2 font-bold text-rose-600 border-t border-slate-100 mt-2">Total Liab: ~$37.6 Billion</li>
                            </ul>
                        </div>

                        <div class="glass-panel p-8 rounded-3xl border-t-8 border-blue-500 shadow-xl bg-slate-900 text-white flex-1 relative">
                            <h3 class="font-black text-xl mb-6 text-white"><i class="fa-solid fa-coins text-blue-400 mr-2"></i> Equity: The Residual</h3>
                            <p class="text-sm text-slate-300 mb-4">Rearranging the equation: <strong class="text-emerald-400">E = A - L</strong>. If Target sold all assets and paid all debt, this remains.</p>
                            <ul class="font-mono text-sm text-slate-200 space-y-2 border-l-4 border-blue-400 pl-4 mt-auto">
                                <li>Assets: $53.2B</li>
                                <li>Less Liab: ($37.6B)</li>
                                <li class="pt-2 font-black text-2xl text-blue-400 border-t border-slate-700 mt-2">Total Equity: $15.6B</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            {
                title: "Book vs. Market Value",

                        <button onclick="nextSlide()" class="px-10 py-4 bg-slate-900 hover:bg-black text-white rounded-full font-bold text-lg shadow-xl shadow-slate-900/30 transition-transform hover:scale-105 pulse-glow">
                            Commence Final Exam <i class="fa-solid fa-flag-checkered ml-2"></i>
                        </button>
                    </div>
                `
            },

            // --- FINAL EXAM ---
            {
                title: "Final Exam: Q1", type: "final_quiz",
                question: "1. If a company sells all its assets and pays off all its debt, what is the remaining cash called?",
                options: [
                    { text: "Retained Earnings", correct: false },
                    { text: "Stockholder's Equity", correct: true },
                    { text: "Net Income", correct: false },
                    { text: "Treasury Stock", correct: false }
                ]
            },
            {
                title: "Final Exam: Q2", type: "final_quiz",
                question: "2. Which type of stock accumulates missed dividends that must be paid before common stockholders receive anything?",
                options: [
                    { text: "Callable Preferred", correct: false },
                    { text: "Treasury Stock", correct: false },
                    { text: "Cumulative Preferred", correct: true },
                    { text: "Class A Common", correct: false }
                ]
            },
            {
                title: "Final Exam: Q3", type: "final_quiz",
                question: "3. Which formula correctly defines 'Outstanding Shares'?",
                options: [
                    { text: "Authorized - Issued", correct: false },
                    { text: "Issued + Treasury", correct: false },
                    { text: "Issued - Treasury", correct: true },
                    { text: "Authorized - Treasury", correct: false }
                ]
            },
            {
                title: "Final Exam: Q4", type: "final_quiz",
                question: "4. Why do certain financial events, like foreign currency translation adjustments, flow into OCI rather than Net Income?",
                options: [
                    { text: "Because they are illegal to report to the IRS", correct: false },
                    { text: "To prevent unrealized, non-operational market fluctuations from distorting core Earnings Per Share", correct: true },
                    { text: "Because they represent cash dividends paid to shareholders", correct: false },
                    { text: "Because they only affect Preferred Stockholders", correct: false }
                ]
            },
            {
                title: "Final Exam: Q5", type: "final_quiz",
                question: "5. Issuing Restricted Stock Units (RSUs) to employees causes dilution. How do mature companies attempt to offset this?",
                options: [
                    { text: "By declaring stock splits", correct: false },
                    { text: "By pulling shares from the Authorized pool", correct: false },
                    { text: "By spending real cash to buy shares back on the open market (increasing Treasury stock)", correct: true },
                    { text: "By decreasing their Net Income", correct: false }
                ]
            },
            {
                title: "Final Exam: Q6", type: "final_quiz",
                question: "6. What is the primary difference between Basic EPS and Diluted EPS?",
                options: [
                    { text: "Basic EPS uses Gross Income, Diluted uses Net Income", correct: false },
                    { text: "Diluted EPS assumes all unvested RSUs, options, and convertible debt instantly become Outstanding shares", correct: true },
                    { text: "Diluted EPS includes Preferred Dividends in the numerator", correct: false },
                    { text: "Basic EPS includes Treasury stock in the denominator", correct: false }
                ]
            },
            {
                title: "Final Exam: Q7", type: "final_quiz",
                question: "7. When a company repurchases its own shares, how is the 'Treasury Stock' account treated?",
                options: [
                    { text: "As a short-term liability.", correct: false },
                    { text: "As a contra-equity account that reduces total equity.", correct: true },
                    { text: "As an operating expense on the income statement.", correct: false },
                    { text: "As an intangible asset.", correct: false }
                ]
            },
            {
                title: "Final Exam: Q8", type: "final_quiz",
                question: "8. A 'Stock Split' (e.g., Apple 4-for-1) does what to the financial statements?",
                options: [
                    { text: "Reduces Retained Earnings.", correct: false },
                    { text: "Increases Total Assets.", correct: false },
                    { text: "It is a non-monetary transaction with no financial statement effects.", correct: true },
                    { text: "Increases Additional Paid-In Capital.", correct: false }
                ]
            },
            {
                title: "Final Exam: Q9", type: "final_quiz",
                question: "9. When calculating ROE for a parent company, which equity figure should you use if they have a 'Noncontrolling Interest'?",
                options: [
                    { text: "Total Consolidated Equity", correct: false },
                    { text: "Equity Attributable to Parent Shareholders", correct: true },
                    { text: "Total Liabilities", correct: false },
                    { text: "Accumulated Deficit", correct: false }
                ]
            },
            {
                title: "Mission Debrief", type: "results",
                content: "" // Generated dynamically
            }
        ];

        // --- INIT ---
        function init() {
            document.getElementById('total-slides').innerText = slidesData.length;
            renderSlides();
            renderTOC();
            updateSlideView();
        }

        function createFlipCard(front, back, iconClass, compact = false, backColorClass = "accent-blue") {
            const pad = compact ? 'p-6' : 'p-8';
            return `
                <div class="flip-card w-full min-h-[240px] perspective-1000 group" onclick="this.classList.toggle('flipped')">
                    <div class="flip-card-inner">
                        <div class="flip-card-front ${pad}">
                            <i class="${iconClass} text-5xl mb-5 text-slate-800 group-hover:scale-110 transition-transform"></i>
                            <div class="font-black text-xl text-slate-900 text-center">${front}</div>
                            <div class="text-xs text-slate-400 mt-4 uppercase tracking-widest font-bold"><i class="fa-solid fa-rotate mr-1"></i> Flip</div>
                        </div>
                        <div class="flip-card-back ${backColorClass} p-6 text-sm">
                            <div class="font-black text-lg mb-3 border-b border-white/20 pb-2 w-full text-center">${front}</div>
                            <div class="text-white/90 leading-relaxed">${back}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSlides() {
            const wrapper = document.getElementById('slides-wrapper');
            wrapper.innerHTML = slidesData.map((slide, index) => {
                let innerContent = slide.content;
                
                if (slide.type === 'quiz' || slide.type === 'final_quiz') {
                    innerContent = `
                        <div class="max-w-4xl mx-auto w-full glass-panel p-8 md:p-12 rounded-3xl border border-slate-200 shadow-xl bg-white">
                            <h2 class="text-2xl md:text-3xl font-black mb-8 text-slate-900 leading-tight">${slide.question}</h2>
                            <div class="grid grid-cols-1 gap-4" id="quiz-options-${index}">
                                ${slide.options.map((opt, optIndex) => `
                                    <button 
                                        onclick="handleQuizAnswer(${index}, ${optIndex}, ${opt.correct})"
                                        class="quiz-btn w-full p-5 rounded-2xl text-left flex justify-between items-center group shadow-sm border-2 border-slate-100">
                                        <span class="text-lg font-medium">${opt.text}</span>
                                        <i class="fa-solid fa-circle-check text-2xl opacity-0 group-[.correct]:opacity-100 transition-opacity"></i>
                                    </button>
                                `).join('')}
                            </div>
                            <div id="quiz-feedback-${index}" class="hidden mt-8 p-6 rounded-2xl bg-slate-50 border border-slate-200 shadow-inner animate-fade-in-up text-base">
                                <div class="feedback-text mb-3"></div>
                                ${slide.explanation ? `<p class="text-slate-600 leading-relaxed">${slide.explanation}</p>` : ''}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="min-w-full h-full overflow-y-auto relative custom-scroll">
                        <div class="min-h-full flex flex-col items-center justify-center p-6 md:p-12 pb-24 pt-8"> 
                            ${innerContent || ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTOC() {
            document.getElementById('toc-list').innerHTML = slidesData.map((slide, index) => `
                <button onclick="goToSlide(${index})" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 text-sm text-slate-700 flex items-center transition-all group border border-transparent hover:border-slate-200">
                    <span class="w-8 font-mono font-bold text-slate-400 group-hover:text-blue-600">${index + 1}</span>
                    <span class="truncate group-hover:text-slate-900 font-bold">${slide.title}</span>
                </button>
            `).join('');
        }

        function updateSlideView() {
            document.getElementById('slides-wrapper').style.transform = `translateX(-${currentSlide * 100}%)`;
            document.getElementById('current-slide-num').innerText = currentSlide + 1;
            
            const progress = ((currentSlide) / (slidesData.length - 1)) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            if (slidesData[currentSlide].type === 'results') {
                showResults();
            }
        }

        function nextSlide() { if (currentSlide < slidesData.length - 1) { currentSlide++; updateSlideView(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlideView(); } }
        function goToSlide(index) { currentSlide = index; updateSlideView(); toggleTOC(); }
        function toggleTOC() { document.getElementById('toc-overlay').classList.toggle('translate-x-full'); }

        function handleQuizAnswer(slideIndex, optIndex, isCorrect) {
            const container = document.getElementById(`quiz-options-${slideIndex}`);
            const feedbackBox = document.getElementById(`quiz-feedback-${slideIndex}`);
            const feedbackText = feedbackBox.querySelector('.feedback-text');
            const buttons = container.querySelectorAll('button');

            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            const selectedBtn = buttons[optIndex];
            selectedBtn.classList.remove('opacity-50');
            
            if (isCorrect) {
                selectedBtn.classList.add('correct', 'border-emerald-500');
                feedbackText.innerHTML = "<span class='text-emerald-600 font-black text-xl'><i class='fa-solid fa-circle-check mr-2'></i> BOO-YAH! Target Acquired!</span>";
                if (!answeredQuizzes.has(slideIndex)) {
                    addXP(100);
                    answeredQuizzes.add(slideIndex);
                    if (slidesData[slideIndex].type !== 'final_quiz') fireConfetti(100);
                }
            } else {
                selectedBtn.classList.add('incorrect', 'border-rose-500');
                selectedBtn.classList.add('shake');
                feedbackText.innerHTML = "<span class='text-rose-600 font-black text-xl'><i class='fa-solid fa-triangle-exclamation mr-2'></i> Incorrect Evaluation</span>";
                
                slidesData[slideIndex].options.forEach((opt, idx) => {
                    if(opt.correct) {
                        buttons[idx].classList.add('correct', 'border-emerald-500');
                        buttons[idx].classList.remove('opacity-50');
                    }
                });
            }
            feedbackBox.classList.remove('hidden');
        }

        function showResults() {
            const finalQuestions = slidesData.filter(s => s.type === 'final_quiz').length;
            const correctFinals = Array.from(answeredQuizzes).filter(idx => slidesData[idx] && slidesData[idx].type === 'final_quiz').length;
            const percentage = Math.round((correctFinals / finalQuestions) * 100);
            const passed = percentage >= 70;

            const wrapper = document.getElementById('slides-wrapper');
            wrapper.children[slidesData.length - 1].innerHTML = `
                <div class="min-w-full h-full flex flex-col items-center justify-center p-8 text-center fade-in">
                    <div class="glass-panel p-12 rounded-3xl border border-slate-200 shadow-2xl bg-white max-w-2xl w-full">
                        <div class="w-28 h-28 rounded-full ${passed ? 'bg-emerald-100 text-emerald-600 border border-emerald-200' : 'bg-rose-100 text-rose-600 border border-rose-200'} flex items-center justify-center mb-8 text-6xl shadow-inner mx-auto">
                            <i class="fa-solid ${passed ? 'fa-medal' : 'fa-skull-crossbones'}"></i>
                        </div>
                        <h2 class="text-4xl font-black mb-4 text-slate-900">Evaluation ${passed ? 'Passed' : 'Failed'}</h2>
                        <div class="text-7xl font-mono font-black mb-6 ${passed ? 'text-emerald-600' : 'text-rose-600'}">${percentage}%</div>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-8">
                            <p class="text-slate-600 text-lg">
                                Experience Gained: <strong class="text-blue-600 font-mono text-2xl ml-2">${xpScore} XP</strong><br><br>
                                <span class="text-sm font-medium">
                                ${passed ? 'BOO-YAH! Outstanding analysis. You have successfully analyzed the realities of Equity and Stock Compensation.' : 'Review the intelligence briefs on Treasury Stock and Cash Flows, then retry.'}
                                </span>
                            </p>
                        </div>
                        <button onclick="location.reload()" class="px-10 py-4 bg-slate-900 hover:bg-black text-white shadow-xl shadow-slate-900/20 rounded-full font-bold text-lg transition-transform hover:scale-105">
                            Restart Analysis <i class="fa-solid fa-rotate-right ml-3"></i>
                        </button>
                    </div>
                </div>
            `;

            if (passed) fireConfetti(300);
        }

        // --- CONFETTI ENGINE ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let isAnimating = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f43f5e', '#f59e0b'];

        function fireConfetti(amount) {
            for (let i = 0; i < amount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + (Math.random() * 200),
                    vy: (Math.random() * -15) - 5,
                    vx: (Math.random() * 20) - 10,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() * 10) - 5,
                    shape: Math.random() > 0.5 ? 'circle' : 'square',
                    opacity: 1
                });
            }
            if (!isAnimating) animateConfetti();
        }

        function animateConfetti() {
            if (particles.length === 0) {
                isAnimating = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            isAnimating = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.vy += 0.4;
                p.y += p.vy;
                p.x += p.vx;
                p.rotation += p.rotationSpeed;
                p.opacity -= 0.005;

                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                if (p.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                }
                ctx.restore();

                if (p.y > canvas.height || p.opacity <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateConfetti);
        }

        // Start App
        init();
    </script>
</body>
</html>
