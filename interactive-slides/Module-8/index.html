<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a; /* Neutral 950 - Darker for contrast */
            color: #f1f5f9;
            overflow: hidden;
            font-size: 18px;
        }

        /* Slide Transition Effects */
        .slide-container {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Flip Card Effect */
        .perspective-1000 {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        /* Generic Flip Card Styles */
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .flip-card-front {
            background: linear-gradient(135deg, #171717 0%, #262626 100%);
            color: white;
            border: 1px solid #404040;
        }
        .flip-card-front:hover {
            border-color: #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }
        .flip-card-back {
            background: linear-gradient(135deg, #eab308 0%, #a16207 100%);
            color: white;
            transform: rotateY(180deg);
            border: 1px solid #facc15;
        }
        .flip-card-back.wrong {
             background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
             border-color: #ef4444;
        }

        /* Custom Scrollbar for TOC */
        .toc-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .toc-scroll::-webkit-scrollbar-track {
            background: #171717;
        }
        .toc-scroll::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .glass-panel {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .quiz-btn {
            transition: all 0.2s;
            font-size: 1.1rem;
            padding: 1.25rem;
        }
        .quiz-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            background-color: #262626;
            border-color: #facc15;
        }
        .quiz-btn.correct {
            background-color: #16a34a;
            border-color: #16a34a;
        }
        .quiz-btn.incorrect {
            background-color: #dc2626;
            border-color: #dc2626;
            opacity: 0.8;
        }

        /* Table Styling */
        .equity-table th {
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #d4d4d4;
        }
        .equity-table td {
            font-variant-numeric: tabular-nums;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Backface Visibility for inline styles */
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }

    </style>

        function revealElement(id) {
            const el = document.getElementById(id);
            const btn = document.getElementById('reveal-btn-' + id);
            if(el) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            }
            if(btn) {
                btn.style.display = 'none';
            }
        }

        function revealTableRows(tableId) {
            const rows = document.querySelectorAll(`#${tableId} .opacity-0`);
            if(rows.length > 0) {
                rows[0].classList.remove('opacity-0');
                rows[0].classList.add('fade-in');
            }
            
            const remaining = document.querySelectorAll(`#${tableId} .opacity-0`);
            if(remaining.length === 0) {
                const btn = document.getElementById('reveal-rows-btn');
                const btn2 = document.getElementById('reveal-rows-btn-2');
                if(btn) {
                    btn.innerText = "All Revealed";
                    btn.disabled = true;
                    btn.classList.add('opacity-50');
                }
                if(btn2) {
                    btn2.style.display = 'none';
                }
            }
        }

        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const emojis = ['💸', '💰', '💵', '🤑', '📈', '💎', '🚀'];

        function fireConfetti(amount) {
            for (let i = 0; i < amount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -Math.random() * canvas.height, // Start above screen
                    vy: Math.random() * 5 + 3, // Velocity Y
                    vx: Math.random() * 4 - 2, // Velocity X
                    emoji: emojis[Math.floor(Math.random() * emojis.length)],
                    size: Math.random() * 25 + 20,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 4 - 2
                });
            }
            if (!isAnimating) animateConfetti();
        }

        let isAnimating = false;

        function animateConfetti() {
            if (particles.length === 0) {
                isAnimating = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            isAnimating = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.y += p.vy;
                p.x += p.vx;
                p.rotation += p.rotationSpeed;

                ctx.font = `${p.size}px serif`;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillText(p.emoji, 0, 0);
                ctx.restore();

                // Remove particles off screen
                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateConfetti);
        }

        // Start
        init();

    </script>
</body>
</html>
